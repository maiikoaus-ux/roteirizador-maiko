function _authClient(){
  if(!window.supabase||!window.supabase.auth){
    if(window.showToast)window.showToast('SDK do Supabase indisponível. Verifique sua conexão.');
    return null;
  }
  return window.supabase;
}
function _authFriendlyError(err){
  const msg=String(err&&err.message||err||'').toLowerCase();
  if(msg.includes('invalid login credentials'))return 'Email ou senha incorretos.';
  if(msg.includes('email not confirmed'))return 'Email ainda não confirmado. Verifique sua caixa de entrada.';
  if(msg.includes('user already registered'))return 'Este email já está cadastrado. Tente entrar.';
  if(msg.includes('password should be at least'))return 'Senha muito curta. Use pelo menos 6 caracteres.';
  if(msg.includes('unable to validate email'))return 'Email inválido.';
  if(msg.includes('rate limit'))return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(msg.includes('failed to fetch')||msg.includes('network'))return 'Falha de rede. Verifique sua conexão.';
  return err&&err.message?err.message:'Erro inesperado.';
}
function _authValidEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());}

window.authSignIn=async function(email,password){
  const sb=_authClient();if(!sb)return{ok:false,error:'sdk'};
  email=String(email||'').trim();password=String(password||'');
  if(!_authValidEmail(email))return{ok:false,error:'Email inválido.'};
  if(!password)return{ok:false,error:'Informe sua senha.'};
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    return{ok:true,data};
  }catch(e){
    const friendly=_authFriendlyError(e);
    if(window.showToast)window.showToast(friendly);
    return{ok:false,error:friendly};
  }
};

window._authGoogleClick=async function(){
  if(window._authState.busy)return;
  window._authState.busy=true;_authRerender();

  if(!r||!r.ok){
    window._authState.busy=false;
    window._authState.msg={kind:'error',text:(r&&r.error)||'Não foi possível abrir o login Google.'};
    _authRerender();
  }
  // Se ok, o navegador será redirecionado pelo Supabase; não precisa rerender.
};

window._authSwitchMode=function(mode){
  if(window._authState.busy)return;
  window._authState.mode=mode==='signup'?'signup':'signin';
  window._authState.msg=null;
  window._authState.resetOpen=false;
  _authRerender(true);
};

window._authToggleReset=function(open){
  if(window._authState.busy)return;
  window._authState.resetOpen=!!open;
  window._authState.msg=null;
  _authRerender(true);
};

window._authSubmit=async function(){
  if(window._authState.busy)return;
  const emailEl=document.getElementById('auth-email');
  const passEl=document.getElementById('auth-password');
  const email=emailEl?emailEl.value:'';
  const password=passEl?passEl.value:'';
  window._authState.busy=true;window._authState.msg=null;_authRerender();
  try{
    if(window._authState.mode==='signup'){
      const r=await window.authSignUp(email,password);
      if(r.ok){
        window._authState.msg={kind:'success',text:'Verifique seu email para confirmar o cadastro antes de entrar.'};
        if(window.showToast)window.showToast('Verifique seu email para confirmar o cadastro antes de entrar.');
        window._authState.mode='signin';
      }else{
        window._authState.msg={kind:'error',text:r.error||'Não foi possível criar a conta.'};
      }
    }else{
      const r=await window.authSignIn(email,password);
      if(!r.ok){
        window._authState.msg={kind:'error',text:r.error||'Não foi possível entrar.'};
      }
      // Em caso de sucesso, onAuthStateChange (SIGNED_IN) cuida do hide.
    }
  }finally{
    window._authState.busy=false;_authRerender();
  }
};

window._authSubmitReset=async function(){
  if(window._authState.busy)return;
  const emailEl=document.getElementById('auth-reset-email');
  const email=emailEl?emailEl.value:'';
  window._authState.busy=true;window._authState.msg=null;_authRerender();

    const r=await window.authResetPassword(email);

      window._authState.msg={kind:'success',text:'Se este email estiver cadastrado, você receberá um link para redefinir a senha.'};

  }
};

// ── Sync indicator state machine ──
window._syncState={inflight:0,hasError:false,offline:true};
function _syncSetOffline(off){window._syncState.offline=!!off;_syncRender();}
function _syncStart(){window._syncState.inflight++;_syncRender();}
function _syncOk(){
  window._syncState.inflight=Math.max(0,window._syncState.inflight-1);
  if(window._syncState.inflight===0)window._syncState.hasError=false;
  _syncRender();
}
function _syncErr(){
  window._syncState.inflight=Math.max(0,window._syncState.inflight-1);
  window._syncState.hasError=true;
  _syncRender();
}
function _syncRender(){
  const el=document.getElementById('sb-sync');if(!el)return;
  const s=window._syncState;
  el.classList.toggle('is-offline',!!s.offline);
  el.classList.toggle('is-syncing',!s.offline&&s.inflight>0&&!s.hasError);
  el.classList.toggle('is-error',!s.offline&&s.hasError);
  el.title=s.offline?'Sem sessão':(s.hasError?'Erro de sync':(s.inflight>0?'Sincronizando...':'Sincronizado'));
}

async function _remoteSession(){
  if(!window.supabase||!window.supabase.auth)return null;
  try{const{data}=await window.supabase.auth.getSession();return data&&data.session||null;}
  catch(e){return null;}
}

window.remoteUpsertRoteiro=async function(roteiro){
  const sess=await _remoteSession();if(!sess||!roteiro||!roteiro.id)return null;
  _syncStart();
  try{
    const row={id:String(roteiro.id),user_id:sess.user.id,data:roteiro,updated_at:new Date().toISOString()};
    const{error}=await window.supabase.from('roteiros').upsert(row,{onConflict:'id'});
    if(error)throw error;
    _syncOk();return{ok:true};
  }catch(e){console.warn('remoteUpsertRoteiro:',e&&e.message||e);_syncErr();return{ok:false,error:e};}
};
window.remoteDeleteRoteiro=async function(id){
  const sess=await _remoteSession();if(!sess||!id)return null;
  _syncStart();
  try{
    const{error}=await window.supabase.from('roteiros').delete().eq('id',String(id)).eq('user_id',sess.user.id);
    if(error)throw error;
    _syncOk();return{ok:true};
  }catch(e){console.warn('remoteDeleteRoteiro:',e&&e.message||e);_syncErr();return{ok:false,error:e};}
};
window.remoteLoadRoteiros=async function(){
  const sess=await _remoteSession();if(!sess)return null;
  _syncStart();
  try{
    const{data,error}=await window.supabase.from('roteiros').select('id,data,updated_at').eq('user_id',sess.user.id).order('updated_at',{ascending:false});
    if(error)throw error;
    _syncOk();return Array.isArray(data)?data:[];
  }catch(e){console.warn('remoteLoadRoteiros:',e&&e.message||e);_syncErr();return null;}
};

// ── Remote CRUD: docs ──
window.remoteUpsertDoc=async function(doc){
  const sess=await _remoteSession();if(!sess||!doc||!doc.id)return null;
  _syncStart();
  try{
    const row={id:String(doc.id),user_id:sess.user.id,data:doc,updated_at:new Date().toISOString()};
    const{error}=await window.supabase.from('docs').upsert(row,{onConflict:'id'});
    if(error)throw error;
    _syncOk();return{ok:true};
  }catch(e){console.warn('remoteUpsertDoc:',e&&e.message||e);_syncErr();return{ok:false,error:e};}
};
window.remoteDeleteDoc=async function(id){
  const sess=await _remoteSession();if(!sess||!id)return null;
  _syncStart();
  try{
    const{error}=await window.supabase.from('docs').delete().eq('id',String(id)).eq('user_id',sess.user.id);
    if(error)throw error;
    _syncOk();return{ok:true};
  }catch(e){console.warn('remoteDeleteDoc:',e&&e.message||e);_syncErr();return{ok:false,error:e};}
};
window.remoteLoadDocs=async function(){
  const sess=await _remoteSession();if(!sess)return null;
  _syncStart();
  try{
    const{data,error}=await window.supabase.from('docs').select('id,data,updated_at').eq('user_id',sess.user.id).order('updated_at',{ascending:false});
    if(error)throw error;
    _syncOk();return Array.isArray(data)?data:[];
  }catch(e){console.warn('remoteLoadDocs:',e&&e.message||e);_syncErr();return null;}
};

// ── Remote CRUD: workspace (single row per user) ──
window.remoteSaveWorkspace=async function(data){
  const sess=await _remoteSession();if(!sess)return null;
  _syncStart();
  try{
    const row={user_id:sess.user.id,data:data||{},updated_at:new Date().toISOString()};
    const{error}=await window.supabase.from('workspace').upsert(row,{onConflict:'user_id'});
    if(error)throw error;
    _syncOk();return{ok:true};
  }catch(e){console.warn('remoteSaveWorkspace:',e&&e.message||e);_syncErr();return{ok:false,error:e};}
};
window.remoteLoadWorkspace=async function(){
  const sess=await _remoteSession();if(!sess)return null;
  _syncStart();
  try{
    const{data,error}=await window.supabase.from('workspace').select('data,updated_at').eq('user_id',sess.user.id).maybeSingle();
    if(error)throw error;
    _syncOk();return data||null;
  }catch(e){console.warn('remoteLoadWorkspace:',e&&e.message||e);_syncErr();return null;}
};

// ── Workspace blob (collect/apply) ──
function _collectWorkspaceBlob(){
  let bbArrowStyle=null;
  try{bbArrowStyle=localStorage.getItem(window._BB_ARROW_STYLE_KEY||'rmc_bb_arrow_style');}catch(e){}
  return{
    wsBoard:wsLoadBoardRaw(),
    bbArrows:Array.isArray(window._bbArrows)?window._bbArrows:[],
    beatCards:Array.isArray(S.beatCards)?S.beatCards:[],
    prefs:{
      workspaceTab:S.workspaceTab||'roteiros',
      workspaceFilter:S.workspaceFilter||'all',
      workspaceListFilter:S.workspaceListFilter||'all',
      workspaceSort:S.workspaceSort||'recent',
      docsSort:window._docsSort||null,
      activeDocId:S.activeDocId||null,
      bbArrowStyle:bbArrowStyle
    }
  };
}
function _applyWorkspaceBlob(data){
  if(!data||typeof data!=='object')return;
  // Aplicação acontece com _phaseB_ready=false (durante hydrate) → hooks são no-op,
  // o que evita loop de save. _phaseB_ready é setado para true só após hydrate completar.
  try{
    if(data.wsBoard&&Array.isArray(data.wsBoard.columns)){wsSaveBoardRaw(data.wsBoard);}
    if(Array.isArray(data.bbArrows)){
      window._bbArrows=data.bbArrows;
      try{localStorage.setItem('rmc_bb_arrows',JSON.stringify(data.bbArrows));}catch(e){}
    }
    if(Array.isArray(data.beatCards)){
      S.beatCards=data.beatCards;
      try{localStorage.setItem('rmc_beat_cards',JSON.stringify(S.beatCards));}catch(e){}
    }
    const p=data.prefs||{};
    if(p.workspaceTab==='roteiros'||p.workspaceTab==='beatboard'||p.workspaceTab==='docs'){
      S.workspaceTab=p.workspaceTab;
      try{localStorage.setItem('rmc_workspace_tab',p.workspaceTab);}catch(e){}
    }
    const okF=['all','draft','ready','no_presenter','has_duration','has_blocks','long_text'];
    if(okF.includes(p.workspaceFilter)){
      S.workspaceFilter=p.workspaceFilter;
      try{localStorage.setItem('rmc_workspace_filter',p.workspaceFilter);}catch(e){}
    }
    if(p.workspaceListFilter){
      S.workspaceListFilter=String(p.workspaceListFilter);
      try{localStorage.setItem('rmc_workspace_list',S.workspaceListFilter);}catch(e){}
    }
    if(['recent','title','duration','progress'].includes(p.workspaceSort)){
      S.workspaceSort=p.workspaceSort;
      try{localStorage.setItem('rmc_workspace_sort',p.workspaceSort);}catch(e){}
    }
    if(p.docsSort){
      window._docsSort=p.docsSort;
      try{localStorage.setItem('rmc_docs_list_sort',p.docsSort);}catch(e){}
    }
    if(p.activeDocId){
      S.activeDocId=p.activeDocId;
      try{localStorage.setItem('rmc_docs_active',p.activeDocId);}catch(e){}
    }
    if(p.bbArrowStyle){
      try{localStorage.setItem(window._BB_ARROW_STYLE_KEY||'rmc_bb_arrow_style',p.bbArrowStyle);}catch(e){}
    }
  }catch(e){console.warn('_applyWorkspaceBlob:',e);}
}
function _scheduleWorkspaceSave(){
  if(!_phaseB_ready)return;
  clearTimeout(_wsSaveDebounce);
  _wsSaveDebounce=setTimeout(function(){window.remoteSaveWorkspace(_collectWorkspaceBlob());},1500);
}

// ── Hooks chamados pelas funções locais ──
function _phaseB_workspaceHook(){
  if(!_phaseB_ready)return;
  if(S.sharedContext)return; // não sobrescreve workspace remoto durante visualização compartilhada
  _scheduleWorkspaceSave();
}
function _phaseB_persistRoteiroHook(r){
  if(!_phaseB_ready||!r||!r.id)return;
  if(S.sharedContext)return; // sharedContext usa _saveSharedRoteiro (Fase C)
  _scheduleRemoteUpsertRoteiro(r,1);
}
function _phaseB_removeRoteiroHook(id){
  if(!_phaseB_ready||!id)return;
  if(S.sharedContext)return;
  delete _persistRoteiroFails[id];
  window.remoteDeleteRoteiro(id);
}
function _scheduleRemoteUpsertRoteiro(r,attempt){
  attempt=attempt||1;
  Promise.resolve(window.remoteUpsertRoteiro(r)).then(function(res){
    if(res&&res.ok){
      delete _persistRoteiroFails[r.id];
      return;
    }
    // sem-sessão (res===null) → silencioso, sem retry
    if(res===null)return;
    _persistRoteiroFails[r.id]=(_persistRoteiroFails[r.id]||0)+1;
    if(attempt<2){
      setTimeout(function(){_scheduleRemoteUpsertRoteiro(r,attempt+1);},3000);
    }else{
      if(window.showToast)window.showToast('Roteiro salvo localmente (sync pendente)');
    }
  });
}

// ── Wraps em window.* (definidos depois desta seção, então fazemos lazy via late-binding) ──
// Os wraps reais para persistDocsStore e persistBbArrows são instalados em _phaseB_installLateWraps,
// chamado uma vez no bootstrap (pois essas funções só existem mais adiante no script).
function _phaseB_installLateWraps(){
  if(window._phaseBLateWrapsInstalled)return;
  window._phaseBLateWrapsInstalled=true;

  // persistDocsStore: diff-based delete + upsert all + workspace save (pra activeDocId)
  if(typeof window.persistDocsStore==='function'){
    const _orig=window.persistDocsStore;
    window.persistDocsStore=function(){
      const r=_orig.apply(this,arguments);
      if(_phaseB_ready){
        const cur=new Set((Array.isArray(S.docs)?S.docs:[]).map(function(d){return d.id;}));
        const removed=[];
        _lastRemoteDocIds.forEach(function(id){if(!cur.has(id))removed.push(id);});
        _lastRemoteDocIds=cur;
        (Array.isArray(S.docs)?S.docs:[]).forEach(function(d){window.remoteUpsertDoc(d);});
        removed.forEach(function(id){window.remoteDeleteDoc(id);});
        _scheduleWorkspaceSave();
      }
      return r;
    };
  }

  // persistBbArrows: workspace save
  if(typeof window.persistBbArrows==='function'){
    const _orig=window.persistBbArrows;
    window.persistBbArrows=function(){
      const r=_orig.apply(this,arguments);
      _phaseB_workspaceHook();
      return r;
    };
  }

  // setWorkspaceTab/Filter/ListFilter/Sort: workspace save
  ['setWorkspaceTab','setWorkspaceFilter','setWorkspaceListFilter','setWorkspaceSort'].forEach(function(name){
    if(typeof window[name]==='function'){
      const _orig=window[name];
      window[name]=function(){
        const r=_orig.apply(this,arguments);
        _phaseB_workspaceHook();
        return r;
      };
    }
  });
}

// ── Replace local datasets from remote (used by hydrate) ──
function _replaceLocalRoteiros(rows){
  // rows: [{id, data, updated_at}]
  const prevIds=sGet(IDX_KEY)||[];
  const newRoteiros=[];
  const newIds=[];
  rows.forEach(function(row){
    if(!row||!row.data||!row.id)return;
    const r=row.data;
    r.id=String(row.id);
    if(typeof r.updatedAt!=='number'){
      const t=row.updated_at?Date.parse(row.updated_at):Date.now();
      r.updatedAt=isFinite(t)?t:Date.now();
    }
    newRoteiros.push(r);
    newIds.push(r.id);
    sSet(ROT_KEY(r.id),r);
  });
  // Remove locais que não estão no remoto
  prevIds.forEach(function(pid){if(!newIds.includes(pid))sDel(ROT_KEY(pid));});
  S.roteiros=newRoteiros;
  sSet(IDX_KEY,newIds);
  // Reconcilia o board (mantém colunas se existirem)
  try{wsSyncIdxFromBoard();}catch(e){}
}
function _replaceLocalDocs(rows){
  const arr=[];
  rows.forEach(function(row){
    if(!row||!row.data||!row.id)return;
    const d=row.data;
    d.id=String(row.id);
    arr.push(d);
  });
  S.docs=arr;
  try{sSet(DOCS_STORE_KEY,S.docs);}catch(e){}
}

// ── Hydrate principal ──
window.remoteHydrate=async function(){
  const sess=await _remoteSession();
  if(!sess){_syncSetOffline(true);return;}
  _syncSetOffline(false);

  // Proteção cross-user: se outro usuário tinha dados nesse navegador, limpa o cache local.
  // Migração local→remoto só ocorre se for o mesmo usuário OU primeiro uso (lastUid null).
  const curUid=sess.user.id;
  const lastUid=_getLastUserId();
  const allowMigrateLocal=!lastUid||lastUid===curUid;
  if(lastUid&&lastUid!==curUid){
    _clearLocalUserData();
    if(window.render&&(S.view==='home'||S.view==='trello'))try{window.render();}catch(e){}
  }

  _syncStart();
  try{
    const results=await Promise.allSettled([
      window.remoteLoadRoteiros(),
      window.remoteLoadDocs(),
      window.remoteLoadWorkspace()
    ]);
    const remoteRots=(results[0].status==='fulfilled'&&results[0].value)?results[0].value:null;
    const remoteDocs=(results[1].status==='fulfilled'&&results[1].value)?results[1].value:null;
    const remoteWs  =(results[2].status==='fulfilled'&&results[2].value)?results[2].value:null;

    // Roteiros
    if(remoteRots&&remoteRots.length>0){
      _replaceLocalRoteiros(remoteRots);
    }else if(allowMigrateLocal&&Array.isArray(S.roteiros)&&S.roteiros.length>0){
      // Migração silenciosa
      S.roteiros.forEach(function(r){window.remoteUpsertRoteiro(r);});
    }

    // Docs
    if(remoteDocs&&remoteDocs.length>0){
      _replaceLocalDocs(remoteDocs);
      _lastRemoteDocIds=new Set(remoteDocs.map(function(r){return String(r.id);}));
    }else if(allowMigrateLocal&&Array.isArray(S.docs)&&S.docs.length>0){
      _lastRemoteDocIds=new Set(S.docs.map(function(d){return d.id;}));
      S.docs.forEach(function(d){window.remoteUpsertDoc(d);});
    }else{
      _lastRemoteDocIds=new Set();
    }

    // Workspace
    if(remoteWs&&remoteWs.data&&Object.keys(remoteWs.data).length>0){
      _applyWorkspaceBlob(remoteWs.data);
    }else if(allowMigrateLocal){
      // Migra workspace local
      window.remoteSaveWorkspace(_collectWorkspaceBlob());
    }

    // Marca este browser como pertencente ao usuário atual
    _setLastUserId(curUid);

    // Re-render condicional (não interrompe editor/viewer)
    if(S.view==='home'||S.view==='trello'){
      try{window.render&&window.render();}catch(e){console.warn('render after hydrate:',e);}
    }
  }finally{
    _phaseB_ready=true;
    _phaseB_installLateWraps();
    _syncOk();
  }
};

// === SECTION: SHARING + REALTIME (Phase C) ===
// Tabela: shares (roteiro_id, owner_id, share_token, permission, expires_at, allowed_email, created_at)
// RLS em roteiros: owner OU usuário com share válido pode ver/editar segundo permission.

const SHARE_BASE_URL=window.location.origin+window.location.pathname;
const SHARE_BUCKET_KEY='maiko_share_provider_hint';

// Estado runtime de sharing/realtime
window._phaseC={
  channel:null,        // RealtimeChannel ativo
  channelKey:null,     // id do roteiro inscrito
  collabTimer:null,
  saveTimer:null,
  lastApplied:0,       // updated_at last applied (epoch ms)
  shareModalEl:null
};

// ── Helpers ──
function _phaseC_genToken(){
  // 32 chars [a-z0-9]
  if(window.crypto&&window.crypto.getRandomValues){
    const b=new Uint8Array(24);window.crypto.getRandomValues(b);
    return Array.from(b).map(function(x){return x.toString(36).padStart(2,'0').slice(-2);}).join('').slice(0,32);
  }
  return (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,32);
}
function _phaseC_supabase(){return window.supabase;}
async function _phaseC_session(){
  const sb=_phaseC_supabase();if(!sb||!sb.auth)return null;
  const{data}=await sb.auth.getSession();return data&&data.session||null;
}
function _phaseC_urlToken(){
  try{
    const u=new URL(window.location.href);
    const t=u.searchParams.get('token');
    return t&&t.trim()?t.trim():null;
  }catch(e){return null;}
}
function _phaseC_clearUrlToken(){
  try{
    const u=new URL(window.location.href);
    u.searchParams.delete('token');
    u.searchParams.delete('p');
    const qs=u.searchParams.toString();
    const newUrl=u.pathname+(qs?'?'+qs:'')+u.hash;
    window.history.replaceState({},document.title,newUrl);
  }catch(e){}
}

// ── CRUD shares ──
window.shareRoteiro=async function(roteiroId,permission,opts){
  permission=(permission==='edit')?'edit':'view';
  const sess=await _phaseC_session();
  if(!sess)return{ok:false,error:'Faça login para compartilhar.'};
  const sb=_phaseC_supabase();
  const token=_phaseC_genToken();
  const row={
    roteiro_id:roteiroId,
    owner_id:sess.user.id,
    share_token:token,
    permission:permission,
    allowed_email:(opts&&opts.allowedEmail)?String(opts.allowedEmail).toLowerCase().trim():null,
    expires_at:(opts&&opts.expiresAt)||null
  };
  try{
    const{data,error}=await sb.from('shares').insert(row).select().single();
    if(error)throw error;
    return{ok:true,share:data,url:SHARE_BASE_URL+'?token='+token};
  }catch(e){
    console.warn('shareRoteiro:',e);
    return{ok:false,error:e.message||'Falha ao criar share.'};
  }
};

window.unshareRoteiro=async function(shareId){
  const sb=_phaseC_supabase();if(!sb)return{ok:false};
  try{
    const{error}=await sb.from('shares').delete().eq('id',shareId);
    if(error)throw error;
    return{ok:true};
  }catch(e){
    console.warn('unshareRoteiro:',e);
    return{ok:false,error:e.message||'Falha ao revogar.'};
  }
};

window.updateSharePermission=async function(shareId,permission){

window.loadSharesForRoteiro=async function(roteiroId){

window.loadShareByToken=async function(token){

// ── Open shared roteiro ──
window.openSharedByToken=async function(token){
  const sb=_phaseC_supabase();if(!sb)return{ok:false,error:'sdk'};
  const sess=await _phaseC_session();
  if(!sess){
    // Sem sessão: armazena o token na URL e mostra a tela de auth com Google em destaque.
    try{
      const u=new URL(window.location.href);
      u.searchParams.set('token',token);
      u.searchParams.set('p','g');
      window.history.replaceState({},document.title,u.pathname+'?'+u.searchParams.toString()+u.hash);
    }catch(e){}
    window._authGoogleHighlighted=true;
    window.showAuthScreen&&window.showAuthScreen();
    return{ok:false,error:'Faça login para abrir o link compartilhado.'};
  }
  const share=await window.loadShareByToken(token);
  if(!share){
    if(window.showToast)window.showToast('Link inválido ou revogado.');
    _phaseC_clearUrlToken();
    return{ok:false,error:'Link inválido ou revogado.'};
  }
  if(share.expires_at){
    const exp=Date.parse(share.expires_at);
    if(!isNaN(exp)&&exp<Date.now()){
      if(window.showToast)window.showToast('Link expirado.');
      _phaseC_clearUrlToken();
      return{ok:false,error:'Link expirado.'};
    }
  }
  if(share.allowed_email){
    const myEmail=String(sess.user.email||'').toLowerCase();
    if(share.allowed_email!==myEmail){
      if(window.showToast)window.showToast('Este link foi destinado a outro email.');
      _phaseC_clearUrlToken();
      return{ok:false,error:'Email não autorizado para este link.'};
    }
  }
  // Carrega o roteiro pela RLS estendida (owner OR shares.user pode ver)
  let roteiro=null;
  try{
    const{data,error}=await sb.from('roteiros').select('*').eq('id',share.roteiro_id).maybeSingle();
    if(error)throw error;
    roteiro=data;
  }catch(e){
    console.warn('open shared roteiro:',e);
    if(window.showToast)window.showToast('Não foi possível carregar o roteiro.');
    _phaseC_clearUrlToken();
    return{ok:false,error:e.message||'Falha ao carregar.'};
  }
  if(!roteiro){
    if(window.showToast)window.showToast('Roteiro não encontrado.');
    _phaseC_clearUrlToken();
    return{ok:false,error:'Roteiro não encontrado.'};
  }
  // Configura sharedContext
  S.sharedContext={
    token:token,
    shareId:share.id,
    roteiroId:share.roteiro_id,
    ownerId:share.owner_id,
    permission:share.permission==='edit'?'edit':'view',
    isOwner:share.owner_id===sess.user.id
  };
  // Monta draft a partir do payload remoto
  const blob=roteiro.data||{};
  const draft={
    id:roteiro.id,
    title:blob.title||roteiro.title||'',
    presenter:blob.presenter||'',
    description:blob.description||'',
    blocks:Array.isArray(blob.blocks)?blob.blocks:[],
    versions:Array.isArray(blob.versions)?blob.versions:[],
    audioPlayback:blob.audioPlayback||1,
    videoPlayback:blob.videoPlayback||1,
    createdAt:roteiro.created_at||blob.createdAt||Date.now(),
    updatedAt:Date.parse(roteiro.updated_at||0)||blob.updatedAt||Date.now()
  };
  S.draft=draft;
  S.view='editor';
  _phaseC.lastApplied=draft.updatedAt||Date.now();
  // Aplica modo readonly visual
  _phaseC_applyReadonlyClass(S.sharedContext.permission==='view');
  // Renderiza editor
  try{window.renderEditor&&window.renderEditor();}catch(e){console.warn('renderEditor shared:',e);}
  _phaseC_decorateEditor();
  // Reset flag de RLS denied para nova sessão
  window._phaseC.saveDenied=false;
  // Resolve identidade do user (cache pra last editor + cores)
  _phaseC_resolveCurrentUser();
  // Inscreve realtime no roteiro + no share
  _subscribeRealtimeRoteiro(share.roteiro_id);
  _subscribeRealtimeShare(share.id);
  // Mostra last editor existente, se houver
  if(blob.lastEditor)_phaseC_renderLastEditorPill(blob.lastEditor);
  return{ok:true};
};

function _phaseC_applyReadonlyClass(on){
  try{
    if(on)document.body.classList.add('is-share-readonly');
    else document.body.classList.remove('is-share-readonly');
  }catch(e){}
}

function _phaseC_decorateEditor(){
  if(!S.sharedContext)return;
  const ro=S.sharedContext.permission==='view';
  // Badge no topbar
  const topbar=document.querySelector('.editor-topbar .section-label');
  if(topbar&&!topbar.querySelector('.share-badge')){
    const badge=document.createElement('span');
    badge.className='share-badge'+(ro?' is-readonly':'');
    badge.textContent=ro?'somente leitura':'colab — edição';
    topbar.appendChild(badge);
  }else if(topbar){
    const badge=topbar.querySelector('.share-badge');
    if(badge){
      badge.classList.toggle('is-readonly',ro);
      // só reseta texto se não tiver status sendo exibido
      if(!badge.classList.contains('is-saving')&&!badge.classList.contains('is-saved')&&!badge.classList.contains('is-error')){
        badge.textContent=ro?'somente leitura':'colab — edição';
      }
    }
  }
  // Topbar actions
  if(ro){
    document.querySelectorAll('.editor-actions .editor-chrome-btn--primary').forEach(function(b){b.remove();});
    document.querySelectorAll('.editor-actions [onclick*="openShareModal"]').forEach(function(b){b.remove();});
  }
  document.querySelectorAll('.editor-actions .editor-chrome-btn').forEach(function(b){
    if(b.textContent.trim().toLowerCase()==='cancelar'){
      b.textContent='Sair do compartilhamento';
      b.setAttribute('onclick','window.exitSharedContext()');
    }
  });
  // View mode: trava efetivamente todos os controles + remove botões de mutação do DOM
  if(ro){
    const root=document.querySelector('.editor-shell');
    if(root){
      root.querySelectorAll('input, textarea, select').forEach(function(el){
        try{el.setAttribute('disabled','disabled');el.setAttribute('readonly','readonly');}catch(e){}
      });
      root.querySelectorAll('[contenteditable="true"]').forEach(function(el){
        try{el.setAttribute('contenteditable','false');}catch(e){}
      });
      // Remove botões de mutação do DOM (subir/descer/duplicar/remover/+adicionar bloco)
      root.querySelectorAll('.be-footer-right, .add-block-btn, .be-block-actions').forEach(function(el){el.remove();});
      root.querySelectorAll('.be-block-footer button').forEach(function(b){

      });
      // Esconde global-toolbar (negrito/itálico/etc.) - já coberto por CSS, garante via remove
      const tb=root.querySelector('.global-toolbar');if(tb)tb.style.display='none';
    }
  }
}

// ── Realtime resiliente (Phase C) ──
// Tracking de subscribes ativos para reconectar após token refresh / visibility / heartbeat.
window._phaseC.activeSubs=window._phaseC.activeSubs||{roteiroId:null,shareId:null};

function _subscribeRealtimeRoteiro(roteiroId){
  const sb=_phaseC_supabase();if(!sb||!sb.channel)return;
  _unsubscribeRealtimeRoteiro();
  if(!roteiroId)return;
  window._phaseC.activeSubs.roteiroId=roteiroId;
  try{
    const ch=sb.channel('roteiro:'+roteiroId);
    ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'roteiros',filter:'id=eq.'+roteiroId},function(payload){
      _applyRemoteRoteiroUpdate(payload&&payload.new);
    });
    ch.on('postgres_changes',{event:'DELETE',schema:'public',table:'roteiros',filter:'id=eq.'+roteiroId},function(){
      if(window.showToast)window.showToast('Este roteiro foi removido pelo dono.');
      window.exitSharedContext&&window.exitSharedContext();
    });
    ch.subscribe(function(status){
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        // re-subscribe defensivo se ainda há intenção ativa
        if(window._phaseC.activeSubs.roteiroId===roteiroId){
          setTimeout(function(){
            if(window._phaseC.activeSubs.roteiroId===roteiroId)_subscribeRealtimeRoteiro(roteiroId);
          },1500);
        }
      }
    });
    window._phaseC.channel=ch;
    window._phaseC.channelKey=roteiroId;
  }catch(e){console.warn('subscribe realtime:',e);}
}
function _unsubscribeRealtimeRoteiro(){
  const sb=_phaseC_supabase();
  const ch=window._phaseC.channel;
  if(ch&&sb&&sb.removeChannel){try{sb.removeChannel(ch);}catch(e){}}
  window._phaseC.channel=null;
  window._phaseC.channelKey=null;
  window._phaseC.activeSubs.roteiroId=null;
}

function _phaseC_focusedField(){
  const ae=document.activeElement;
  if(!ae)return null;
  if(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')return ae;
  if(ae.getAttribute&&ae.getAttribute('contenteditable')==='true')return ae;
  return null;
}
function _phaseC_blockDataIdOf(el){
  while(el&&el!==document.body){
    if(el.dataset&&(el.dataset.blockId||el.id&&/^(audio|video|notes|time)-/.test(el.id))){
      if(el.dataset.blockId)return el.dataset.blockId;
      return el.id.replace(/^(audio|video|notes|time)-/,'');
    }
    el=el.parentElement;
  }
  return null;
}

function _phaseC_blockKey(b){
  // Chave de comparação: tudo do bloco menos a id (pra detectar edição estrutural)
  if(!b)return '';
  try{
    return JSON.stringify({a:b.audio||'',v:b.video||'',n:b.notes||'',t:b.time||'',s:b.speaker||'',ph:b.phase||''});
  }catch(e){return String(b.audio||'')+'|'+String(b.video||'');}
}

function _phaseC_diffBlocks(oldBlocks,newBlocks){
  const oldMap={};(oldBlocks||[]).forEach(function(b){if(b&&b.id)oldMap[b.id]=_phaseC_blockKey(b);});
  const changedIds=[];
  (newBlocks||[]).forEach(function(b){
    if(!b||!b.id)return;
    const ok=oldMap[b.id];
    const nk=_phaseC_blockKey(b);
    if(ok===undefined||ok!==nk)changedIds.push(b.id);
  });
  return changedIds;
}

function _phaseC_highlightBlocks(ids,editor){
  if(!Array.isArray(ids)||!ids.length)return;
  const color=editor&&editor.id?_phaseC_userColor(editor.id):'#1e3a73';
  const name=editor&&(editor.name||editor.email)?(editor.name||editor.email):'Colaborador';
  const t=new Date(editor&&editor.at||Date.now());
  const hh=String(t.getHours()).padStart(2,'0'),mm=String(t.getMinutes()).padStart(2,'0');
  ids.forEach(function(id){
    const card=document.getElementById('be-'+id);
    if(!card)return;

    void card.offsetWidth;
    card.classList.add('is-recently-edited');
    // tag flutuante (com mini-avatar se houver foto)

    }else{

    }
    card.appendChild(tag);

}

function _phaseC_relativeTime(ts){
  if(!ts)return'';
  const diff=Math.max(0,Math.floor((Date.now()-ts)/1000));
  if(diff<10)return'agora';
  if(diff<60)return'há '+diff+'s';
  const m=Math.floor(diff/60);
  if(m<60)return'há '+m+'min';
  const h=Math.floor(m/60);
  if(h<24)return'há '+h+'h';
  const t=new Date(ts);
  const hh=String(t.getHours()).padStart(2,'0'),mm=String(t.getMinutes()).padStart(2,'0');
  return hh+':'+mm;
}

function _applyRemoteRoteiroUpdate(remoteRow){
  // Aceita o update mesmo SEM sharedContext (caso do dono editando seu próprio roteiro com convidado colab)
  if(!remoteRow)return;
  if(S.sharedContext){
    if(String(remoteRow.id)!==String(S.sharedContext.roteiroId))return;
  }else{
    // Dono editando: só processa se for o mesmo roteiro do draft atual
    if(!S.draft||!S.draft.id||String(remoteRow.id)!==String(S.draft.id))return;
  }
  const remoteUpdated=Date.parse(remoteRow.updated_at||0)||0;
  // Suprime echo do próprio save: comparação de timestamp + janela de 1500ms
  if(remoteUpdated&&remoteUpdated<=window._phaseC.lastApplied)return;
  if(window._phaseC.lastSaveAt&&Date.now()-window._phaseC.lastSaveAt<1500){
    // Se a edição é minha (lastEditor === me), suprime
    const me=_phaseC_currentUser();
    const ed=remoteRow.data&&remoteRow.data.lastEditor;
    if(me&&ed&&ed.id===me.id)return;
  }
  const blob=remoteRow.data||{};
  const focused=_phaseC_focusedField();
  const focusedBlockId=focused?_phaseC_blockDataIdOf(focused):null;
  // Detecta diff de blocos antes do merge
  const oldBlocks=Array.isArray(S.draft&&S.draft.blocks)?S.draft.blocks:[];
  const remoteBlocks=Array.isArray(blob.blocks)?blob.blocks:oldBlocks;
  const changedIds=_phaseC_diffBlocks(oldBlocks,remoteBlocks).filter(function(id){return String(id)!==String(focusedBlockId);});
  // Aplica meta sem perturbar inputs focados
  const newDraft=Object.assign({},S.draft,{
    title:blob.title!==undefined?blob.title:S.draft.title,
    presenter:blob.presenter!==undefined?blob.presenter:S.draft.presenter,
    description:blob.description!==undefined?blob.description:S.draft.description,
    audioPlayback:blob.audioPlayback||S.draft.audioPlayback,
    videoPlayback:blob.videoPlayback||S.draft.videoPlayback,
    versions:Array.isArray(blob.versions)?blob.versions:S.draft.versions,
    lastEditor:blob.lastEditor||S.draft.lastEditor,
    updatedAt:remoteUpdated||Date.now()
  });
  // Mescla blocos: blocos atualmente em edição (focado dentro deles) ficam intactos
  if(Array.isArray(blob.blocks)){
    if(focusedBlockId){
      const newBlocks=blob.blocks.map(function(rb){
        if(String(rb.id)===String(focusedBlockId)){
          const local=S.draft.blocks.find(function(b){return String(b.id)===String(focusedBlockId);});
          return local||rb;
        }
        return rb;
      });
      const remoteIds=new Set(blob.blocks.map(function(b){return String(b.id);}));
      S.draft.blocks.forEach(function(b){
        if(!remoteIds.has(String(b.id))&&String(b.id)===String(focusedBlockId))newBlocks.push(b);
      });
      newDraft.blocks=newBlocks;
    }else{
      newDraft.blocks=blob.blocks;
    }
  }
  S.draft=newDraft;
  window._phaseC.lastApplied=remoteUpdated||Date.now();
  // Re-render não-destrutivo
  try{
    if(!focused){
      window.renderEditor&&window.renderEditor();
      if(S.sharedContext)_phaseC_decorateEditor();
    }else{
      window.updatePreview&&window.updatePreview();
    }
  }catch(e){console.warn('apply remote update:',e);}
  // UI de quem editou o quê
  const editor=blob.lastEditor;
  if(editor){
    _phaseC_renderLastEditorPill(editor);
    // marca highlights nos blocos que mudaram (depois do render pra DOM existir)
    setTimeout(function(){_phaseC_highlightBlocks(changedIds,editor);},focused?0:60);
  }
  _showCollabPing();
}

// ── Identidade do usuário (pra last editor / colab) ──
function _phaseC_currentUser(){
  // Cache via _phaseC para evitar repetidos getSession.
  return window._phaseC._cachedUser||null;
}
async function _phaseC_resolveCurrentUser(){
  const sb=_phaseC_supabase();if(!sb||!sb.auth)return null;
  try{
    const{data}=await sb.auth.getSession();
    const sess=data&&data.session;
    if(!sess)return null;
    const u=sess.user;
    const meta=u.user_metadata||{};
    const name=meta.full_name||meta.name||(u.email||'').split('@')[0]||'Colaborador';
    const cached={id:u.id,email:u.email||'',name:name,avatar_url:meta.avatar_url||''};
    window._phaseC._cachedUser=cached;
    // Atualiza avatar da sidebar caso já esteja renderizado
    try{window._refreshSidebarAvatar&&window._refreshSidebarAvatar();}catch(e){}
    return cached;
  }catch(e){return null;}
}
function _phaseC_userColor(id){
  // hash simples → cor consistente por usuário
  let h=0;const s=String(id||'');
  for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))&0xffffffff;}
  const palette=['#1e3a73','#7a2c4d','#2c5e3a','#915b00','#4a2c7a','#a14b1e','#1f6b6b','#6b1f4a','#3a6b1f','#5b2cbf'];
  return palette[Math.abs(h)%palette.length];
}
function _phaseC_buildEditorMeta(){
  const u=_phaseC_currentUser();
  if(!u)return null;
  return{id:u.id,email:u.email,name:u.name,avatar_url:u.avatar_url||'',at:Date.now()};
}

// ── Avatar / perfil ──
function _phaseC_initials(name){
  const s=String(name||'').trim();
  if(!s)return '·';
  const parts=s.split(/\s+/).filter(Boolean);
  if(parts.length===1)return parts[0].slice(0,1).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function _phaseC_renderAvatarHTML(user,size){
  // user: {id, name, avatar_url}
  size=size||34;
  if(user&&user.avatar_url){
    const u=user.avatar_url+(user.avatar_url.indexOf('?')>=0?'&':'?')+'v='+(user._cb||'');
    return'<img src="'+window.esc(u)+'" alt="'+window.esc(user.name||'')+'" />';
  }
  const color=user&&user.id?_phaseC_userColor(user.id):'#888';
  const inits=_phaseC_initials(user&&user.name||(user&&user.email||''));
  return'<span class="profile-avatar-fallback" style="background:'+color+';font-size:'+(size*0.42)+'px">'+window.esc(inits)+'</span>';

function _phaseC_renderMiniAvatarHTML(editor){
  if(!editor)return'';

function _phaseC_renderProfileModal(user){
  _phaseC_closeProfileModal();
  const overlay=document.createElement('div');
  overlay.className='profile-overlay';
  overlay.id='profile-overlay';
  overlay.addEventListener('click',function(e){if(e.target===overlay)_phaseC_closeProfileModal();});

  const state={
    name:user.name||'',
    avatar_url:user.avatar_url||'',

    avatarPreview:null,     // dataURL para preview local
    msg:null,

  };

  function paint(){
    const previewSrc=state.avatarPreview||state.avatar_url||'';
    const previewUser={id:user.id,name:state.name||user.name,email:user.email,avatar_url:previewSrc};
    const avatarHtml=previewSrc
      ? '<img src="'+window.esc(previewSrc)+'" alt="" />'
      : _phaseC_renderAvatarHTML({id:user.id,name:state.name||user.name,email:user.email},96);
    const msgHtml=state.msg?'<div class="profile-msg is-'+state.msg.kind+'">'+window.esc(state.msg.text)+'</div>':'';
    overlay.innerHTML=`
      <div class="profile-modal" role="dialog" aria-label="Meu perfil">
        <div class="profile-hd">
          <div>
            <div class="profile-title">Meu perfil</div>
            <div class="profile-sub">como você aparece para os outros</div>
          </div>
          <button type="button" class="profile-close" onclick="window._phaseC_closeProfileModal()" aria-label="Fechar">×</button>
        </div>
        ${msgHtml}
        <div class="profile-avatar-wrap">
          <div class="profile-avatar-big" id="profile-avatar-big" title="Clique para trocar">
            ${avatarHtml}
            <div class="profile-avatar-overlay">trocar</div>
          </div>
          <div class="profile-avatar-hint">PNG ou JPG até 1MB</div>
          <input type="file" accept="image/png,image/jpeg" id="profile-avatar-input" style="display:none">
        </div>
        <div class="profile-field">
          <label class="profile-label" for="profile-name">Nome de exibição</label>
          <input id="profile-name" class="profile-input" type="text" maxlength="60" value="${window.escAttr(state.name)}" placeholder="Como você quer ser visto" ${state.busy?'disabled':''}>
        </div>
        <div class="profile-field">
          <label class="profile-label">Email</label>
          <input class="profile-input" type="email" value="${window.escAttr(user.email||'')}" readonly>
        </div>
        <div class="profile-actions">
          ${state.avatar_url?`<button type="button" class="btn btn-sm btn-ghost" onclick="window._phaseC_profileRemoveAvatar()" ${state.busy?'disabled':''}>Remover foto</button>`:''}
          <button type="button" class="btn btn-sm" onclick="window._phaseC_closeProfileModal()" ${state.busy?'disabled':''}>Cancelar</button>
          <button type="button" class="btn btn-sm btn-primary" onclick="window._phaseC_profileSave()" ${state.busy?'disabled':''}>${state.busy?'Salvando…':'Salvar'}</button>
        </div>
      </div>`;
    // bindings
    const input=document.getElementById('profile-avatar-input');
    const big=document.getElementById('profile-avatar-big');
    if(big&&input){
      big.addEventListener('click',function(){if(!state.busy)input.click();});
      input.addEventListener('change',function(){
        const f=input.files&&input.files[0];if(!f)return;
        if(!/^image\//.test(f.type)){state.msg={kind:'error',text:'Selecione uma imagem.'};paint();return;}
        if(f.size>1048576){state.msg={kind:'error',text:'Imagem maior que 1MB.'};paint();return;}
        // Resize/canvas pra 256x256 webp/png
        _phaseC_resizeImage(f,256).then(function(blob){
          state.avatarFile=blob;
          const fr=new FileReader();
          fr.onload=function(){state.avatarPreview=fr.result;paint();};
          fr.readAsDataURL(blob);
        }).catch(function(){
          state.msg={kind:'error',text:'Não foi possível processar a imagem.'};paint();
        });
      });

    const nameEl=document.getElementById('profile-name');
    if(nameEl){

  window._phaseC_profileSave=async function(){
    if(state.busy)return;
    const sb=_phaseC_supabase();if(!sb)return;
    state.busy=true;state.msg=null;paint();
    try{
      const sess=(await sb.auth.getSession()).data.session;
      if(!sess)throw new Error('Sessão expirada.');

        try{await sb.storage.from('avatars').remove([uid+'/avatar.png']);}catch(e){}

      }else if(state.avatarFile){
        const path=uid+'/avatar.png';
        const{error:upErr}=await sb.storage.from('avatars').upload(path,state.avatarFile,{contentType:'image/png',upsert:true,cacheControl:'3600'});

      state.msg={kind:'success',text:'Perfil salvo!'};
      state.busy=false;state.avatarFile=null;state.avatarPreview=null;state.avatar_url=avatarUrl;

      state.busy=false;state.msg={kind:'error',text:e.message||'Falha ao salvar.'};paint();
    }
  };

}

// Resize via canvas: retorna Blob PNG <= size px (lado maior).
function _phaseC_resizeImage(file,maxSize){
  return new Promise(function(resolve,reject){
    try{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=function(){
        try{
          let w=img.naturalWidth,h=img.naturalHeight;
          const r=Math.min(maxSize/w,maxSize/h,1);
          const tw=Math.round(w*r),th=Math.round(h*r);
          const canvas=document.createElement('canvas');
          canvas.width=tw;canvas.height=th;
          const ctx=canvas.getContext('2d');
          ctx.drawImage(img,0,0,tw,th);
          canvas.toBlob(function(blob){
            URL.revokeObjectURL(url);
            if(!blob){reject(new Error('toBlob failed'));return;}
            resolve(blob);
          },'image/png',0.92);
        }catch(e){URL.revokeObjectURL(url);reject(e);}
      };
      img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('image load fail'));};
      img.src=url;
    }catch(e){reject(e);}
  });
}
function _phaseC_setStatus(kind,text){
  // kind: 'idle' | 'saving' | 'saved' | 'error' | 'denied'
  if(!S.sharedContext)return;
  const badge=document.querySelector('.editor-topbar .section-label .share-badge');
  if(!badge)return;
  // Mantém base label (somente leitura / colab — edição) e anexa status
  const base=S.sharedContext.permission==='view'?'somente leitura':'colab — edição';
  const suffix=text?(' · '+text):'';
  badge.textContent=base+suffix;
  badge.classList.remove('is-saving','is-saved','is-error');
  if(kind==='saving')badge.classList.add('is-saving');
  else if(kind==='saved')badge.classList.add('is-saved');
  else if(kind==='error'||kind==='denied')badge.classList.add('is-error');
}

// ── Save em modo compartilhado (edit) ──
// _saveSharedRoteiroNow: write síncrono (await). Detecta RLS rejeitada (data.length===0).
async function _saveSharedRoteiroNow(){
  if(!_phaseC_isSharedEdit())return{ok:false,error:'not-editor'};
  if(window._phaseC.saveDenied)return{ok:false,error:'denied'};
  const sb=_phaseC_supabase();if(!sb)return{ok:false,error:'sdk'};
  try{window.collectDOM&&window.collectDOM();}catch(e){}
  const d=S.draft;if(!d||!d.id)return{ok:false,error:'no-draft'};
  const now=Date.now();
  const editor=_phaseC_buildEditorMeta();
  const blob={
    title:d.title||'',presenter:d.presenter||'',description:d.description||'',
    blocks:Array.isArray(d.blocks)?d.blocks:[],
    versions:Array.isArray(d.versions)?d.versions:[],
    audioPlayback:d.audioPlayback||1,videoPlayback:d.videoPlayback||1,
    createdAt:d.createdAt||now,updatedAt:now,
    lastEditor:editor||d.lastEditor||null
  };
  // marca timestamps locais para suprimir echo do próprio save
  window._phaseC.lastApplied=now;
  window._phaseC.lastSaveAt=now;
  _phaseC_setStatus('saving','salvando…');
  _syncStart&&_syncStart();
  try{
    // Schema da Fase B: roteiros tem apenas id, user_id, data, updated_at.
    // O título vai dentro de data.title (já incluído no blob acima).
    const{data,error}=await sb.from('roteiros')
      .update({data:blob,updated_at:new Date(now).toISOString()})
      .eq('id',d.id)
      .select('id');
    if(error)throw error;
    if(!data||data.length===0){
      // RLS bloqueou (nenhuma linha afetada)
      window._phaseC.saveDenied=true;
      _phaseC_setStatus('denied','sem permissão');
      if(window.showToast)window.showToast('Sem permissão para salvar este roteiro.');
      _syncError&&_syncError(true);
      return{ok:false,error:'rls-denied'};
    }
    const t=new Date(now);
    const hh=String(t.getHours()).padStart(2,'0'),mm=String(t.getMinutes()).padStart(2,'0');
    _phaseC_setStatus('saved','salvo às '+hh+':'+mm);
    _syncOk&&_syncOk();
    return{ok:true};
  }catch(e){
    console.warn('saveSharedRoteiro:',e);
    _phaseC_setStatus('error','erro de sincronização');
    _syncError&&_syncError(true);
    return{ok:false,error:e.message||'save-failed'};
  }
}

// ── Wraps de mutação + persistência (Phase C) ──
// Em sharedContext.view: bloqueia tudo + toast "modo somente leitura".
// Em sharedContext.edit: redireciona persistência para _saveSharedRoteiroNow/_saveSharedRoteiro
//   e NUNCA toca S.roteiros local nem chama hooks da Fase B.
function _phaseC_blockedToast(){
  if(window._phaseC.lastBlockedToast&&Date.now()-window._phaseC.lastBlockedToast<1500)return;
  window._phaseC.lastBlockedToast=Date.now();
  if(window.showToast)window.showToast('Modo somente leitura.');
}

function _phaseC_installMutationWraps(){
  if(window._phaseC_mutWrapsInstalled)return;
  // Espera funções existirem
  const ready=typeof window.persistRoteiro==='function'
    &&typeof window.saveAndStay==='function'
    &&typeof window.addBlock==='function'
    &&typeof window.removeBlock==='function'
    &&typeof window.moveBlock==='function'
    &&typeof window.duplicateBlock==='function'
    &&typeof window.updateSpeaker==='function';
  if(!ready){setTimeout(_phaseC_installMutationWraps,0);return;}
  window._phaseC_mutWrapsInstalled=true;

  // persistRoteiro: em sharedContext, NÃO escreve em S.roteiros nem localStorage; vai direto pro Supabase.
  const _origPersist=window.persistRoteiro;
  window.persistRoteiro=function(r){
    if(S.sharedContext){
      if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
      // Atualiza S.draft.updatedAt sem mexer em S.roteiros
      if(r)r.updatedAt=Date.now();
      _saveSharedRoteiroNow();
      return;
    }
    return _origPersist.apply(this,arguments);
  };

  // saveAndStay: em sharedContext.edit, salva no roteiro do dono via Supabase
  const _origSaveAndStay=window.saveAndStay;
  window.saveAndStay=function(){
    if(S.sharedContext){
      if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
      try{window.collectDOM&&window.collectDOM();}catch(e){}
      const d=S.draft;
      if(!d){return;}
      if(!d.title||!d.title.trim()){
        if(window.showToast)window.showToast('Defina o nome do episódio antes de salvar.');
        const e=document.getElementById('meta-title');
        if(e){e.focus();e.scrollIntoView({behavior:'smooth',block:'center'});}
        return;
      }
      // Recalcula duração igual o original faz
      let tot=0;d.blocks.forEach(function(b){if(b.time){const n=parseInt(String(b.time).replace(/\D/g,''));if(!isNaN(n))tot+=n;}});
      if(tot>0){const m=Math.floor(tot/60),s=tot%60;d.duration='~'+(m>0?m+'m ':'')+s+'s';}
      _saveSharedRoteiroNow().then(function(res){
        if(res&&res.ok&&window.showToast)window.showToast('Roteiro salvo!');
      });
      return;
    }
    return _origSaveAndStay.apply(this,arguments);
  };

  // addBlock
  const _origAdd=window.addBlock;
  window.addBlock=function(){
    if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
    const out=_origAdd.apply(this,arguments);
    if(_phaseC_isSharedEdit())_saveSharedRoteiro();
    return out;
  };
  // removeBlock
  const _origRemove=window.removeBlock;
  window.removeBlock=function(){
    if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
    const out=_origRemove.apply(this,arguments);
    if(_phaseC_isSharedEdit())_saveSharedRoteiro();
    return out;
  };
  // moveBlock
  const _origMove=window.moveBlock;
  window.moveBlock=function(){
    if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
    const out=_origMove.apply(this,arguments);
    if(_phaseC_isSharedEdit())_saveSharedRoteiro();
    return out;
  };
  // duplicateBlock
  const _origDup=window.duplicateBlock;
  window.duplicateBlock=function(){
    if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
    const out=_origDup.apply(this,arguments);
    if(_phaseC_isSharedEdit())_saveSharedRoteiro();
    return out;
  };
  // updateSpeaker (personagem do bloco)
  const _origSpeaker=window.updateSpeaker;
  window.updateSpeaker=function(){
    if(_phaseC_isReadOnly()){_phaseC_blockedToast();return;}
    const out=_origSpeaker.apply(this,arguments);
    if(_phaseC_isSharedEdit())_saveSharedRoteiro();
    return out;
  };
}
_phaseC_installMutationWraps();

// ── Realtime na tabela shares: detecta revogação ou mudança de permissão ──
function _subscribeRealtimeShare(shareId){
  const sb=_phaseC_supabase();if(!sb||!sb.channel||!shareId)return;
  _unsubscribeRealtimeShare();
  window._phaseC.activeSubs.shareId=shareId;
  try{
    const ch=sb.channel('share:'+shareId);
    ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'shares',filter:'id=eq.'+shareId},function(payload){
      const row=payload&&payload.new;if(!row||!S.sharedContext)return;
      const newPerm=row.permission==='edit'?'edit':'view';
      if(newPerm!==S.sharedContext.permission){
        S.sharedContext.permission=newPerm;
        _phaseC_applyReadonlyClass(newPerm==='view');
        if(newPerm==='view'){
          window._phaseC.saveDenied=false;
          if(window.showToast)window.showToast('Permissão alterada para somente leitura.');
        }else{
          window._phaseC.saveDenied=false;
          if(window.showToast)window.showToast('Permissão alterada para edição.');
        }
        try{window.renderEditor&&window.renderEditor();}catch(e){}
        _phaseC_decorateEditor();
      }
    });
    ch.on('postgres_changes',{event:'DELETE',schema:'public',table:'shares',filter:'id=eq.'+shareId},function(){
      if(window.showToast)window.showToast('Acesso revogado pelo dono.');
      window.exitSharedContext&&window.exitSharedContext();
    });
    ch.subscribe(function(status){
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        if(window._phaseC.activeSubs.shareId===shareId){
          setTimeout(function(){
            if(window._phaseC.activeSubs.shareId===shareId)_subscribeRealtimeShare(shareId);
          },1500);
        }
      }
    });
    window._phaseC.shareChannel=ch;
  }catch(e){console.warn('subscribe share:',e);}
}
function _unsubscribeRealtimeShare(){
  const sb=_phaseC_supabase();
  const ch=window._phaseC.shareChannel;
  if(ch&&sb&&sb.removeChannel){try{sb.removeChannel(ch);}catch(e){}}
  window._phaseC.shareChannel=null;
  window._phaseC.activeSubs.shareId=null;
}
window._unsubscribeRealtimeShare=_unsubscribeRealtimeShare;

// Reconnect helper: re-subscreve canais ativos com base em activeSubs (token refresh, visibility, heartbeat)
function _phaseC_resubscribeAll(){
  const subs=window._phaseC.activeSubs||{};
  const rId=subs.roteiroId,sId=subs.shareId;
  if(rId){
    window._phaseC.activeSubs.roteiroId=null; // pra _unsub não tomar como ativo
    _subscribeRealtimeRoteiro(rId);
  }
  if(sId){
    window._phaseC.activeSubs.shareId=null;
    _subscribeRealtimeShare(sId);
  }
}
window._phaseC_resubscribeAll=_phaseC_resubscribeAll;

// Heartbeat: a cada 60s checa se canais ativos estão joined; se não, re-subscribe.
(function _phaseC_startHeartbeat(){
  if(window._phaseC._heartbeatInstalled)return;
  window._phaseC._heartbeatInstalled=true;
  setInterval(function(){
    const subs=window._phaseC.activeSubs||{};
    let needs=false;
    const ch1=window._phaseC.channel;
    const ch2=window._phaseC.shareChannel;
    if(subs.roteiroId&&(!ch1||ch1.state!=='joined'))needs=true;
    if(subs.shareId&&(!ch2||ch2.state!=='joined'))needs=true;
    if(needs)_phaseC_resubscribeAll();
  },60000);
})();

// Visibility change: ao voltar pra foreground, valida e re-subscreve se preciso.
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  const subs=window._phaseC.activeSubs||{};
  if(subs.roteiroId||subs.shareId){
    const ch1=window._phaseC.channel,ch2=window._phaseC.shareChannel;
    const stale=(subs.roteiroId&&(!ch1||ch1.state!=='joined'))||(subs.shareId&&(!ch2||ch2.state!=='joined'));
    if(stale)_phaseC_resubscribeAll();
  }
});


window.esc=function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
window.escAttr=function(s){return window.esc(s).replace(/\n/g,'&#10;')};
window.stripHTML=function(h){const d=document.createElement('div');d.innerHTML=h||'';return(d.textContent||d.innerText||'').trim();};
window.computeRoteiroProgress=function(r){
  if(!r)return 0;
  const blocks=Array.isArray(r.blocks)?r.blocks:[];
  if(!blocks.length)return 0;
  const textFilled=blocks.filter(function(b){
    const a=window.stripHTML(b.audio).length>8;
    const v=window.stripHTML(b.video).length>8;
    const n=window.stripHTML(b.notes).length>8;
    return a||v||n;
  }).length;
  const metaScore=(r.title&&r.title.trim()?1:0)+(r.presenter&&r.presenter.trim()?1:0)+(r.duration&&r.duration.trim()?1:0);
  const blockScore=textFilled/blocks.length;
  const pct=Math.round(((blockScore*0.85)+((metaScore/3)*0.15))*100);
  return Math.max(0,Math.min(100,pct));
};

function sanitizeHTML(html){
  const s=String(html||'');
  const tmp=document.createElement('div');
  tmp.innerHTML=s;
  tmp.querySelectorAll('script,iframe,object,embed').forEach(function(el){el.remove();});
  tmp.querySelectorAll('*').forEach(function(el){
    Array.from(el.attributes).forEach(function(a){
      const n=String(a.name||'').toLowerCase();
      const v=String(a.value||'').trim();
      if(n.indexOf('on')===0){el.removeAttribute(a.name);return;}
      if((n==='href'||n==='src'||n==='xlink:href'||n==='poster'||n==='formaction'||n==='action')&&/^javascript:/i.test(v)){el.removeAttribute(a.name);return;}
      if(n==='style'&&/expression\s*\(|behavior\s*:|url\s*\(\s*javascript:/i.test(v)){el.removeAttribute(a.name);}
    });
  });
  return tmp.innerHTML;
}
window.sanitizeHTML=sanitizeHTML;

window.splitImportTextIntoParagraphs=function(raw){
  let t=String(raw||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(t.charCodeAt(0)===0xfeff)t=t.slice(1);
  const parts=t.split(/\n\s*\n+/);
  const out=[];
  for(let i=0;i<parts.length;i++){
    const seg=String(parts[i]||'').trim();
    if(seg.length)out.push(seg);
  }
  if(out.length===0){
    const one=t.trim();
    if(one)out.push(one);
  }
  return out;
};
window.plainToRichAudioHtml=function(txt){return window.esc(txt||'').replace(/\n/g,'<br>');};
function loadMammoth(){
  if(window.mammoth)return Promise.resolve();
  if(window._mammothLoadPromise)return window._mammothLoadPromise;
  window._mammothLoadPromise=new Promise(function(res,rej){
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
    s.onload=function(){res();};
    s.onerror=function(){window._mammothLoadPromise=null;rej(new Error('Falha ao carregar conversor .docx.'));};
    document.head.appendChild(s);
  });
  return window._mammothLoadPromise;
}
function extractTextFromImportFile(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.doc')&&!name.endsWith('.docx')){
    return Promise.reject(new Error('Arquivo .doc (Word antigo) não pode ser lido no navegador. Salve como .docx ou exporte .txt e importe de novo.'));
  }
  if(name.endsWith('.docx')||file.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){
    return loadMammoth().then(function(){
      return new Promise(function(res,rej){
        const fr=new FileReader();
        fr.onload=function(){res(fr.result);};
        fr.onerror=function(){rej(new Error('Leitura do arquivo falhou.'));};
        fr.readAsArrayBuffer(file);
      }).then(function(buf){
        return window.mammoth.extractRawText({arrayBuffer:buf});
      }).then(function(r){
        if(r&&r.messages&&r.messages.length)console.warn('mammoth',r.messages);
        return(r&&r.value!=null)?String(r.value):'';
      });
    });
  }
  if(name.endsWith('.txt')||file.type==='text/plain'){
    return new Promise(function(res,rej){
      const fr=new FileReader();
      fr.onload=function(){res(String(fr.result||''));};
      fr.onerror=function(){rej(new Error('Leitura do arquivo falhou.'));};
      fr.readAsText(file,'UTF-8');
    });
  }
  return Promise.reject(new Error('Formato não suportado.'));
}
function buildRoteiroFromImportParagraphs(title,paragraphs){
  const n=paragraphs.length;
  const blocks=paragraphs.map(function(p,i){
    let fase='meio';
    if(n>=2&&i===0)fase='inicio';
    else if(n>=2&&i===n-1)fase='fim';
    const b=window.newBlock(fase);
    b.audio=window.plainToRichAudioHtml(p);
    return b;
  });
  const r=window.newRoteiro();
  r.title=title.trim();
  r.blocks=blocks;
  return r;
}
window.showDocImportModal=function(file){
  if(document.querySelector('.doc-import-overlay'))return;
  const ov=document.createElement('div');ov.className='doc-import-overlay';
  let step=1;let parsedParagraphs=null;let loadErr='';
  ov._draftTitle='';
  function close(){ov.remove();window._pendingImportFile=null;window._importFileBusy=false;}
  function render(){
    const errHtml=loadErr?`<div class="doc-import-err" role="alert">${window.esc(loadErr)}</div>`:'';
    if(step===1){
      const titleVal=window.escAttr(ov._draftTitle||'');
      ov.innerHTML=`<div class="doc-import-box" onclick="event.stopPropagation()">
        <h2>Importar texto</h2>
        <p class="doc-import-sub">Arquivo: ${window.esc(file.name||'')} · Um bloco por parágrafo (separados por linha em branco no arquivo).</p>
        <div class="field"><label class="field-label" for="doc-import-title">Título do episódio</label>
        <input type="text" id="doc-import-title" placeholder="Obrigatório" autocomplete="off" value="${titleVal}"
          style="width:100%;box-sizing:border-box;padding:9px 11px;border:0.5px solid var(--border);border-radius:7px;font:inherit;font-size:13px;background:var(--bg2);color:var(--text)"></div>
        ${errHtml}
        <div class="tpl-actions" style="margin-top:4px">
          <button type="button" class="btn btn-sm btn-ghost" data-act="cancel">Cancelar</button>
          <button type="button" class="btn btn-sm btn-primary" id="doc-import-next" data-act="next">Continuar</button>
        </div></div>`;
      const ti=ov.querySelector('#doc-import-title');if(ti)setTimeout(function(){ti.focus();ti.setSelectionRange(ti.value.length,ti.value.length);},30);
    }else{
      const n=parsedParagraphs?parsedParagraphs.length:0;
      ov.innerHTML=`<div class="doc-import-box" onclick="event.stopPropagation()">
        <h2>Confirmar importação</h2>
        <p class="doc-import-sub">Episódio: ${window.esc(String(ov._importTitle||'').trim())}</p>
        <div class="doc-import-summary">Serão criados <strong>${n}</strong> bloco${n!==1?'s':''} a partir dos parágrafos do arquivo.</div>
        ${errHtml}
        <div class="tpl-actions">
          <button type="button" class="btn btn-sm btn-ghost" data-act="back">Voltar</button>
          <button type="button" class="btn btn-sm btn-primary" id="doc-import-do" data-act="import">Importar</button>
        </div></div>`;
    }
    ov.querySelectorAll('[data-act]').forEach(function(btn){
      btn.addEventListener('click',onAct);
    });
    if(step===1){
      const titleEl=ov.querySelector('#doc-import-title');
      if(titleEl)titleEl.addEventListener('input',function(){loadErr='';});
    }
  }
  function onAct(e){
    const act=e.currentTarget.getAttribute('data-act');
    if(act==='cancel'){close();return;}
    if(act==='back'){step=1;loadErr='';ov._draftTitle=ov._importTitle||'';render();return;}
    if(act==='next'){
      const titleEl=ov.querySelector('#doc-import-title');
      const title=titleEl?titleEl.value:'';
      ov._draftTitle=title;
      if(!title||!String(title).trim()){
        loadErr='Informe o título do episódio para continuar.';
        render();
        return;
      }
      ov._importTitle=String(title).trim();
      const btn=ov.querySelector('#doc-import-next');
      if(btn){btn.disabled=true;btn.textContent='Lendo…';}
      extractTextFromImportFile(file).then(function(text){
        const paras=window.splitImportTextIntoParagraphs(text);
        if(!paras.length){
          loadErr='O arquivo está vazio ou não gerou nenhum bloco de texto.';
          step=1;
          render();
          return;
        }
        parsedParagraphs=paras;
        step=2;
        loadErr='';
        render();
      }).catch(function(err){
        loadErr=err&&err.message?err.message:'Não foi possível ler o arquivo.';
        step=1;
        render();
      });
      return;
    }
    if(act==='import'){
      const btn=ov.querySelector('#doc-import-do');
      if(btn){btn.disabled=true;btn.textContent='Importando…';}
      try{
        const r=buildRoteiroFromImportParagraphs(ov._importTitle||'',parsedParagraphs||[]);
        close();
        window.goEditor(r);
        window.showToast('✅ Importação concluída. Revise os blocos e salve o roteiro.');
      }catch(err2){
        loadErr=err2&&err2.message?err2.message:'Erro ao montar roteiro.';
        step=2;
        render();
      }
    }
  }
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  window._importFileBusy=true;
  render();
  document.body.appendChild(ov);
};

function docsNormalizeDoc(o){

    sheetPadR:(o&&typeof o.sheetPadR==='number'&&isFinite(o.sheetPadR))?Math.round(o.sheetPadR):null

function docsDefaultSheetPadsFromViewport(){
  try{if(window.matchMedia&&window.matchMedia('(max-width:600px)').matches)return{l:18,r:18};}catch(e){}
  return{l:72,r:72};
}
function docsEffectiveSheetPads(doc){
  const def=docsDefaultSheetPadsFromViewport();
  const l=(doc&&typeof doc.sheetPadL==='number'&&isFinite(doc.sheetPadL))?doc.sheetPadL:def.l;
  const r=(doc&&typeof doc.sheetPadR==='number'&&isFinite(doc.sheetPadR))?doc.sheetPadR:def.r;
  return{l:l,r:r};
}
function docsClampSheetPads(w,l,r){
  const minP=10;
  const minBody=56;
  w=Math.max(1,Number(w)||0);
  l=Math.max(minP,Math.min(Number(l)||0,w-minP));
  r=Math.max(minP,Math.min(Number(r)||0,w-minP));
  if(l+r>w-minBody){
    const over=l+r-(w-minBody);
    const sum=l+r||1;
    l-=over*(l/sum);
    r-=over*(r/sum);
    l=Math.max(minP,Math.min(l,w-minP));
    r=Math.max(minP,Math.min(r,w-minP));
    if(l+r>w-minBody){l=w-minBody-r;if(l<minP){l=minP;r=w-minBody-l;}}
  }
  return{l:Math.round(l),r:Math.round(r)};
}
function docsFindId(id){return S.docs.find(function(d){return d.id===id;});}
const DOCS_PX_PER_CM=96/2.54;
function docsEditorEl(){

function docsActiveSheetEditor(){

function docsAllSheetEditors(){

function docsExtractTopBlocks(html){
  const wrap=document.createElement('div');
  wrap.innerHTML=sanitizeHTML((html&&String(html).trim())?String(html):'<p><br></p>');
  const nodes=Array.prototype.slice.call(wrap.childNodes);
  const out=[];
  nodes.forEach(function(n){
    if(n.nodeType===1)out.push(n);
    else if(n.nodeType===3&&String(n.textContent||'').trim()){
      const p=document.createElement('p');
      p.textContent=n.textContent;
      out.push(p);
    }
  });
  if(!out.length){
    const p=document.createElement('p');
    p.innerHTML='<br>';
    out.push(p);
  }
  return out;
}

function docsSheetEditorsOverflowed(){

window.docsPaginateContent=function(opts){
  if((S.workspaceTab||'')!=='docs')return;
  const root=document.getElementById('docs-page-sheets-root');
  if(!root)return;
  const doc=S.activeDocId?docsFindId(S.activeDocId):null;
  if(!doc)return;
  let html='';
  if(opts&&opts.html!=null)html=String(opts.html);
  else if(opts&&opts.fromDom)html=docsConcatSheetsHtml();
  else html=doc.content||'<p><br></p>';
  const blocks=docsExtractTopBlocks(html);
  const frag=document.createDocumentFragment();
  blocks.forEach(function(n){frag.appendChild(n);});
  const nodes=[];
  while(frag.firstChild)nodes.push(frag.removeChild(frag.firstChild));
  root.innerHTML='';
  let i=0;
  let page=0;
  let guard=0;
  while(i<nodes.length&&guard++<400){
    const sheet=docsCreatePageSheet(page,page===0);
    root.appendChild(sheet);
    const ed=sheet.querySelector('.docs-sheet-editor');
    const body=sheet.querySelector('.docs-sheet-body');
    if(!ed||!body)break;
    docsApplySheetPadsToSheets(doc);
    while(i<nodes.length){
      const node=nodes[i];
      ed.appendChild(node);
      if(ed.scrollHeight>body.clientHeight+1){
        if(ed.childNodes.length>1){
          ed.removeChild(node);
          break;
        }
        i++;
        break;
      }
      i++;
    }
    if(ed.childNodes.length===0&&i<nodes.length){
      ed.appendChild(nodes[i++]);
    }
    page++;
  }
  if(!root.querySelector('.docs-page-sheet')){
    const sheet=docsCreatePageSheet(0,true);
    root.appendChild(sheet);
    const ed=sheet.querySelector('.docs-sheet-editor');
    if(ed)ed.innerHTML='<p><br></p>';
    docsApplySheetPadsToSheets(doc);
  }
  root.querySelectorAll('.docs-page-sheet').forEach(function(sh,ix){
    const n=sh.querySelector('.docs-page-num');
    if(n)n.textContent=String(ix+1);
    sh.setAttribute('data-sheet-index',String(ix));
  });
  const pg=document.getElementById('docs-status-page');
  if(pg){
    const tot=root.querySelectorAll('.docs-page-sheet').length;
    pg.textContent=tot===1?'Pág. 1':'Pág. 1 · '+tot+' folhas';
  }
  docsSyncEditorEmptyClass();
  docsUpdateEditorStats();
  setTimeout(function(){if(typeof window.initDocsRuler==='function')window.initDocsRuler();},0);
};

function migrateLegacyDocsIfNeeded(){

function docsRelSaved(ts){

  if(!t)return'';
  const s=Math.floor((Date.now()-t)/1000);
  if(s<10)return'agora';
  if(s<60)return'há '+s+' s';
  const m=Math.floor(s/60);
  if(m<60)return'há '+m+' min';
  const h=Math.floor(m/60);
  if(h<48)return'há '+h+' h';
  return'há '+Math.floor(h/24)+' d';
}

function docsEditorKeydown(e){
  if(!e.target||!e.target.closest||!e.target.closest('.docs-sheet-editor'))return;
  if(e.key==='Tab'&&!(e.ctrlKey||e.metaKey||e.altKey)){
    e.preventDefault();
    window.docsEnsureFocus();
    if(e.shiftKey){
      try{document.execCommand('outdent',false,null);}catch(x){}
    }else{
      var insOk=false;
      try{insOk=document.execCommand('insertText',false,'    ');}catch(x){}
      if(!insOk){
        try{
          var sel=window.getSelection();
          if(sel&&sel.rangeCount){
            var rr=sel.getRangeAt(0);
            rr.deleteContents();
            rr.insertNode(document.createTextNode('    '));
            rr.collapse(false);
            sel.removeAllRanges();
            sel.addRange(rr);
          }
        }catch(x2){}
      }
    }
    window.docsQueueSave&&window.docsQueueSave();
    return;
  }
  if(!(e.ctrlKey||e.metaKey))return;
  const k=String(e.key||'').toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();window.docsUndo();return;}
  if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();window.docsRedo();return;}
  if(k==='b'){e.preventDefault();window.docsExec('bold');return;}
  if(k==='i'){e.preventDefault();window.docsExec('italic');return;}
  if(k==='u'){e.preventDefault();window.docsExec('underline');return;}
  if(k==='k'){e.preventDefault();window.docsOpenLinkPopup();return;}
}

  if(window.docsCloseDocItemMenu)window.docsCloseDocItemMenu();
  if(window._docsRenamingId)window.docsCommitInlineRename(window._docsRenamingId);
  window.docsFlushSave();
  S.activeDocId=id;
  window.persistDocsStore();
  if(window.refreshTrelloMainInner)window.refreshTrelloMainInner();
};
window.docsDeleteDoc=function(id){
  if(!id)return;
  if(S.docs.length<=1){window.showToast('Não é possível excluir o único documento.');return;}
  window.confirmModal('Excluir este documento? Esta ação não pode ser desfeita.',function(){
    window.docsFlushSave();
    S.docs=S.docs.filter(function(x){return x.id!==id;});
    if(S.activeDocId===id)S.activeDocId=S.docs.length?S.docs[0].id:null;
    window.persistDocsStore();
    if(window.refreshTrelloMainInner)window.refreshTrelloMainInner();
    window.showToast('Documento excluído.');
  });
};
window.docsDuplicateDoc=function(id){
  const src=docsFindId(id);
  if(!src)return;
  window.docsFlushSave();
  const now=Date.now();
  const nid=Date.now().toString(36)+Math.random().toString(36).slice(2,4);
  const copy=docsNormalizeDoc({
    id:nid,
    title:(src.title||'Documento')+' — cópia',
    content:src.content||'<p><br></p>',
    createdAt:now,
    updatedAt:now,
    imported:!!src.imported,
    sheetPadL:typeof src.sheetPadL==='number'?src.sheetPadL:null,
    sheetPadR:typeof src.sheetPadR==='number'?src.sheetPadR:null
  });
  const ix=S.docs.findIndex(function(d){return d.id===id;});
  if(ix>=0)S.docs.splice(ix+1,0,copy);else S.docs.push(copy);
  window.persistDocsStore();
  if(window.refreshTrelloMainInner)window.refreshTrelloMainInner();
  window.showToast('Documento duplicado.');
};

window.docsCloseDocItemMenu=function(){
  const p=document.querySelector('.docs-item-menu-pop');
  if(p)p.remove();
  if(window._docsMenuCloser){
    document.removeEventListener('click',window._docsMenuCloser,true);
    window._docsMenuCloser=null;
  }
  window._docsMenuOpenId=null;
  document.querySelectorAll('.docs-item.docs-menu-open').forEach(function(el){el.classList.remove('docs-menu-open');});
};
window.docsOpenDocItemMenu=function(ev,id){
  if(!id)return;
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const prev=window._docsMenuOpenId;
  window.docsCloseDocItemMenu();
  if(prev===id)return;
  window._docsMenuOpenId=id;
  const btn=ev&&ev.currentTarget?ev.currentTarget:null;
  const row=btn?btn.closest('.docs-item'):null;
  if(row)row.classList.add('docs-menu-open');
  const rect=btn?btn.getBoundingClientRect():{right:8,bottom:48};
  const pop=document.createElement('div');
  pop.className='docs-item-menu-pop';
  pop.setAttribute('role','menu');
  pop.innerHTML='<button type="button" role="menuitem">Renomear</button>'+
    '<button type="button" role="menuitem">Duplicar</button>'+
    '<button type="button" role="menuitem">Exportar .txt</button>'+
    '<button type="button" role="menuitem" class="docs-item-menu-del">Excluir</button>';
  const left=Math.max(8,rect.right-168);
  let top=(rect.bottom||0)+4;
  if(top>window.innerHeight-100)top=Math.max(8,(rect.top||0)-112);
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  const btns=pop.querySelectorAll('button');
  btns[0].addEventListener('click',function(e){e.stopPropagation();window.docsCloseDocItemMenu();window.docsStartInlineRename(id,null);});
  btns[1].addEventListener('click',function(e){e.stopPropagation();window.docsCloseDocItemMenu();window.docsDuplicateDoc(id);});
  btns[2].addEventListener('click',function(e){e.stopPropagation();window.docsCloseDocItemMenu();window.docsExportTxt(id);});
  btns[3].addEventListener('click',function(e){e.stopPropagation();window.docsCloseDocItemMenu();window.docsDeleteDoc(id);});
  document.body.appendChild(pop);
  window._docsMenuCloser=function(ce){
    if(!pop.contains(ce.target)&&!(ce.target.closest&&ce.target.closest('.docs-item-menu-btn')))window.docsCloseDocItemMenu();
  };
  setTimeout(function(){document.addEventListener('click',window._docsMenuCloser,true);},0);
};

window.docsApplyImportedText=function(text){
  const id=S.activeDocId;
  if(!id)return;
  const ed=docsEditorEl();
  if(!ed)return;
  const incoming=docsPlainToDocHtml(text);
  const rawHtml=(docsConcatSheetsHtml()||(docsFindId(id)&&docsFindId(id).content)||'');
  const cur=String(rawHtml||'').replace(/\s/g,'');
  const empty=!cur||cur==='<p><br></p>'||cur==='<p></p>'||cur.length<8;
  const d=docsFindId(id);
  function finish(use){
    if(d){d.content=use;d.imported=true;}
    window.docsPaginateContent&&window.docsPaginateContent({html:use});
    window.docsQueueSave();
    window.showToast('Texto importado no documento.');
  }
  if(!empty){
    window.confirmModal(
      'Substituir todo o conteúdo do documento pelo texto importado? Confirmar substitui tudo. Cancelar acrescenta o texto importado ao final.',
      function(){finish(incoming);},
      function(){finish(String(rawHtml||'')+'<p><br></p>'+incoming);}
    );
    return;
  }
  finish(incoming);
};
window.docsExportTxt=function(id){
  const doc=docsFindId(id);
  if(!doc){window.showToast('Documento não encontrado.');return;}
  const text=stripHTML(doc.content||'');
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  const url=URL.createObjectURL(blob);
  a.href=url;
  const base=String(doc.title||'documento').replace(/[\\/:*?"<>|]+/g,'-').trim()||'documento';
  a.download=base+'.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){try{URL.revokeObjectURL(url);}catch(e){}},4000);
  window.showToast('Documento exportado como .txt.');
};
window.docsCreateRoteiroFromDoc=function(){

};

function docsUpdateEditorStats(){
  let plain='';
  docsAllSheetEditors().forEach(function(ed){
    plain+=(ed.innerText||'').replace(/\ufeff/g,'');
  });
  const words=plain.trim()?plain.trim().split(/\s+/).filter(Boolean).length:0;
  const chars=plain.length;
  const wl=words===1?' palavra':' palavras';
  const cl=chars===1?' caractere':' caracteres';
  const wEl=document.getElementById('docs-status-words');
  const cEl=document.getElementById('docs-status-chars');
  if(wEl)wEl.textContent=words+wl;
  if(cEl)cEl.textContent=chars+cl;
  docsSyncEditorEmptyClass();
