<!-- html2canvas and html2pdf loaded lazily on first PDF export -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;--text:#1a1a18;--text2:#6b6b66;--text3:#9e9e99;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--radius:8px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--fi-bg:#f2f7ec;--fi-bd:#d4e2c2;--fi-tx:#3c6e08;--fm-bg:#fefce8;--fm-bd:#fef08a;--fm-tx:#a16207;--ff-bg:#fdf2ef;--ff-bd:#f0d5cc;--ff-tx:#8c3616}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;touch-action:manipulation}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#dcdccb;border-radius:4px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.topbar-mid{display:flex;flex:1;min-width:0;align-items:center;justify-content:space-between;gap:12px 20px;padding:0 4px 0 0}
.topbar-logo{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.topbar-logo-name{font-size:13px;font-weight:500;line-height:1.2}
.topbar-logo-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--text3);margin-top:3px;line-height:1.2}
.topbar-inspire{font-family:'Lora',Georgia,serif;font-size:11px;font-weight:400;font-style:italic;color:#5c5a56;line-height:1.35;margin:0;text-align:right;max-width:min(420px,46%);flex:1 1 auto;min-width:140px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.92;quotes:none}
.topbar-inspire::before{content:'\201C';font-style:normal;opacity:.75;margin-right:.04em}
.topbar-inspire::after{content:'\201D';font-style:normal;opacity:.75;margin-left:.04em}
.btn{font-family:var(--font);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;border:0.5px solid var(--border2);background:transparent;color:var(--text);transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--bg2)}.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-primary:hover{opacity:.82;background:var(--text)}.btn-ghost{border-color:transparent}.btn-ghost:hover{background:var(--bg2);border-color:var(--border)}.btn-danger{color:#a32d2d;border-color:#f09595}.btn-danger:hover{background:#fcebeb}.btn-sm{font-size:11px;padding:4px 9px}.hidden{display:none!important}
.btn-ai{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.05em;padding:3px 7px;border-radius:4px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);transition:all .2s;display:inline-flex;align-items:center;gap:3px}
.btn-ai:hover{background:#eeedfe;color:#3c3489;border-color:#9f9de0}.btn-ai.loading{opacity:.5;pointer-events:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
.main{max-width:720px;margin:0 auto;padding:24px 20px 80px}
.home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.r-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .12s;background:var(--bg)}.r-card:hover{border-color:var(--border2)}
.r-card.color-1{background-color:#e6f7ff;}
.r-card.color-2{background-color:#f0fdf4;}
.r-card.color-3{background-color:#eff6ff;}
.r-card.color-4{background-color:#fdf2ef;}
.r-card-title{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:4px}.r-card-meta{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:12px;line-height:1.4}.r-card-actions{display:flex;gap:6px}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text2)}.empty-state p{font-size:13px;line-height:1.6}
.editor-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}.editor-actions{display:flex;gap:6px}
.global-toolbar{position:sticky;top:56px;z-index:99;background:var(--bg);border:0.5px solid var(--border2);border-radius:6px;padding:6px 12px;margin-bottom:16px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.03)}
.rt-btn{background:transparent;border:none;cursor:pointer;padding:4px 8px;font-size:13px;font-family:var(--font);color:var(--text);border-radius:4px;transition:background .1s}.rt-btn:hover{background:var(--bg3)}
.rt-divider{width:1px;height:16px;background:var(--border);margin:0 4px}
.color-btn{width:18px;height:18px;border-radius:4px;border:1px solid var(--border2);cursor:pointer;transition:transform .1s}.color-btn:hover{transform:scale(1.1)}
.meta-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:20px;padding:14px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg2)}
.field{display:flex;flex-direction:column;gap:4px}.field-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2px}
.field-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.field input{font-family:var(--font);font-size:13px;padding:6px 9px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);width:100%;line-height:1.5}.field input:focus{outline:none;border-color:var(--text2)}
.rich-editor{font-family:var(--font);font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);min-height:60px;overflow-y:auto;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;min-width:0}.rich-editor:focus{outline:none;border-color:var(--text2);box-shadow:0 0 0 2px rgba(0,0,0,.05)}.rich-editor[placeholder]:empty:before{content:attr(placeholder);color:var(--text3);pointer-events:none;display:block}
.be-card{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;transition:background .2s,border-color .2s;background:var(--bg);width:100%;box-sizing:border-box}.be-card.fase-inicio{background:var(--fi-bg);border-color:var(--fi-bd)}.be-card.fase-meio{background:var(--fm-bg);border-color:var(--fm-bd)}.be-card.fase-fim{background:var(--ff-bg);border-color:var(--ff-bd)}
.be-header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:8px 12px;border-bottom:0.5px solid rgba(0,0,0,.06)}
.be-header .be-block-num{flex-shrink:0;margin-right:2px}
.be-header .fase-btn-group{flex-shrink:0}
.be-header .be-tags-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 120px;min-width:0}
.be-header .be-time{margin-left:auto;flex-shrink:0}
.fase-btn-group{display:flex;border:0.5px solid var(--border2);border-radius:4px;overflow:hidden}
.btn-fase{border:none;border-right:0.5px solid var(--border2);font-size:9px;font-family:var(--mono);text-transform:uppercase;padding:3px 8px;background:rgba(255,255,255,.6);color:var(--text3);cursor:pointer;transition:all .1s}.btn-fase:last-child{border-right:none}.btn-fase.active.inicio{background:var(--fi-tx);color:#fff}.btn-fase.active.meio{background:var(--fm-tx);color:#fff}.btn-fase.active.fim{background:var(--ff-tx);color:#fff}
.be-time{font-family:var(--mono);font-size:11px;padding:2px 7px;border:0.5px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text2);width:80px;margin-left:auto;text-align:center}.be-time:focus{outline:none;border-color:var(--text2)}
.tag-btn{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.05em;padding:2px 7px;border-radius:3px;border:none;cursor:pointer;opacity:.35;transition:opacity .12s}.tag-btn.on{opacity:1}
/* Bloco: rótulos áudio|vídeo na mesma linha; V1/+versão e IA na mesma linha (IA ao fim da coluna áudio); caixas ~3 linhas */
.be-fields-wrap{
  padding:10px 12px 12px;
  background:rgba(255,255,255,.22);
  border-top:0.5px solid rgba(0,0,0,.07);
  display:flex;
  flex-direction:column;
  gap:10px;
  box-sizing:border-box;
}
.be-fields-top{
  width:100%;
  box-sizing:border-box;
}
.be-fields-top-av{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
}
.be-av-labels-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px 14px;
  align-items:baseline;
}
.be-av-tools-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px 14px;
  align-items:center;
}
.be-av-tools-audio{
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:8px;
  min-width:0;
}
.be-av-tools-audio .alt-tabs-mount{
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  margin:0;
  padding:0;
}
.be-av-tools-audio .btn-ai{
  flex-shrink:0;
  margin-left:auto;
}
.be-av-editors-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px 14px;
  align-items:start;
}
.be-fields-bottom{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px 14px;
  align-items:stretch;
}
.be-field-cell{min-width:0;display:flex;flex-direction:column}
.be-fields-wrap .field.be-field-stack{
  display:flex;
  flex-direction:column;
  min-width:0;
  margin:0;
  gap:4px;
}
.be-fields-wrap .field-header{
  flex-shrink:0;
  min-height:0;
  margin:0;
  padding:0;
  align-items:flex-end;
  justify-content:flex-start;
  gap:4px;
  line-height:1;
}
.be-fields-wrap .field-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);line-height:1;padding:0}
.be-fields-top-av .rich-editor,.be-av-editors-row .rich-editor{
  flex:0 1 auto;
  width:100%;
  font-size:13px;
  line-height:1.45;
  box-sizing:border-box;
  overflow-y:auto;
  padding:8px 10px;
  min-height:calc(3 * 1.45em + 16px);
  max-height:calc(3 * 1.45em + 16px);
}
.be-field-notes-wrap .field.be-field-stack{
  height:auto;
  flex:0 1 auto;
  min-height:0;
}
.be-field-notes-wrap .field.be-field-stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.be-field-notes-wrap .rich-editor{
  flex:0 1 auto;
  min-height:calc(2 * 1.45em + 16px);
  max-height:calc(2 * 1.45em + 16px);
  box-sizing:border-box;
  width:100%;
  overflow-y:auto;
  padding:8px 10px;
  font-size:13px;
  line-height:1.45;
}
.be-fields-bottom .field-meta-speaker.be-field-stack{
  height:100%;
  flex:1 1 auto;
  min-height:0;
}
.be-fields-bottom .be-person-line{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  width:100%;
  min-width:0;
  box-sizing:border-box;
  min-height:calc(1 * 1.45em + 16px);
  padding:8px 10px;
  border:0.5px solid var(--border2);
  border-radius:6px;
  background:var(--bg);
}
.be-fields-bottom .be-person-line:focus-within{border-color:var(--text2);box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.be-fields-bottom .be-person-line .be-speaker-input{
  flex:1 1 72px;
  min-width:72px;
  max-width:100%;
  border:none;
  background:transparent;
  outline:none;
  font-size:13px;
  line-height:1.45;
  padding:0;
  min-height:0;
  box-shadow:none;
}
.be-fields-bottom .be-person-line .be-speaker-input:focus{border:none;box-shadow:none}
.be-col-full{padding:12px}
.be-footer{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:8px 12px;border-top:0.5px solid rgba(0,0,0,.06);row-gap:8px}.be-footer-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-block-btn{width:100%;margin-top:6px;border:1px dashed var(--border2);border-radius:var(--radius);padding:10px;text-align:center;font-size:12px;color:var(--text3);cursor:pointer;background:transparent;font-family:var(--font);transition:background .12s}.add-block-btn:hover{background:var(--bg2);color:var(--text)}
.time-tracker{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:12px;border-top:0.5px solid var(--border2);display:flex;justify-content:center;align-items:center;gap:12px;z-index:200;font-size:12px;font-family:var(--font);transition:background .3s}.time-tracker strong{font-size:14px;font-family:var(--mono)}.time-tracker.warning{background:#fef08a;color:#854d0e}.time-tracker.danger{background:#fecaca;color:#991b1b}
.viewer-topbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:space-between}
.v-header{border-bottom:0.5px solid var(--border);padding-bottom:14px;margin-bottom:16px}
.v-pre-title{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.v-title{font-size:20px;font-weight:500;margin-bottom:10px}.v-pills{display:flex;gap:6px;flex-wrap:wrap}
.v-pill{font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--bg2);padding:3px 8px;border-radius:4px;border:0.5px solid var(--border)}
.v-block{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;background:var(--bg)}.v-block.fase-inicio{border-color:var(--fi-bd);background:var(--fi-bg)}.v-block.fase-meio{border-color:var(--fm-bd);background:var(--fm-bg)}.v-block.fase-fim{border-color:var(--ff-bd);background:var(--ff-bg)}
.v-block-hd{display:flex;align-items:center;gap:5px;padding:7px 14px;border-bottom:0.5px solid rgba(0,0,0,.06);flex-wrap:wrap}
.v-tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.05em;padding:2px 7px;border-radius:3px}
.v-time{font-family:var(--mono);font-size:10px;color:var(--text3);margin-left:auto}
.v-cols{display:grid;grid-template-columns:1fr 1fr}.v-col{padding:12px 14px}.v-col+.v-col{border-left:0.5px solid rgba(0,0,0,.08)}
.v-col-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.v-text{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.v-empty{border:1px dashed var(--border2);border-radius:6px;padding:22px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3);background:rgba(255,255,255,.5)}
.v-nota{margin-top:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--text2);background:rgba(0,0,0,.03);border-left:2px solid var(--border2);border-radius:0 4px 4px 0;line-height:1.5}
.toast{position:fixed;bottom:60px;right:20px;background:var(--text);color:var(--bg);padding:10px 20px;border-radius:6px;font-size:12px;font-family:var(--mono);opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast.show{opacity:1;transform:translateY(0)}
#export-area{padding-bottom:20px;background:var(--bg)}
@media print{.topbar,.viewer-topbar,.time-tracker,.no-print,.global-toolbar{display:none!important}body{background:#fff}.main{padding:0 20px;max-width:100%;margin:0}.v-block{break-inside:avoid;border:1px solid #ccc;margin-bottom:10px}}
@media(max-width:520px){.meta-grid,.v-cols{grid-template-columns:1fr}.be-fields-wrap{padding:10px}.be-fields-bottom{grid-template-columns:1fr;gap:8px}.be-fields-top-av .be-av-labels-row,.be-fields-top-av .be-av-tools-row,.be-fields-top-av .be-av-editors-row{grid-template-columns:1fr;gap:8px}.be-field-notes-wrap .rich-editor{min-height:calc(2 * 1.45em + 16px);max-height:calc(2 * 1.45em + 16px)}.v-col+.v-col{border-left:none;border-top:0.5px solid rgba(0,0,0,.08)}.home-grid{grid-template-columns:1fr}.main{padding:16px 14px 60px}}

/* ── BOARD HOME v4 ──────────────────────────────── */
.board-workspace{width:100%;animation:boardIn .28s ease}
@keyframes boardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Workspace header */
.workspace-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:0.5px solid var(--border)}
.ws-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.ws-title{font-size:21px;font-weight:500;letter-spacing:-.025em;line-height:1;color:var(--text)}
.ws-stats{display:flex;gap:18px;padding-bottom:2px}
.ws-stat{text-align:right}
.ws-stat-n{font-family:var(--mono);font-size:16px;font-weight:500;line-height:1;color:var(--text)}
.ws-stat-l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:3px}

/* Pinboard */
.pinboard-wrap{margin-bottom:20px}
.pinboard-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pinboard-label::after{content:'';flex:1;height:0.5px;background:var(--border)}
.pinboard{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;align-items:flex-start;scrollbar-width:thin}
.pinboard::-webkit-scrollbar{height:4px}.pinboard::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.pin-block{flex:0 0 152px;border-radius:8px;padding:10px 12px;position:relative;min-height:74px;transition:box-shadow .15s}
.pin-block:hover{box-shadow:0 4px 14px rgba(0,0,0,.09)}
.pin-block.pin-yellow{background:#fefce8;border:0.5px solid #fde68a;color:#92400e}
.pin-block.pin-green{background:#f0fdf4;border:0.5px solid #bbf7d0;color:#166534}
.pin-block.pin-blue{background:#eff6ff;border:0.5px solid #bfdbfe;color:#1e40af}
.pin-block.pin-neutral{background:var(--bg2);border:0.5px solid var(--border2);color:var(--text2)}
.pin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.pin-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;outline:none;min-width:10px;cursor:text}
.pin-del{background:transparent;border:none;cursor:pointer;font-size:13px;line-height:1;opacity:0;transition:opacity .12s;color:inherit;padding:0;border-radius:3px}
.pin-block:hover .pin-del{opacity:.5}
.pin-del:hover{opacity:1!important}
.pin-txt{font-size:11.5px;line-height:1.55;outline:none;color:inherit;cursor:text;min-height:28px}
.pin-txt:empty::before{content:attr(data-ph);opacity:.38;pointer-events:none}
.pin-add{flex:0 0 74px;min-height:74px;border:1px dashed var(--border2);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;font-size:18px;color:var(--text3);transition:all .14s;border-style:dashed}
.pin-add:hover{background:var(--bg2);color:var(--text)}

/* Search */
.board-filter{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.board-search{font-family:var(--mono);font-size:11px;padding:6px 10px 6px 28px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg2);color:var(--text);flex:0 0 220px;transition:border-color .12s}
.board-search:focus{outline:none;border-color:var(--text2);background:var(--bg)}
.search-wrap{position:relative;flex-shrink:0}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text3);pointer-events:none}

/* Board strip */
.board-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px;align-items:flex-start;scrollbar-width:thin}
.board-strip::-webkit-scrollbar{height:4px}.board-strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Column */
.b-col{flex:0 0 228px;background:var(--bg2);border-radius:10px;border:0.5px solid var(--border);transition:background .15s,border-color .15s}
.b-col.drag-over{background:#f0efe9;border-color:var(--border2)}
.b-col-hd{display:flex;align-items:center;gap:7px;padding:11px 10px 9px;user-select:none}
.b-col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.b-col-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);flex:1;font-weight:500}
.b-col-count{font-family:var(--mono);font-size:9px;color:var(--text3);background:rgba(0,0,0,.07);padding:1px 6px;border-radius:10px}
.b-col-menu{background:transparent;border:none;cursor:pointer;font-size:15px;line-height:1;color:var(--text3);padding:1px 4px;border-radius:3px;transition:all .1s}
.b-col-menu:hover{background:rgba(0,0,0,.07);color:var(--text)}
.b-col-body{padding:0 7px;display:flex;flex-direction:column;gap:5px;min-height:52px}
.b-col-foot{padding:5px 7px 10px}

/* Card */
.b-card{background:var(--bg);border:0.5px solid var(--border);border-radius:7px;padding:11px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;border-left-width:2.5px;user-select:none}
.b-card:hover{border-color:var(--border2);box-shadow:0 3px 10px rgba(0,0,0,.07);transform:translateY(-1px)}
.b-card.is-dragging{opacity:.3;cursor:grabbing;transform:rotate(1deg)}
.b-card-title{font-size:12.5px;font-weight:500;line-height:1.35;margin-bottom:4px;color:var(--text)}
.b-card-notitle{font-size:12.5px;font-style:italic;color:var(--text3);margin-bottom:4px}
.b-card-meta{font-family:var(--mono);font-size:9.5px;color:var(--text3);line-height:1.7}
.b-card-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.b-card-tag{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:3px;letter-spacing:.02em}
.b-card-acts{display:flex;gap:3px;margin-top:8px;opacity:0;transition:opacity .14s;padding-top:8px;border-top:0.5px solid var(--border);align-items:center}
.b-card:hover .b-card-acts{opacity:1}
.b-act{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:4px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:background .1s;white-space:nowrap}
.b-act:hover{background:var(--bg2)}
.b-act.danger{color:#a32d2d;border-color:rgba(163,45,45,.25)}
.b-act.danger:hover{background:#fcebeb}
.b-move-sel{font-family:var(--mono);font-size:9.5px;padding:3px 5px;border-radius:4px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;max-width:90px;appearance:none;-webkit-appearance:none}

/* Col empty / add */
.b-col-empty{margin:4px 0 6px;padding:14px 10px;border:1px dashed var(--border);border-radius:6px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--text3);text-align:center;transition:background .14s}
.b-col.drag-over .b-col-empty{background:rgba(0,0,0,.03)}
.b-col-add{width:100%;padding:7px 10px;background:transparent;border:none;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--text3);text-align:left;transition:color .1s;display:flex;align-items:center;gap:5px}
.b-col-add:hover{color:var(--text)}

/* Add column */
.b-col-new{flex:0 0 auto;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:flex-start;padding:11px 12px;background:transparent}
.b-col-new-btn{background:transparent;border:none;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);white-space:nowrap;transition:color .1s;padding:0}
.b-col-new-btn:hover{color:var(--text)}

/* Topbar v4 */
.topbar-mark{width:22px;height:22px;border-radius:5px;background:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-mark svg{fill:#fff}

@media(max-width:680px){.board-strip{gap:8px}.b-col{flex:0 0 200px}.pinboard{gap:6px}.pin-block{flex:0 0 130px}.ws-stats{display:none}}

/* ── PARTE 5: REFINO PREMIUM ─────────────────────────────────── */
/* Topbar glass */
.topbar{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.88)}
.topbar-mark{transition:transform .3s cubic-bezier(.34,1.4,.64,1);cursor:default}
.topbar-mark:hover{transform:rotate(90deg) scale(1.1)}

/* Card — spring hover + press */
.b-card{transition:transform .22s cubic-bezier(.34,1.2,.64,1),box-shadow .2s ease,border-color .14s,opacity .15s}
.b-card:hover{transform:translateY(-2px) scale(1.004);box-shadow:0 5px 18px rgba(0,0,0,.09)}
.b-card:active{transform:translateY(0) scale(.988);transition-duration:.07s;box-shadow:none}
.b-card.is-dragging{opacity:.22;transform:rotate(2deg) scale(.97);box-shadow:0 12px 30px rgba(0,0,0,.16);cursor:grabbing}

/* Staggered entrance */
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.b-card{animation:cardIn .26s ease both}

/* Button micro press */
.btn:active,.b-act:active,.b-col-add:active,.pin-add:active{transform:scale(.96);transition-duration:.06s}

/* Phase proportion bar */
.b-card-bar{display:flex;height:3px;border-radius:3px;overflow:hidden;gap:1.5px;margin-top:10px}
.b-card-bar>div{border-radius:3px;opacity:.6;min-width:3px}

/* Card preview snippet */
.b-card-preview{font-size:11.5px;color:var(--text3);line-height:1.55;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;font-style:italic}

/* Duration pill */
.b-dur{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9px;color:var(--text2);background:var(--bg2);padding:1px 7px;border-radius:10px;border:0.5px solid var(--border);margin-top:6px;letter-spacing:.03em}

/* Column drag-over — glow + indicator */
.b-col.drag-over{background:var(--bg3);border-color:rgba(0,0,0,.22);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06);transition:all .1s}
.b-col-dot{transition:transform .2s cubic-bezier(.34,1.5,.64,1)}
.b-col.drag-over .b-col-dot{transform:scale(1.6)}
.b-col.drag-over .b-col-empty{border-style:solid;border-color:var(--text3);background:rgba(0,0,0,.025)}

/* Empty column — hatched pattern */
.b-col-empty{background:repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(0,0,0,.013) 5px,rgba(0,0,0,.013) 10px);transition:all .2s}

/* Column header bottom rule */
.b-col-hd{border-bottom:0.5px solid rgba(0,0,0,.055)}

/* Add column refined */
.b-col-new{transition:all .2s;flex-direction:column;justify-content:center;min-width:80px;min-height:64px}
.b-col-new:hover{background:var(--bg2);border-color:var(--border2);border-style:solid}

/* Global empty state — zero roteiros */
.board-empty-global{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4rem 2rem}
.beg-glyph{font-size:28px;opacity:.18;margin-bottom:18px;line-height:1;display:block}
.beg-title{font-size:16px;font-weight:500;letter-spacing:-.02em;margin-bottom:7px;color:var(--text)}
.beg-sub{font-size:13px;color:var(--text2);line-height:1.7;max-width:300px;margin-bottom:22px}

/* Search no-results */
.board-noresults{padding:2.5rem 1rem;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}

/* Pin entrance */
@keyframes pinIn{from{opacity:0;transform:scale(.86) rotate(-3deg)}to{opacity:1;transform:none}}
.pin-block{animation:pinIn .22s cubic-bezier(.34,1.4,.64,1) both}

/* Board horizontal fade mask */
.board-scroll-wrap{position:relative}
.board-scroll-wrap::after{content:'';position:absolute;right:0;top:0;bottom:16px;width:48px;background:linear-gradient(to right,transparent,var(--bg));pointer-events:none;z-index:2}

/* Workspace header — cinematic rule */
.ws-rule{width:32px;height:1.5px;background:var(--text);border-radius:1px;margin-bottom:10px;opacity:.35}

/* Toast refined */
.toast{border-radius:8px;font-size:11.5px;padding:9px 18px;letter-spacing:.02em}

/* ── APP SHELL v6 ────────────────────────────────────────────── */
html,body{height:100%;overflow:hidden}
body{margin:0}
.app-shell{display:flex;height:100vh;height:100dvh;width:100%;max-width:100%;overflow:hidden}
.app-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;height:100%}
.app-content .main{flex:1;overflow:auto;position:relative;min-height:0}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sidebar{width:52px;flex-shrink:0;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;z-index:200;overflow:hidden;gap:2px}
.sb-logo{height:48px;display:flex;align-items:center;justify-content:center;border-bottom:0.5px solid var(--border);flex-shrink:0}
.sb-logo-mark{width:22px;height:22px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--text);border:0.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sb-logo-mark img,.ws-logo-mark img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.sb-group{display:flex;flex-direction:column;padding:4px 0;gap:1px}
.sb-group+.sb-group{border-top:0.5px solid var(--border);margin-top:2px;padding-top:6px}
.sb-btn{width:36px;height:36px;margin:0 auto;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text2);transition:background .12s,color .12s;position:relative}
.sb-btn:hover{background:var(--bg2);color:var(--text)}
.sb-btn.active{background:var(--text);color:var(--bg)}
.sb-btn .sb-beat-ico{display:block;opacity:.92}
.sb-btn[title]:hover::after{content:attr(title);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--text);color:var(--bg);padding:4px 9px;border-radius:6px;font-family:var(--mono);font-size:9.5px;white-space:nowrap;z-index:9999;pointer-events:none;letter-spacing:.04em}
.sb-spacer{flex:1}
.sb-bottom{padding:6px 0 8px;border-top:0.5px solid var(--border)}

/* ── BREADCRUMB ──────────────────────────────────────────────── */
.breadcrumb-bar{display:flex;align-items:center;padding:0 16px;height:0;overflow:hidden;background:var(--bg);border-bottom:0.5px solid transparent;transition:height .18s,border-color .18s;flex-shrink:0}
.breadcrumb-bar.visible{height:34px;border-color:var(--border)}
.bc-item{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--text3);cursor:pointer;padding:3px 6px;border-radius:4px;transition:color .1s,background .1s;white-space:nowrap}
.bc-item:hover{color:var(--text);background:var(--bg2)}
.bc-item.cur{color:var(--text);cursor:default}
.bc-item.cur:hover{background:transparent}
.bc-sep{font-size:10px;color:var(--text3);padding:0 1px;opacity:.4;user-select:none}

/* canvas */
#main{flex:1;min-height:0;position:relative;overflow:auto}
#main.canvas-mode{overflow:hidden}
.canvas-wrap{position:absolute;inset:0;background:#141413;overflow:hidden}
.canvas-wrap.tool-note,.canvas-wrap.tool-board,.canvas-wrap.tool-roteiro,.canvas-wrap.tool-ref{cursor:crosshair}
.canvas-inner{position:absolute;top:0;left:0;width:9000px;height:7000px;will-change:transform}
.canvas-inner::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
.cv-empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:1}
.cv-empty-icon{font-size:30px;opacity:.1;display:block;margin-bottom:14px}
.cv-empty-txt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.2);line-height:2.2}
/* items base */
.cv-item{position:absolute;z-index:10;user-select:none;cursor:grab}
.cv-item:active{cursor:grabbing}
.cv-item.cv-sel .cv-inner{outline:2px solid #3b82f6;outline-offset:3px;border-radius:inherit}
.cv-item.cv-sel .cv-delbtn{display:flex}
.cv-delbtn{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:#fff;color:#1a1a18;border:none;cursor:pointer;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cv-delbtn:hover{background:#fecaca;color:#991b1b}
@keyframes cvIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.cv-item{animation:cvIn .2s cubic-bezier(.34,1.4,.64,1) both}
/* board icon milanote style */
.cv-board-wrap{width:120px;text-align:center}
.cv-board-box{width:120px;height:96px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;transition:transform .14s,box-shadow .14s;box-shadow:0 4px 20px rgba(0,0,0,.45)}
.cv-board-box:hover{transform:scale(1.07)}
.cv-board-lbl{font-size:11.5px;font-weight:500;color:#e8e6e0;margin-top:8px;text-align:center;line-height:1.35;word-break:break-word;outline:none;cursor:text;max-width:120px;display:block}
.cv-board-lbl:empty::before{content:'Board';opacity:.3;pointer-events:none}
.cv-board-ct{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.32);margin-top:2px;text-align:center;letter-spacing:.03em}
/* note */
.cv-note{min-width:172px;max-width:260px;border-radius:10px;padding:12px 14px;cursor:grab;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.cv-note-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:5px}
.cv-note-txt{font-size:12.5px;line-height:1.65;outline:none;min-height:38px;word-break:break-word}
.cv-note-txt:empty::before{content:'Escreva aqui…';opacity:.35;pointer-events:none;font-style:italic}
.cv-note.c-yellow{background:#fefce8;color:#78350f}
.cv-note.c-green{background:#f0fdf4;color:#14532d}
.cv-note.c-blue{background:#eff6ff;color:#1e3a5f}
.cv-note.c-sand{background:#f5f4f0;color:#2a2a28}
.cv-note.c-pink{background:#fdf2f8;color:#831843}
.cv-note.c-dark{background:#2a2a27;color:#f0efe8}
/* roteiro card */
.cv-rot{width:200px;border-radius:11px;overflow:hidden;cursor:pointer;background:#1e1e1c;border:0.5px solid rgba(255,255,255,.12);box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .14s,box-shadow .14s}
.cv-rot:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.cv-rot-band{height:3px;width:100%}
.cv-rot-body{padding:11px 13px 12px}
.cv-rot-tag{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:5px}
.cv-rot-title{font-size:12.5px;font-weight:500;color:#e8e6e0;line-height:1.35;margin-bottom:3px}
.cv-rot-meta{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.32);line-height:1.8}
.cv-rot-hint{font-family:var(--mono);font-size:8.5px;color:rgba(255,255,255,.2);margin-top:7px;padding-top:6px;border-top:0.5px solid rgba(255,255,255,.07)}
/* reference */
.cv-ref{width:208px;border-radius:10px;overflow:hidden;cursor:grab;background:#1e1e1c;border:0.5px solid rgba(255,255,255,.1);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.cv-ref-img{width:100%;height:84px;background:#2a2a27;display:flex;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.2);overflow:hidden}
.cv-ref-img img{width:100%;height:100%;object-fit:cover}
.cv-ref-bd{padding:9px 12px 11px}
.cv-ref-t{font-size:12px;font-weight:500;outline:none;cursor:text;color:#e8e6e0;margin-bottom:3px}
.cv-ref-u{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.28);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;cursor:text;display:block}
/* breadcrumb dark */
.breadcrumb-bar.cv-bc{background:#1a1a18;border-color:rgba(255,255,255,.07)}
.cv-bc .bc-item{color:rgba(255,255,255,.38)}
.cv-bc .bc-item:hover{color:#e8e6e0;background:rgba(255,255,255,.06)}
.cv-bc .bc-item.cur{color:#e8e6e0}
.cv-bc .bc-sep{color:rgba(255,255,255,.18)}

/* ── v7 MELHORIAS ──────────────────────────────────────────── */
/* Block number badge */
.be-block-num{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--text3);background:var(--bg3);border:0.5px solid var(--border2);border-radius:4px;padding:2px 6px;flex-shrink:0;user-select:none}
button.be-block-num{-webkit-appearance:none;appearance:none;font:inherit;line-height:inherit;cursor:pointer;text-align:center}
button.be-block-num:hover{background:var(--bg2);border-color:var(--border2);color:var(--text2)}
button.be-block-num:focus-visible{outline:2px solid var(--text2);outline-offset:1px}

/* Placeholder text menor e mais discreto */
.rich-editor[placeholder]:empty::before{font-size:11px;color:var(--text3);font-style:italic;opacity:.7}
.rich-editor::placeholder{font-size:11px}

/* Notes row - abaixo do grid, menor */
.be-notes-row{padding:8px 12px 10px}
.be-notes-row .rich-editor{min-height:36px;max-height:80px;font-size:12px}
.be-notes-row .field-label{font-size:8px;letter-spacing:.14em}

/* Enhanced toolbar */
.global-toolbar{flex-wrap:wrap;gap:4px;padding:6px 10px;row-gap:5px}
.rt-select{font-family:var(--mono);font-size:10px;padding:3px 5px;border:0.5px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);cursor:pointer;max-width:72px}
.rt-select:focus{outline:none;border-color:var(--text2)}
.rt-size-sel{max-width:52px}
.rt-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap;align-self:center}
.rt-color-group{display:flex;align-items:center;gap:3px}
.color-btn{width:20px;height:20px;flex-shrink:0}
.rt-clear{color:var(--text2)}

/* Sidebar — workspace (roteiros / beat / docs) */
.sb-btn[data-wstab].active{background:var(--text);color:var(--bg)}
.sb-docs-ico{display:block}

/* ── DOCS workspace ─────────────────────────────────────────── */
/* QA: P0 ruler hit-target, link scheme, stats single-source | P1 toolbar sync, overflow | P2 focus mode */
.workspace-v7.docs-app{min-height:0;min-width:0;flex:1;display:flex;flex-direction:column;max-width:100%;overflow-x:hidden;background:linear-gradient(180deg,#fbfbfa 0%,#f6f5f2 100%)}
.docs-shell{display:grid;grid-template-columns:minmax(220px,280px) 1fr;flex:1;min-height:0;min-width:0;max-width:100%;overflow-x:hidden;gap:0;border-top:0.5px solid rgba(0,0,0,.06)}
.docs-sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;max-width:100%;overflow-x:hidden;background:rgba(255,255,255,.42);border-right:0.5px solid rgba(0,0,0,.08)}
.docs-sidebar-hd{padding:16px 16px 12px;border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0}
.docs-sidebar-hd-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.docs-sidebar-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}

/* Viewer block number */
.v-block-num{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--text3);background:var(--bg2);border:0.5px solid var(--border);border-radius:3px;padding:1px 5px;margin-right:4px}

/* Workspace as first page - hide canvas btn active, highlight trello */

/* ── EDITOR SPLIT LAYOUT v7.1 ────────────────────────────────── */
.editor-shell{display:grid;grid-template-columns:320px 1fr;height:100%;overflow:hidden}
@media(max-width:900px){.editor-shell{grid-template-columns:1fr}  .preview-panel{display:none}}

/* LEFT: preview panel */
.preview-panel{background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;height:100%}
.preview-panel-hd{padding:12px 14px 8px;border-bottom:0.5px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:1px}
.preview-panel-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.preview-panel-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--text3)}
.preview-body{flex:1;overflow-y:auto;padding:12px 14px 40px;scrollbar-width:thin}
.preview-loading{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center;padding:32px 0;opacity:.6}

/* Preview content */
.pv-header{margin-bottom:14px;padding-bottom:10px;border-bottom:0.5px solid var(--border)}
.pv-title{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:3px;color:var(--text)}
.pv-meta{font-family:var(--mono);font-size:9.5px;color:var(--text3);letter-spacing:.03em}
.pv-block{margin-bottom:14px;padding:10px;background:var(--bg);border:0.5px solid var(--border);border-radius:6px;transition:border-color .15s}
.pv-block:hover{border-color:var(--border2)}
.pv-block-hd{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.pv-num{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--text3);background:var(--bg2);border:0.5px solid var(--border);border-radius:3px;padding:1px 5px}
button.pv-num{-webkit-appearance:none;appearance:none;font:inherit;line-height:inherit;cursor:pointer;text-align:center}
button.pv-num:hover{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
button.pv-num:focus-visible{outline:2px solid var(--text2);outline-offset:1px}
.pv-fase{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.08em}
.pv-time{font-family:var(--mono);font-size:8.5px;color:var(--text3);margin-left:auto}
.pv-section{margin-bottom:6px}
.pv-section-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:2px}
.pv-text{font-size:12px;line-height:1.6;word-break:break-word;color:var(--text)}
.pv-audio{font-weight:500}
.pv-video{color:var(--text2);font-style:italic}
.pv-notes{font-size:11px;color:var(--text3);border-left:2px solid var(--border2);padding-left:7px;font-style:italic}
.pv-empty{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:center;padding:8px 0;opacity:.5}

/* RIGHT: editor panel */
.editor-panel{display:flex;flex-direction:column;overflow:hidden;height:100%;min-width:0}
.editor-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px;width:100%;box-sizing:border-box}

/* make .main overflow visible in editor mode */
