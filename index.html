function getWordCount(){
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim();};
  let w=0;
  document.querySelectorAll('.rich-editor').forEach(el=>{
    w+=strip(el.innerHTML).split(/\s+/).filter(Boolean).length;
  });
  return w;
}
function sessionMinutes(){return Math.round((Date.now()-window._statsSession.start)/60000);}

function buildStatsPillBar(){
  if(!S.draft)return'';
  const wc=getWordCount();
  const blocks=S.draft.blocks||[];
  const pct=window.computeRoteiroProgress(S.draft);
  const sessMin=sessionMinutes();
  const avgWPM=sessMin>0?Math.round(wc/sessMin):0;
  return`<div class="stats-pill-bar no-print" id="stats-pill-bar">
    <span class="stats-pill"><span class="stats-pill-n">${wc}</span><span class="stats-pill-l">palavras</span></span>
    <span class="stats-pill"><span class="stats-pill-n">${blocks.length}</span><span class="stats-pill-l">blocos</span></span>
    <span class="stats-pill"><span class="stats-pill-n">${pct}%</span><span class="stats-pill-l">preenchido</span></span>
    <span class="stats-pill"><span class="stats-pill-n">${sessMin}</span><span class="stats-pill-l">min na sessão</span></span>
    ${avgWPM>0?`<span class="stats-pill"><span class="stats-pill-n">${avgWPM}</span><span class="stats-pill-l">pal/min</span></span>`:''}
    <span style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button type="button" class="sprint-btn focus-btn" id="focus-mode-btn" onclick="window.toggleFocusMode()" title="Modo foco">Foco</button>
      <button type="button" class="sprint-btn" id="rev-toggle-btn" onclick="window.toggleRevisionMode()" title="Destacar revisões por cor" aria-pressed="false">Revisão</button>
      <button type="button" class="sprint-btn" onclick="window.openCharNav()" title="Navegador de Personagens">Personagens</button>
    </span>
  </div>`;
}
window.updateStatsPillBar=function(){
  const el=document.getElementById('stats-pill-bar');
  if(!el)return;
  const tmp=document.createElement('div');tmp.innerHTML=buildStatsPillBar();
  if(tmp.firstElementChild)el.parentNode.replaceChild(tmp.firstElementChild,el);
  // reapply active states
  if(window._typewriterOn){const b=document.getElementById('typewriter-btn');if(b)b.classList.add('active');}
  if(window._focusModeOn){const b=document.getElementById('focus-mode-btn');if(b)b.classList.add('active');}
  if(typeof applyRevToggleVisual==='function')applyRevToggleVisual();
};
// Update stats every 30s
setInterval(()=>window.updateStatsPillBar&&window.updateStatsPillBar(),30000);
function onRichEditorInputGlobal(e){
  const isRichEditor=!!(e&&e.target&&e.target.classList&&e.target.classList.contains('rich-editor'));
  if(!isRichEditor)return;
  window.updateStatsPillBar&&window.updateStatsPillBar();
  if(window._typewriterOn)window.centerEditorCard&&window.centerEditorCard(e.target);
}
document.addEventListener('input',onRichEditorInputGlobal);

// ── TYPEWRITER MODE ───────────────────────────────────────────────
window._typewriterOn=false;
window.centerEditorCard=function(el){
  if(!el)return;
  const card=el.closest('[id^="be-"]')||el.closest('.be-card');
  const scroller=document.querySelector('.editor-scroll')||document.getElementById('main');
  if(!card||!scroller)return;
  const sr=scroller.getBoundingClientRect(),cr=card.getBoundingClientRect();
  const target=(cr.top-sr.top)-(scroller.clientHeight/2)+(card.offsetHeight/2);
  scroller.scrollBy({top:target,behavior:'smooth'});
};
window.toggleTypewriter=function(){
  window._typewriterOn=!window._typewriterOn;
  document.body.classList.toggle('typewriter-on',window._typewriterOn);
  const btn=document.getElementById('typewriter-btn');
  if(btn)btn.classList.toggle('active',window._typewriterOn);
  if(window._typewriterOn){
    // Auto-scroll active field to center on focus
    document.querySelectorAll('.rich-editor').forEach(el=>{
      if(!el._twListener){
        el._twListener=function(){
          if(!window._typewriterOn)return;
          setTimeout(()=>{
            window.centerEditorCard(el);
          },80);
        };
        el.addEventListener('focus',el._twListener);
      }
    });
    const active=document.activeElement;
    if(active&&active.classList&&active.classList.contains('rich-editor'))window.centerEditorCard(active);
    showToast('Typewriter ativado — o bloco ativo centraliza na tela');
  } else {
    showToast('Typewriter desativado');
  }
};

document.addEventListener('click',function(e){
  if(!window._typewriterOn)return;
  const el=e.target&&e.target.closest?e.target.closest('.rich-editor'):null;
  if(el)window.centerEditorCard(el);
});
document.addEventListener('keydown',function(e){
  const key=(e.key||'').toLowerCase();
  const isMacAltT=e.metaKey&&e.altKey&&(key==='t'||key==='†');
  const isWinAltT=e.ctrlKey&&e.altKey&&key==='t';
  const isMacAltY=e.metaKey&&e.altKey&&key==='y';
  if(isMacAltT||isWinAltT||isMacAltY){
    e.preventDefault();
    window.toggleTypewriter&&window.toggleTypewriter();
  }
});

// ── FOCUS MODE ───────────────────────────────────────────────────
window._focusModeOn=false;
window.toggleFocusMode=function(){
  window._focusModeOn=!window._focusModeOn;
  document.body.classList.toggle('focus-mode-on',window._focusModeOn);
  const btn=document.getElementById('focus-mode-btn');
  if(btn)btn.classList.toggle('active',window._focusModeOn);
  showToast(window._focusModeOn?'Modo Foco ativado — passe o mouse para focar um bloco':'Modo Foco desativado');
};

// ── CHARACTER NAVIGATOR ───────────────────────────────────────────
window.openCharNav=function(){
  window.collectDOM&&window.collectDOM();
  const blocks=S.draft?.blocks||[];
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim();};
  // Build speaker map
  const speakerBlocks={};
  blocks.forEach((b,i)=>{
    const sp=b.speaker?.trim()||'(sem personagem)';
    if(!speakerBlocks[sp])speakerBlocks[sp]=[];
    speakerBlocks[sp].push({...b,index:i+1,preview:strip(b.audio).slice(0,60)||'(vazio)'});
  });
  const colors=window.SPEAKER_COLORS||['#4f98a3','#ca8a04','#7c3aed','#db2777','#16a34a'];
  let colorIdx=0;const colorMap={};
  const rows=Object.entries(speakerBlocks).sort((a,b)=>b[1].length-a[1].length).map(([name,blist])=>{
    if(!colorMap[name])colorMap[name]=colors[(colorIdx++)%colors.length];
    const color=colorMap[name];
    const blockItems=blist.map(b=>`<div class="char-nav-block-item" onclick="
      document.getElementById('be-${b.id}')?.scrollIntoView({behavior:'smooth',block:'center'});
      document.getElementById('be-${b.id}')?.querySelector('.rich-editor')?.focus();
      document.querySelector('.char-nav-overlay')?.remove();"
    >#${b.index} — ${window.esc(b.preview)}</div>`).join('');
    return`<div class="char-nav-section">
      <div class="char-nav-name" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
        <span class="char-nav-color" style="background:${color}"></span>
        <span class="char-nav-label">${window.esc(name)}</span>
        <span class="char-nav-count">${blist.length} bloco${blist.length>1?'s':''}</span>
        <span style="font-size:10px;color:var(--text3);margin-left:4px">▾</span>
      </div>
      <div class="char-nav-blocks">${blockItems}</div>
    </div>`;
  }).join('');
  const ov=document.createElement('div');ov.className='char-nav-overlay';
  ov.innerHTML=`<div class="char-nav-panel">
    <div class="char-nav-hd">
      <h4>Personagens</h4>
      <button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px" onclick="this.closest('.char-nav-overlay').remove()">✕</button>
    </div>
    <div class="char-nav-body">${rows||'<p style="padding:16px;font-size:12px;color:var(--text3)">Nenhum personagem cadastrado ainda.</p>'}</div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
};

// ── PATCH renderEditor to inject stats bar ────────────────────────
// (wrapper final removido; comportamento incorporado no patch anterior)

render();

// === SECTION: AUTH BOOTSTRAP (Phase A) + HYDRATE (Phase B) ===
// Verifica sessão ativa e mostra a tela de auth se não houver.
// Registra listener para reagir a SIGNED_IN/SIGNED_OUT.
// Em sessão ativa, dispara remoteHydrate para reconciliar com o Supabase.
(async function bootstrapAuth(){
  // Detecta ?p=g (retomada após login OAuth) e ?token= (link compartilhado)
  let pendingToken=null;
  try{
    const u=new URL(window.location.href);
    pendingToken=u.searchParams.get('token');
    if(u.searchParams.get('p')==='g')window._authGoogleHighlighted=true;
  }catch(e){}
  try{
    if(!window.supabase||!window.supabase.auth){
      window.showAuthScreen&&window.showAuthScreen();
      _syncSetOffline&&_syncSetOffline(true);
      return;
    }
    const{data}=await window.supabase.auth.getSession();
    const session=data&&data.session;
    if(session){
      window.hideAuthScreen&&window.hideAuthScreen();
      _syncSetOffline&&_syncSetOffline(false);
      // Resolve identidade pra last editor / colab + avatar sidebar
      try{if(typeof _phaseC_resolveCurrentUser==='function')_phaseC_resolveCurrentUser().then(function(){window._refreshSidebarAvatar&&window._refreshSidebarAvatar();});}catch(e){}
      // Hydrate em paralelo
      window.remoteHydrate&&window.remoteHydrate();
      // Se chegou com token, abre o roteiro compartilhado em vez de cair no fluxo normal
      if(pendingToken)window.openSharedByToken&&window.openSharedByToken(pendingToken);
    }else{
      window.showAuthScreen&&window.showAuthScreen();
      _syncSetOffline&&_syncSetOffline(true);
    }
    window.supabase.auth.onAuthStateChange(function(event,sess){
      if(event==='SIGNED_IN'){
        window.hideAuthScreen&&window.hideAuthScreen();
        _syncSetOffline&&_syncSetOffline(false);
        try{if(typeof _phaseC_resolveCurrentUser==='function')_phaseC_resolveCurrentUser().then(function(){window._refreshSidebarAvatar&&window._refreshSidebarAvatar();});}catch(e){}
        window.remoteHydrate&&window.remoteHydrate();
        if(pendingToken){
          window.openSharedByToken&&window.openSharedByToken(pendingToken);
          pendingToken=null;
        }
      }else if(event==='TOKEN_REFRESHED'){
        // Reconecta canais realtime com o novo JWT
        try{if(typeof _phaseC_resubscribeAll==='function')_phaseC_resubscribeAll();}catch(e){}
      }else if(event==='SIGNED_OUT'){
        window.showAuthScreen&&window.showAuthScreen();
        _phaseB_ready=false;
        _lastRemoteDocIds=new Set();
        _persistRoteiroFails={};
        _syncSetOffline&&_syncSetOffline(true);
        // limpa contexto de share e realtime
        try{if(typeof _unsubscribeRealtimeRoteiro==='function')_unsubscribeRealtimeRoteiro();}catch(e){}
        try{if(typeof _unsubscribeRealtimeShare==='function')_unsubscribeRealtimeShare();}catch(e){}
        S.sharedContext=null;
        if(window._phaseC){
          window._phaseC.saveDenied=false;
          window._phaseC._cachedUser=null;
          clearInterval(window._phaseC.lastEditorTimer);
          window._phaseC.lastEditorTimer=null;
        }
        if(document.body)document.body.classList.remove('is-share-readonly');
      }
    });
  }catch(e){
    console.error('Falha no bootstrap de auth:',e);
    window.showAuthScreen&&window.showAuthScreen();
    _syncSetOffline&&_syncSetOffline(true);
  }
})();

</script>
