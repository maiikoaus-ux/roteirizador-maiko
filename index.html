function docsBlocksTouchingRange(ed,range){
  const out=[];
  const seen=new Set();
  if(!ed||!range)return out;
  const blocks=ed.querySelectorAll('p,h1,h2,h3,h4,h5,h6,blockquote,pre,li');
  try{
    blocks.forEach(function(el){
      if(range.intersectsNode(el)){if(!seen.has(el)){seen.add(el);out.push(el);}}
    });
  }catch(e){}
  if(out.length)return out;
  function blockAt(n){
    let x=n&&n.nodeType===3?n.parentElement:n;
    while(x&&x!==ed){
      const t=(x.tagName||'').toUpperCase();
      if(/^(P|H[1-6]|LI|BLOCKQUOTE|PRE|DIV)$/i.test(t))return x;
      x=x.parentElement;
    }
    return null;
  }
  const b=blockAt(range.startContainer);
  return b?[b]:[];
}
function docsInferParaStyleFromEl(el){
  if(!el)return'';
  const t=(el.tagName||'').toLowerCase();
  if(t==='blockquote')return'quote';
  if(t==='pre')return'code';
  if(/^h[1-4]$/.test(t))return t;
  if(t==='p'){
    if(el.classList&&el.classList.contains('docs-style-subtitle'))return'subtitle';
    if(el.classList&&el.classList.contains('docs-style-caption'))return'caption';
    return'p';
  }
  return'';
}
window.docsSanitizeDocLinkUrl=function(raw){
  const u=String(raw||'').trim();
  if(!u)return'';
  const low=u.toLowerCase();
  if(low.indexOf('javascript:')===0||low.indexOf('vbscript:')===0||low.indexOf('data:')===0){
    window.showToast('Esquema de URL não permitido.');
    return'';
  }
  if(/^mailto:/i.test(u))return u;
  if(u.charAt(0)==='/'||u.indexOf('./')===0||u.indexOf('../')===0)return u;
  if(/^https?:\/\//i.test(u))return u;
  if(/^#[\w\-./%]*$/i.test(u))return u;
  if(/^[^:#?\s]+:/i.test(u)&&!/^https?:/i.test(u)){
    window.showToast('Esquema de URL não permitido.');
    return'';
  }
  return'https://'+u.replace(/^\/+/,'');
};
window.updateDocsToolbarState=function(){
  const wrap=document.querySelector('.docs-toolbar');
  if(!wrap)return;
  const sel=document.getSelection();
  if(!sel||sel.rangeCount===0)return;
  let r;
  try{r=sel.getRangeAt(0);}catch(e){return;}
  const ca=r.commonAncestorContainer;
  let ed=null;
  docsAllSheetEditors().forEach(function(x){
    if(x.contains(ca)||ca===x)ed=x;
  });
  if(!ed)return;
  function tb(cls,on){const b=wrap.querySelector(cls);if(b)b.classList.toggle('docs-tb-active',!!on);}
  function ap(cls,on){const b=wrap.querySelector(cls);if(b&&b.hasAttribute('aria-pressed'))b.setAttribute('aria-pressed',on?'true':'false');}
  try{
    const B=document.queryCommandState('bold');
    const I=document.queryCommandState('italic');
    const U=document.queryCommandState('underline');
    const S=document.queryCommandState('strikeThrough');
    const sup=document.queryCommandState('superscript');
    const sub=document.queryCommandState('subscript');
    const ul=document.queryCommandState('insertUnorderedList');
    const ol=document.queryCommandState('insertOrderedList');
    const jl=document.queryCommandState('justifyLeft');
    const jc=document.queryCommandState('justifyCenter');
    const jr=document.queryCommandState('justifyRight');
    const jf=document.queryCommandState('justifyFull');
    tb('.docs-tb-bold',B);ap('.docs-tb-bold',B);
    tb('.docs-tb-italic',I);ap('.docs-tb-italic',I);
    tb('.docs-tb-underline',U);ap('.docs-tb-underline',U);
    tb('.docs-tb-strike',S);ap('.docs-tb-strike',S);
    tb('.docs-tb-super',sup);ap('.docs-tb-super',sup);
    tb('.docs-tb-sub',sub);ap('.docs-tb-sub',sub);
    tb('.docs-tb-ul',ul);ap('.docs-tb-ul',ul);
    tb('.docs-tb-ol',ol);ap('.docs-tb-ol',ol);
    tb('.docs-tb-left',jl);ap('.docs-tb-left',jl);
    tb('.docs-tb-center',jc);ap('.docs-tb-center',jc);
    tb('.docs-tb-right',jr);ap('.docs-tb-right',jr);
    tb('.docs-tb-justify',jf);ap('.docs-tb-justify',jf);
  }catch(x){}
  const ps=document.getElementById('docs-para-style');
  if(ps&&document.activeElement!==ps){
    let v='';
    try{
      const fb=String(document.queryCommandValue('formatBlock')||'').replace(/[<>]/gi,'').toLowerCase();
      if(fb.indexOf('h1')>=0)v='h1';
      else if(fb.indexOf('h2')>=0)v='h2';
      else if(fb.indexOf('h3')>=0)v='h3';
      else if(fb.indexOf('h4')>=0)v='h4';
      else if(fb.indexOf('blockquote')>=0)v='quote';
      else if(fb.indexOf('pre')>=0)v='code';
    }catch(e2){}
    if(!v){
      const bl=docsBlocksTouchingRange(ed,r)[0];
      v=docsInferParaStyleFromEl(bl)||'';
    }
    if(ps.value!==(v||''))ps.value=v||'';
  }
  const ff=document.getElementById('docs-font-family');
  if(ff&&document.activeElement!==ff){
    let fn='';
    try{fn=String(document.queryCommandValue('fontName')||'').replace(/^["']|["']$/g,'');}catch(e3){}
    if(fn){
      const lfn=fn.toLowerCase().replace(/['"]/g,'').split(',')[0].trim();
      const opt=Array.prototype.find.call(ff.options,function(o){
        if(!o.value)return false;
        const ov=String(o.value).toLowerCase();
        return lfn===ov||lfn.indexOf(ov)>=0||ov.indexOf(lfn)>=0;
      });
      if(opt&&ff.value!==opt.value)ff.value=opt.value;
      else if(!opt&&fn&&ff.value!=='')ff.value='';
    }
  }
};
function docsApplyRulerIndentFromPx(pxOnTrack,trackW,sheetW,padL){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  let node=sel.getRangeAt(0).startContainer;
  while(node&&node.nodeType!==1)node=node.parentNode;
  if(!node||!node.closest||!node.closest('.docs-sheet-editor'))return;
  const block=node.closest('p,h1,h2,h3,h4,h5,h6,blockquote,li')||node;
  const innerPx=Math.max(0,(pxOnTrack/trackW)*sheetW-padL);
  try{block.style.textIndent=Math.round(innerPx)+'px';}catch(e){}
}
window.initDocsRuler=function(){
  const track=document.getElementById('docs-ruler-track');
  const sheet=document.querySelector('.docs-main .docs-page-sheet');
  if(!track||!sheet)return;
  const d=S.activeDocId?docsFindId(S.activeDocId):null;
  const sheetW=Math.max(1,Math.floor(sheet.getBoundingClientRect().width));
  const trackW=Math.max(1,Math.floor(track.getBoundingClientRect().width));
  const pads=d?docsEffectiveSheetPads(d):docsDefaultSheetPadsFromViewport();
  const cl=docsClampSheetPads(sheetW,pads.l,pads.r);
  if(d){d.sheetPadL=cl.l;d.sheetPadR=cl.r;}
  track.querySelectorAll('.docs-ruler-mark,.docs-ruler-label,.docs-ruler-margin-shade,.docs-ruler-tab').forEach(function(el){el.remove();});
  const scale=trackW/sheetW;
  const totalMm=Math.ceil((sheetW/DOCS_PX_PER_CM)*10)+1;
  for(let mm=0;mm<=totalMm;mm++){
    const xOnSheet=(mm/10)*DOCS_PX_PER_CM;
    if(xOnSheet>sheetW+1)break;
    const x=xOnSheet*scale;
    const mk=document.createElement('div');
    mk.className='docs-ruler-mark'+(mm%10===0?' cm':mm%5===0?' half':' mm');
    mk.style.left=x+'px';
    track.appendChild(mk);
    if(mm%10===0&&mm>0){
      const lbl=document.createElement('div');
      lbl.className='docs-ruler-label';
      lbl.style.left=x+'px';
      const relCm=Math.max(0,Math.round((mm/10)-(cl.l/DOCS_PX_PER_CM)));
      lbl.textContent=relCm>0?String(relCm):'';
      track.appendChild(lbl);
    }
  }
  const ls=(cl.l/sheetW)*trackW;
  const rsW=((sheetW-cl.r)/sheetW)*trackW;
  const leftShade=document.createElement('div');
  leftShade.className='docs-ruler-margin-shade';
  leftShade.style.left='0';
  leftShade.style.width=ls+'px';
  track.appendChild(leftShade);
  const rightShade=document.createElement('div');
  rightShade.className='docs-ruler-margin-shade';
  rightShade.style.right='0';
  rightShade.style.width=((cl.r/sheetW)*trackW)+'px';
  track.appendChild(rightShade);
  const riLeft=document.getElementById('docs-ri-left');
  const riPara=document.getElementById('docs-ri-para');
  const riRight=document.getElementById('docs-ri-right');
  if(riLeft){riLeft.style.left=ls+'px';riLeft.style.transform='translateX(-50%)';}
  if(riPara){riPara.style.left=ls+'px';riPara.style.transform='translateX(-50%)';}
  if(riRight){riRight.style.left=rsW+'px';riRight.style.transform='translateX(-50%)';}
  docsApplySheetPadsToSheets(d);
};
window.docsBindRulerDragOnce=function(){
  if(window._docsRulerDragBound)return;
  window._docsRulerDragBound=true;
  let drag=null;
  function onMove(ev){
    if(!drag)return;
    const track=document.getElementById('docs-ruler-track');
    const sheet=document.querySelector('.docs-main .docs-page-sheet');
    const d=docsFindId(S.activeDocId);
    if(!track||!sheet||!d)return;
    const rect=track.getBoundingClientRect();
    const trackW=Math.max(1,rect.width);
    const sheetW=Math.max(1,sheet.getBoundingClientRect().width);
    const x=Math.max(0,Math.min(trackW,ev.clientX-rect.left));
    const cur=docsEffectiveSheetPads(d);
    if(drag.side==='left'||drag.side==='right'){
      let l,r;
      if(drag.side==='left'){l=Math.round((x/trackW)*sheetW);r=cur.r;}
      else{l=cur.l;r=Math.round(sheetW-(x/trackW)*sheetW);}
      const cl=docsClampSheetPads(sheetW,l,r);
      d.sheetPadL=cl.l;
      d.sheetPadR=cl.r;
      docsApplySheetPadsToSheets(d);
      window.initDocsRuler();
    }else if(drag.side==='para'){
      docsApplyRulerIndentFromPx(x,trackW,sheetW,cur.l);
    }
  }
  function onUp(){
    if(drag){
      drag=null;
      window.docsQueueSave&&window.docsQueueSave();
      window.docsFlushSave&&window.docsFlushSave();
    }
    document.removeEventListener('pointermove',onMove,true);
    document.removeEventListener('pointerup',onUp,true);
    document.removeEventListener('pointercancel',onUp,true);
  }
  document.addEventListener('pointerdown',function(ev){
    if((S.workspaceTab||'')!=='docs')return;
    const t=ev.target;
    if(!t||!t.closest)return;
    const L=t.closest('#docs-ri-left');
    const R=t.closest('#docs-ri-right');
    const P=t.closest('#docs-ri-para');
    if(!L&&!R&&!P)return;
    ev.preventDefault();
    ev.stopPropagation();
    drag={side:L?'left':R?'right':'para'};
    document.addEventListener('pointermove',onMove,true);
    document.addEventListener('pointerup',onUp,true);
    document.addEventListener('pointercancel',onUp,true);
  },true);
  if(!window._docsWinResizeBound){
    window._docsWinResizeBound=true;
    window.addEventListener('resize',function(){
      clearTimeout(window._docsResizeT);
      window._docsResizeT=setTimeout(function(){
        if((S.workspaceTab||'')!=='docs')return;
        window.initDocsRuler&&window.initDocsRuler();
        window.docsPaginateContent&&window.docsPaginateContent({fromDom:true});
      },150);
    });
  }
};
window.renderDocsWorkspace=function(){
  if(window.docsCloseDocItemMenu)window.docsCloseDocItemMenu();
  const ids=S.docs.map(function(d){return d.id;});
  if(S.activeDocId&&ids.length&&!ids.includes(S.activeDocId)){
    S.activeDocId=null;
    window.persistDocsStore();
  }
  const active=(S.activeDocId&&ids.includes(S.activeDocId))?S.activeDocId:'';
  const qRaw=window._docsSearch||'';
  const q=qRaw.toLowerCase().trim();
  const sort=window._docsSort||'updated';
  let filtered=S.docs.slice();
  if(q){
    filtered=S.docs.filter(function(d){
      const t=(d.title||'').toLowerCase();
      const body=stripHTML(d.content||'').toLowerCase();
      return t.includes(q)||body.includes(q);
    });
  }
  filtered.sort(function(a,b){
    if(sort==='title')return(a.title||'').localeCompare(b.title||'','pt',{sensitivity:'base'});
    if(sort==='title_desc')return(b.title||'').localeCompare(a.title||'','pt',{sensitivity:'base'});
    if(sort==='stale')return(a.updatedAt||0)-(b.updatedAt||0);
    if(sort==='created')return(b.createdAt||0)-(a.createdAt||0);
    return(b.updatedAt||0)-(a.updatedAt||0);
  });
  const listIds=filtered.map(function(d){return d.id;});

window.docsAfterMount=function(){

      ev.preventDefault();
      ev.stopPropagation();
      const m=document.getElementById('docs-tb-more-menu');
      if(!m)return;
      if(m.classList.contains('open'))window.docsCloseTbMoreMenu();
      else{m.hidden=false;m.classList.add('open');tbMore.setAttribute('aria-expanded','true');}
    });
  }
  if(!window._docsTbMoreOutsideCloser){
    window._docsTbMoreOutsideCloser=true;
    document.addEventListener('click',function(ev){
      const m=document.getElementById('docs-tb-more-menu');

      if(ev.target.closest&&ev.target.closest('.docs-tb-more-host'))return;
      window.docsCloseTbMoreMenu();
    });
  }
  const ti=document.getElementById('docs-field-title');
  const onTitleInput=function(){
    const id=S.activeDocId;
    if(!id||!ti)return;
    const d=docsFindId(id);
    if(!d)return;
    d.title=String(ti.value||'').trim();
    if(!window._docsRenamingId){
      const row=document.querySelector('.docs-item.active .docs-item-title');
      if(row&&row.tagName==='SPAN')row.textContent=d.title||'Documento sem título';
      const meta=document.querySelector('.docs-item.active .docs-item-meta');
      if(meta)meta.textContent=docsItemMeta(d);
    }
    window.docsQueueSave();
  };
  if(ti){
    ti.addEventListener('input',onTitleInput);
    ti.addEventListener('blur',function(){window.docsFlushSave();});
  }
  if(!window._docsSelBound){
    window._docsSelBound=true;
    document.addEventListener('selectionchange',function(){
      if((S.workspaceTab||'')!=='docs'||!document.querySelector('.docs-sheet-editor'))return;
      clearTimeout(window._docsSelUpdT);
      window._docsSelUpdT=setTimeout(function(){
        window.updateDocsToolbarState&&window.updateDocsToolbarState();
      },50);
    });
  }
  if(window._docsPillIv){clearInterval(window._docsPillIv);window._docsPillIv=null;}

window.calcBlockTime=function(id){
  const ae=document.getElementById('audio-'+id);const te=document.getElementById('time-'+id);
  let s=0;
  if(ae&&ae.innerText.trim()){
    const txt=ae.innerText.trim();
    const words=txt.split(/\s+/).filter(Boolean).length;
    const punctPauses=(txt.match(/[,:;.!?]/g)||[]).length;
    const lineBreakPauses=(txt.match(/\n/g)||[]).length;
    // 2.35 palavras/s (~141 ppm) + pausas naturais de fala
    s=Math.ceil((words/2.35)+(punctPauses*0.22)+(lineBreakPauses*0.45));
  }
  if(te)te.value=s>0?s+'s':'';
  window.calcTotalTime();
};
window.calcTotalTime=function(){
  if(!S.draft)return;
  let tot=0;
  S.draft.blocks.forEach(b=>{const te=document.getElementById('time-'+b.id);let v=te?te.value:b.time;if(v){let n=parseInt(v.replace(/\D/g,''));if(!isNaN(n))tot+=n}});
  const tr=document.getElementById('time-tracker');const ve=document.getElementById('tt-value');const ae=document.getElementById('tt-alert');
  if(!tr||!ve)return;
  let m=Math.floor(tot/60),s=tot%60;let ts=`${m>0?m+'m ':''}${s}s`;
  ve.textContent=ts;
  const md=document.getElementById('meta-duration');if(md&&tot>0)md.value='~'+ts;
  tr.className='time-tracker no-print';if(ae)ae.textContent='';
  if(tot>=120){tr.classList.add('danger');if(ae)ae.textContent=' — Longo demais'}
  else if(tot>=90){tr.classList.add('warning');if(ae)ae.textContent=' — Atenção à retenção'}
  window.renderDurProgress&&window.renderDurProgress();
};

// ── Board data ──────────────────────────────────────
const CV_KEY = id => 'rmc_cvb_' + id;

function loadBoard(id){
  if(id === 'root'){
    return sGet(CV_KEY('root')) || {id:'root',label:'Workspace',
      items:[{id:'cv_rot_main',type:'roteiros',x:90,y:90}]};
  }
  return sGet(CV_KEY(id)) || {id:id,label:'Board',items:[]};
}
function saveBoard(id,data){ sSet(CV_KEY(id),data); }
function cvCurrentBoard(){ const s=window._CV.boardStack; return loadBoard(s[s.length-1]); }

function cvAddItem(item){
  const bId=window._CV.boardStack[window._CV.boardStack.length-1];
  const b=loadBoard(bId); b.items=[...(b.items||[]),item]; saveBoard(bId,b);
}
function cvUpdateItem(itemId,changes){
  const bId=window._CV.boardStack[window._CV.boardStack.length-1];
  const b=loadBoard(bId);
  b.items=(b.items||[]).map(it=>it.id===itemId?{...it,...changes}:it);
  saveBoard(bId,b);
}
function cvRemoveItem(itemId){
  const bId=window._CV.boardStack[window._CV.boardStack.length-1];
  const b=loadBoard(bId); b.items=(b.items||[]).filter(it=>it.id!==itemId); saveBoard(bId,b);
}

// ── Global canvas state ─────────────────────────────
if(!window._CV) window._CV={
  tool:'select', selected:null,
  pan:{x:100,y:100},
  panStart:null, panAnchor:null,
  dragItem:null, dragAnchor:null, dragStart:null,
  _didDrag:false,
  boardStack:['root'], boardLabels:{root:'Workspace'},
  eventsInit:false
};

const cvUid = ()=>'cv'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const CV_NOTE_COLORS=['c-yellow','c-green','c-blue','c-sand','c-pink','c-dark'];
let _cvNCI=0;
const CV_BP=['#b45309','#1d4ed8','#15803d','#9333ea','#be185d','#0891b2','#c2410c','#4338ca','#047857','#7c3aed','#dc2626','#0369a1'];
const CV_BE=['📋','🎬','✨','🎯','💡','🗂','📁','🌟','🎨','📐','🔖','💬'];
function cvBPC(n){ return CV_BP[n%CV_BP.length]; }
function cvBEC(n){ return CV_BE[n%CV_BE.length]; }

function cvCanvasPos(e){
  const w=document.getElementById('cv-wrap');
  if(!w) return {x:200,y:200};
  const r=w.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx-window._CV.pan.x, y:cy-window._CV.pan.y};
}

// ── Render items ────────────────────────────────────
function cvRenderItem(item,delay){
  const sel=window._CV.selected===item.id?' cv-sel':'';
  const anim=`animation-delay:${delay||0}s`;
  const xy=`left:${item.x}px;top:${item.y}px;`;
  const del=`<button class="cv-delbtn" onclick="cvDel('${item.id}',event)" title="Excluir">&times;</button>`;

  if(item.type==='board'||item.type==='roteiros'){
    const isRot=item.type==='roteiros';
    let subCount=0,label='',colorStr='',emoji='';
    if(isRot){
      subCount=S.roteiros.length; label='Roteiros'; colorStr='#1a1a18'; emoji='📋';
    } else {
      const sub=loadBoard(item.boardId||item.id+'_sub');
      subCount=(sub.items||[]).length;
      label=item.label||'Board'; colorStr=item.color||cvBPC(0); emoji=item.emoji||cvBEC(0);
    }
    const ct=subCount>0?subCount+' item'+(subCount!==1?'s':''):'vazio';
    return `<div class="cv-item${sel}" id="cvi-${item.id}" data-id="${item.id}" style="${xy}${anim}">
      <div class="cv-inner cv-board-wrap">
        <div class="cv-board-box" style="background:${colorStr}">${emoji}</div>
        <span class="cv-board-lbl" contenteditable="false"
          ondblclick="cvStartRename(this,event)"
          onblur="cvEndRename('${item.id}',this)">${window.esc(label)}</span>
        <div class="cv-board-ct">${ct}</div>
      </div>${del}
    </div>`;
  }

  if(item.type==='roteiro'){
    const r=S.roteiros.find(x=>x.id===item.roteiroId)||null;
    const title=r?r.title:(item.label||'Roteiro');
    const meta=r?[r.presenter||null,(r.blocks?.length||0)+'bl.',r.duration||null].filter(Boolean).join(' · '):'novo roteiro';
    const band=item.color||'#3b82f6';
    return `<div class="cv-item${sel}" id="cvi-${item.id}" data-id="${item.id}" style="${xy}${anim}">
      <div class="cv-inner cv-rot">
        <div class="cv-rot-band" style="background:${band}"></div>
        <div class="cv-rot-body">
          <div class="cv-rot-tag">roteiro</div>
          <div class="cv-rot-title">${window.esc(title)}</div>
          <div class="cv-rot-meta">${window.esc(meta)}</div>
          <div class="cv-rot-hint">duplo-clique para abrir &rarr;</div>
        </div>
      </div>${del}
    </div>`;
  }

  if(item.type==='note'){
    return `<div class="cv-item${sel}" id="cvi-${item.id}" data-id="${item.id}" style="${xy}${anim}">
      <div class="cv-inner cv-note ${item.color||'c-yellow'}">
        <div class="cv-note-lbl">nota</div>
        <div class="cv-note-txt" contenteditable="true"
          onblur="cvSave('${item.id}',{text:this.innerText.trim()})"
          onmousedown="event.stopPropagation()">${window.esc(item.text||'')}</div>
      </div>${del}
    </div>`;
  }

  if(item.type==='ref'){
    const hasImg=item.imgUrl&&item.imgUrl.trim();
    return `<div class="cv-item${sel}" id="cvi-${item.id}" data-id="${item.id}" style="${xy}${anim}">
      <div class="cv-inner cv-ref">
        <div class="cv-ref-img">${hasImg?`<img src="${window.esc(item.imgUrl)}" onerror="this.parentElement.innerHTML='🔗'" alt="">`:'🔗'}</div>
        <div class="cv-ref-bd">
          <div class="cv-ref-t" contenteditable="true"
            onblur="cvSave('${item.id}',{title:this.innerText.trim()})"
            onmousedown="event.stopPropagation()">${window.esc(item.title||'Referência')}</div>
          <div class="cv-ref-u" contenteditable="true"
            onblur="cvSave('${item.id}',{url:this.innerText.trim()})"
            onmousedown="event.stopPropagation()">${window.esc(item.url||'https://')}</div>
        </div>
      </div>${del}
    </div>`;
  }
  return '';
}

function buildCanvasHTML(){
  const board=cvCurrentBoard(); const items=board.items||[];
  const tool=window._CV.tool;
  const toolCls=tool!=='select'?' tool-'+tool:'';
  const html=items.map((it,i)=>cvRenderItem(it,i*.025)).join('');
  const hint=items.length===0?`<div class="cv-empty"><span class="cv-empty-icon">&#x2726;</span>
    <div class="cv-empty-txt">Use a barra lateral para adicionar itens<br>Duplo-clique para abrir boards</div></div>`:'';
  return `<div class="canvas-wrap${toolCls}" id="cv-wrap">
    <div class="canvas-inner" id="cv-inner" style="transform:translate(${window._CV.pan.x}px,${window._CV.pan.y}px)">
      ${hint}${html}
    </div>
  </div>`;
}

function cvRepaint(){
  if(S.view!=='home') return;
  const m=document.getElementById('main');
  if(m){ m.innerHTML=buildCanvasHTML(); cvBindCanvas(); }
  cvUpdateBreadcrumb();
}

// ── Item actions ────────────────────────────────────
window.cvDel=function(id,e){
  if(e){e.stopPropagation();e.preventDefault();}
  cvRemoveItem(id); window._CV.selected=null; cvRepaint();
};
window.cvSave=function(id,changes){ cvUpdateItem(id,changes); };
window.cvSel=function(id){
  window._CV.selected=id;
  document.querySelectorAll('.cv-item').forEach(el=>el.classList.toggle('cv-sel',el.dataset.id===id));
};
window.cvStartRename=function(el,e){
  e.stopPropagation(); el.contentEditable='true'; el.focus();
  const r=document.createRange(); r.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
};
window.cvEndRename=function(id,el){
  el.contentEditable='false';
  const newLabel=el.innerText.trim()||'Board';
  cvUpdateItem(id,{label:newLabel});
  const bId=window._CV.boardStack[window._CV.boardStack.length-1];
  const b=loadBoard(bId); const item=(b.items||[]).find(it=>it.id===id);
  if(item&&item.type==='board'){
    const sub=loadBoard(item.boardId||id+'_sub');
    sub.label=newLabel; saveBoard(sub.id,sub); window._CV.boardLabels[sub.id]=newLabel;
  }
};

function cvOpenById(itemId){
  const bId=window._CV.boardStack[window._CV.boardStack.length-1];
  const b=loadBoard(bId); const item=(b.items||[]).find(it=>it.id===itemId);
  if(!item) return;
  if(item.type==='roteiros'){ S.view='trello'; window.render(); return; }
  if(item.type==='board'){
    const subId=item.boardId||itemId+'_sub';
    if(!sGet(CV_KEY(subId))) saveBoard(subId,{id:subId,label:item.label||'Board',items:[]});
    window._CV.boardStack.push(subId);
    window._CV.boardLabels[subId]=item.label||'Board';
    window._CV.pan={x:100,y:100}; window._CV.selected=null; cvRepaint(); return;
  }
  if(item.type==='roteiro'){
    const r=item.roteiroId?S.roteiros.find(x=>x.id===item.roteiroId):null;
    if(r) window.goViewer(r.id);
  }
}

window.cvNavTo=function(idx){
  window._CV.boardStack=window._CV.boardStack.slice(0,idx+1);
  window._CV.pan={x:100,y:100}; window._CV.selected=null; cvRepaint();
};

// ── Tool ────────────────────────────────────────────
window.cvSetTool=function(tool){
  window._CV.tool=tool;
  document.querySelectorAll('[data-tool]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tool===tool);
  });
};

// ── Place item ──────────────────────────────────────
function cvPlaceAt(x,y){
  const tool=window._CV.tool;
  const bId=window._CV.boardStack[window._CV.boardStack.length-1];
  const n=loadBoard(bId).items?.length||0;
  if(tool==='note'){
    const color=CV_NOTE_COLORS[_cvNCI++%CV_NOTE_COLORS.length];
    cvAddItem({id:cvUid(),type:'note',x:x-86,y:y-50,text:'',color});
    cvSetTool('select'); cvRepaint();
    setTimeout(()=>{const ns=document.querySelectorAll('.cv-note-txt');if(ns.length)ns[ns.length-1].focus();},80);
    return;
  }
  if(tool==='board'){
    const subId='b'+Date.now();
    saveBoard(subId,{id:subId,label:'Novo Board',items:[]});
    cvAddItem({id:cvUid(),type:'board',x:x-60,y:y-48,label:'Novo Board',boardId:subId,color:cvBPC(n),emoji:cvBEC(n)});
    cvSetTool('select'); cvRepaint(); return;
  }
  if(tool==='roteiro'){
    window._cvPendingRoteiro={x:x-100,y:y-60,colorIdx:n};
    cvSetTool('select'); cvRepaint();
    window.showTemplateModal&&window.showTemplateModal();
    return;
  }
  if(tool==='ref'){
    const url=prompt('Cole uma URL (link ou imagem):');
    if(!url) return;
    const isImg=/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(url);
    cvAddItem({id:cvUid(),type:'ref',x:x-104,y:y-60,title:'Referência',url:url.trim(),imgUrl:isImg?url.trim():''});
    cvSetTool('select'); cvRepaint(); return;
  }
}

// ── Event binding (per canvas render) ──────────────
function cvBindCanvas(){
  const wrap=document.getElementById('cv-wrap');
  if(!wrap) return;
  wrap.addEventListener('click',function(e){
    if(window._CV._didDrag){window._CV._didDrag=false;return;}
    const itemEl=e.target.closest('.cv-item');
    if(itemEl){cvSel(itemEl.dataset.id);return;}
    if(window._CV.tool!=='select'){
      const pos=cvCanvasPos(e); cvPlaceAt(pos.x,pos.y);
    } else {
      window._CV.selected=null;
      document.querySelectorAll('.cv-item').forEach(el=>el.classList.remove('cv-sel'));
    }
  });
  wrap.addEventListener('dblclick',function(e){
    const itemEl=e.target.closest('.cv-item[data-id]');
    if(itemEl){e.preventDefault();cvOpenById(itemEl.dataset.id);}
  });
  wrap.addEventListener('mousedown',function(e){
    const del=e.target.closest('.cv-delbtn');
    if(del) return;
    const itemEl=e.target.closest('.cv-item');
    if(itemEl){
      if(window._CV.tool!=='select') return;
      const id=itemEl.dataset.id;
      window._CV.dragItem=id; window._CV._didDrag=false;
      window._CV.dragAnchor={x:e.clientX,y:e.clientY};
      const bId=window._CV.boardStack[window._CV.boardStack.length-1];
      const b=loadBoard(bId); const it=(b.items||[]).find(x=>x.id===id);
      window._CV.dragStart={x:it?it.x:0,y:it?it.y:0};
      return;
    }
    if(window._CV.tool==='select'){
      window._CV.panStart={x:e.clientX,y:e.clientY};
      window._CV.panAnchor={...window._CV.pan};
    }
  });
}

function cvInitEvents(){
  if(window._CV.eventsInit) return;
  window._CV.eventsInit=true;
  document.addEventListener('mousemove',function(e){
    if(window._CV.dragItem){
      const dx=e.clientX-window._CV.dragAnchor.x; const dy=e.clientY-window._CV.dragAnchor.y;
      if(Math.abs(dx)>3||Math.abs(dy)>3) window._CV._didDrag=true;
      const nx=window._CV.dragStart.x+dx; const ny=window._CV.dragStart.y+dy;
      const el=document.getElementById('cvi-'+window._CV.dragItem);
      if(el){el.style.left=nx+'px';el.style.top=ny+'px';} return;
    }
    if(window._CV.panStart){
      window._CV.pan.x=window._CV.panAnchor.x+(e.clientX-window._CV.panStart.x);
      window._CV.pan.y=window._CV.panAnchor.y+(e.clientY-window._CV.panStart.y);
      const inner=document.getElementById('cv-inner');
      if(inner) inner.style.transform=`translate(${window._CV.pan.x}px,${window._CV.pan.y}px)`;
    }
  });
  document.addEventListener('mouseup',function(){
    if(window._CV.dragItem){
      const el=document.getElementById('cvi-'+window._CV.dragItem);
      if(el) cvUpdateItem(window._CV.dragItem,{x:parseInt(el.style.left)||0,y:parseInt(el.style.top)||0});
      window._CV.dragItem=null;
    }
    window._CV.panStart=null; window._CV.panAnchor=null;
  });
  document.addEventListener('keydown',function(e){
    if(S.view!=='home') return;
    if(e.target.isContentEditable||e.target.tagName==='INPUT') return;
    const k=e.key;
    if(k==='v'||k==='Escape') cvSetTool('select');
    else if(k==='n') cvSetTool('note');
    else if(k==='b') cvSetTool('board');
    else if(k==='r') cvSetTool('roteiro');
    else if(k==='l') cvSetTool('ref');
    else if((k==='Delete'||k==='Backspace')&&window._CV.selected) cvDel(window._CV.selected,null);
  });
}

// ── Breadcrumb ──────────────────────────────────────
function cvUpdateBreadcrumb(){
  const bar=document.getElementById('breadcrumb-bar');
  if(!bar) return;
  // Only show breadcrumb deep inside canvas boards — hidden on workspace/trello home
  const stack=window._CV.boardStack;
  const showBar=(S.view==='home')&&stack.length>1;
  bar.classList.toggle('visible',showBar);
  bar.classList.toggle('cv-bc',S.view==='home');
  if(!showBar){bar.innerHTML='';return;}
  const labels=Object.assign({root:'Workspace'},window._CV.boardLabels);
  let bHtml=stack.map((id,i)=>{
    const lbl=labels[id]||'Board'; const isLast=i===stack.length-1;
    return `${i>0?'<span class="bc-sep">›</span>':''}<span class="bc-item${isLast?' cur':''}" onclick="${isLast?'':('cvNavTo('+i+')')}">${window.esc(lbl)}</span>`;
  }).join('');
  bar.innerHTML=bHtml;
}

window.goCanvas=function(){S.view='home';S.draft=null;S.viewId=null;window._boardSearch='';window._CV.selected=null;window.render();};

window.updatePreview=function(){
  const pb=document.getElementById('preview-body');
  if(!pb||!S.draft)return;
  const title=document.getElementById('meta-title')?.value||S.draft.title||'(sem título)';
  const presenter=document.getElementById('meta-presenter')?.value||S.draft.presenter||'';
  const dur=document.getElementById('meta-duration')?.value||S.draft.duration||'';
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim()};
  let html='';
  html+=`<div class="pv-header">`;
  html+=`<div class="pv-title">${window.esc(title)}</div>`;
  if(presenter||dur)html+=`<div class="pv-meta">${[presenter?'👤 '+window.esc(presenter):null,dur?window.esc(dur):null].filter(Boolean).join(' · ')}</div>`;
  html+=`</div>`;
  S.draft.blocks.forEach((b,i)=>{
    const audioEl=document.getElementById('audio-'+b.id);
    const videoEl=document.getElementById('video-'+b.id);
    const notesEl=document.getElementById('notes-'+b.id);
    const audioTxt=audioEl?audioEl.innerHTML:b.audio;
    const videoTxt=videoEl?videoEl.innerHTML:b.video;
    const notesTxt=notesEl?notesEl.innerHTML:b.notes;
    const hasAudio=strip(audioTxt).length>0;
    const hasVideo=strip(videoTxt).length>0;
    const hasNotes=strip(notesTxt).length>0;
    const faseLabel=b.fase==='inicio'?'INÍCIO':(b.fase==='fim'?'FIM':'MEIO');
    const faseColor=b.fase==='inicio'?'var(--fi-tx)':(b.fase==='fim'?'var(--ff-tx)':'var(--fm-tx)');
    const timeEl=document.getElementById('time-'+b.id);
    const time=timeEl?timeEl.value:b.time;
    html+=`<div class="pv-block" id="pv-block-${b.id}">`;
    html+=`<div class="pv-block-hd"><button type="button" class="pv-num" onclick="event.preventDefault();window.scrollEditorToBlock('${b.id}')" title="Ir ao bloco no editor">#${i+1}</button><span class="pv-fase" style="color:${faseColor}">${faseLabel}</span>${time?`<span class="pv-time">${window.esc(time)}</span>`:''}</div>`;
    if(hasAudio)html+=`<div class="pv-section"><div class="pv-section-lbl">ÁUDIO</div><div class="pv-text pv-audio">${sanitizeHTML(audioTxt)}</div></div>`;
    if(hasVideo)html+=`<div class="pv-section"><div class="pv-section-lbl">VÍDEO</div><div class="pv-text pv-video">${sanitizeHTML(videoTxt)}</div></div>`;
    if(hasNotes)html+=`<div class="pv-section"><div class="pv-section-lbl">NOTAS</div><div class="pv-text pv-notes">${sanitizeHTML(notesTxt)}</div></div>`;
    if(!hasAudio&&!hasVideo)html+=`<div class="pv-empty">bloco vazio</div>`;
    html+=`</div>`;
  });
  pb.innerHTML=html;
  window.updateStructureTimeline&&window.updateStructureTimeline();
};

window.rtApplyLineHeight=function(lh){
  if(!lh)return;
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0)return;
  const range=sel.getRangeAt(0);
  let node=range.commonAncestorContainer;
  while(node&&node.nodeType!==1)node=node.parentNode;
  let editor=node;
  while(editor&&!editor.classList?.contains('rich-editor'))editor=editor.parentElement;
  if(editor)editor.style.lineHeight=lh;
};

// ── PASTE HANDLER — trim extra whitespace ─────────────────────
document.addEventListener('paste',function(e){
  const target=e.target;
  if(!target.classList||!target.classList.contains('rich-editor'))return;
  e.preventDefault();
  const text=(e.clipboardData||window.clipboardData).getData('text/plain');
  const trimmed=text.replace(/^[\s\n\r]+/,'').replace(/[\s\n\r]+$/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  // Insert as plain text preserving internal line breaks
  const lines=trimmed.split('\n');
  const frag=document.createDocumentFragment();
  lines.forEach((line,i)=>{
    if(i>0)frag.appendChild(document.createElement('br'));
    if(line)frag.appendChild(document.createTextNode(line));
  });
  const sel=window.getSelection();
  if(sel&&sel.rangeCount>0){
    const range=sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(frag);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  // Trigger recalc if inside a block
  const blockId=target.id.replace('audio-','').replace('video-','').replace('notes-','');
  if(document.getElementById('time-'+blockId))window.calcBlockTime(blockId);
  else window.calcTotalTime?.();
});

// ── AUTO-SAVE DRAFT every 5 min ─────────────────────────────────
window._autoSaveTimer=null;
window._autoSaveDebounce=null;
window._lastAutoToastAt=0;
window.autoSaveNow=function(reason){
  if(S.view!=='editor'||!S.draft)return;
  window.collectDOM&&window.collectDOM();
  const draft=JSON.parse(JSON.stringify(S.draft));
  draft.updatedAt=Date.now();
  try{localStorage.setItem('rmc_autosave_draft',JSON.stringify(draft));}catch(e){}
  const hasContent=(draft.blocks||[]).some(function(b){
    return window.stripHTML(b.audio).length>0||window.stripHTML(b.video).length>0||window.stripHTML(b.notes).length>0;
  });
  if(hasContent){
    if(!draft.title||!draft.title.trim())return;
    persistRoteiro(draft);
    S.draft=JSON.parse(JSON.stringify(draft));
    if(!reason||reason!=='silent'){
      const now=Date.now();
      if(now-window._lastAutoToastAt>30000){
        window._lastAutoToastAt=now;
        window.showToast('Alterações salvas automaticamente');
      }
    }
  }
};
function startAutoSave(){
  if(window._autoSaveTimer)clearInterval(window._autoSaveTimer);
  if(window._autoSaveDebounce)clearTimeout(window._autoSaveDebounce);
  window._autoSaveTimer=setInterval(function(){
    window.autoSaveNow&&window.autoSaveNow('silent');
  },5*60*1000);
}

  },1800);
});

const PRUNE_APART_QUARTO_KEY='rmc_pruned_apart_quarto_iratis_v2';
window.pruneApartamentoQuartoIratisOnce=function(){
  if(sGet(PRUNE_APART_QUARTO_KEY))return;
  try{
    const TL=function(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();};
    const matchApart=function(r){
      const t=TL(r.title);
      return t.includes('apartamento')||t.includes('ape vazio')||t.includes('o ape')||t.includes('apê vazio')||t.includes('episodio 1');
    };
    const matchQuartoIratis=function(r){
      const t=TL(r.title);
      return t.includes('quarto')&&t.includes('iratis');
    };
    let roApart=(S.roteiros||[]).find(matchApart);
    let roQI=(S.roteiros||[]).find(matchQuartoIratis);
    if(roApart&&roQI&&roApart.id===roQI.id)roQI=null;
    const tplApart=JSON.parse(JSON.stringify(EXEMPLO));
    if(!roApart){roApart=tplApart;roApart.id=uid();roApart.title='Roteiro do apartamento';roApart.updatedAt=Date.now();}
    else{roApart=JSON.parse(JSON.stringify(roApart));roApart.blocks=(roApart.blocks||[]).map(upgradeBlock);}
    if(!roQI){
      roQI={id:uid(),title:'Quarto Iratis',presenter:'',duration:'',created:new Date().toLocaleDateString('pt-BR'),updatedAt:Date.now(),blocks:[
        {id:uid(),fase:'inicio',tags:['aroll'],time:'',audio:'Abertura: contexto do quarto e do que o espectador vai aprender neste vídeo.',video:'',notes:''},
        {id:uid(),fase:'meio',tags:['aroll'],time:'',audio:'Desenvolvimento: benefícios, dúvidas frequentes e prova social.',video:'',notes:''},
        {id:uid(),fase:'fim',tags:['aroll'],time:'',audio:'Fechamento: chamada para ação e próximo passo.',video:'',notes:''}
      ]};
    }else{roQI=JSON.parse(JSON.stringify(roQI));roQI.blocks=(roQI.blocks||[]).map(upgradeBlock);roQI.updatedAt=Date.now();}
    const keepIds=[roApart.id,roQI.id];
    const oldIds=(S.roteiros||[]).map(function(x){return x.id;});
    oldIds.forEach(function(pid){if(keepIds.indexOf(pid)<0)sDel(ROT_KEY(pid));});
    sSet(ROT_KEY(roApart.id),roApart);
    sSet(ROT_KEY(roQI.id),roQI);
    S.roteiros=[roApart,roQI];
    sSet(IDX_KEY,keepIds);
    sDel(WS_BOARD_KEY);
    sSet(PRUNE_APART_QUARTO_KEY,'1');
  }catch(e){console.error(e);}
};

// Drag logic
(function(){
  let drag=null,ox=0,oy=0;
  window.bbDragStart=function(e,id){
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON'||e.target.tagName==='SELECT'||e.target.classList.contains('bb-port')||e.target.closest&&e.target.closest('[data-bb-port]'))return;
    const el=document.getElementById('bbc-'+id);if(!el)return;
    drag={id,el};el.classList.add('dragging');
    const rect=el.getBoundingClientRect();const canvas=document.getElementById('bb-canvas');const cr=canvas?canvas.getBoundingClientRect():{left:0,top:0};
    ox=e.clientX-rect.left;oy=e.clientY-rect.top;
    function move(ev){
      if(!drag)return;
      const canvas=document.getElementById('bb-canvas');const cr=canvas?canvas.getBoundingClientRect():{left:0,top:0};
      let nx=ev.clientX-cr.left-ox,ny=ev.clientY-cr.top-oy;
      nx=Math.max(0,Math.min(canvas?canvas.offsetWidth-190:600,nx));
      ny=Math.max(0,Math.min(canvas?canvas.offsetHeight-120:400,ny));
      drag.el.style.left=nx+'px';drag.el.style.top=ny+'px';
      if(window.bbUpdateArrows)window.bbUpdateArrows();
    }
    function up(ev){
      if(!drag)return;
      const canvas=document.getElementById('bb-canvas');const cr=canvas?canvas.getBoundingClientRect():{left:0,top:0};
      const nx=parseFloat(drag.el.style.left)||0,ny=parseFloat(drag.el.style.top)||0;
      const c=S.beatCards.find(x=>x.id===drag.id);if(c){c.x=nx;c.y=ny;persistBeat();}
      if(window.bbUpdateArrows)window.bbUpdateArrows();
      drag.el.classList.remove('dragging');drag=null;
      document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
    }
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    e.preventDefault();
  };
})();

function bbNormal(side){
  if(side==='top')return{x:0,y:-1};
  if(side==='bottom')return{x:0,y:1};
  if(side==='left')return{x:-1,y:0};
  if(side==='right')return{x:1,y:0};
  return{x:0,y:-1};
}
function bbAnchor(cardId,side){
  const card=document.getElementById('bbc-'+cardId);
  const canvas=document.getElementById('bb-canvas');
  if(!card||!canvas)return null;
  const crect=canvas.getBoundingClientRect();
  const r=card.getBoundingClientRect();
  let x,y;
  if(side==='top'){x=r.left-crect.left+r.width/2;y=r.top-crect.top;}
  else if(side==='bottom'){x=r.left-crect.left+r.width/2;y=r.bottom-crect.top;}
  else if(side==='left'){x=r.left-crect.left;y=r.top-crect.top+r.height/2;}
  else{x=r.right-crect.left;y=r.top-crect.top+r.height/2;}
  return{x,y};
}
function bbCubicPath(p0,p3,n0,n3,idx,total){
  const dx=p3.x-p0.x,dy=p3.y-p0.y;
  const len=Math.hypot(dx,dy)||1;
  const px=-dy/len,py=dx/len;
  const stagger=(idx-(total-1)/2)*26;
  const t=88+idx*12;
  const c1x=p0.x+n0.x*t+px*stagger,c1y=p0.y+n0.y*t+py*stagger;
  const c2x=p3.x+n3.x*t-px*stagger,c2y=p3.y+n3.y*t-py*stagger;
  return'M '+p0.x+' '+p0.y+' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p3.x+' '+p3.y;
}
function bbFlowPath(p0,p3,n0,n3,idx,total){
  const dx=p3.x-p0.x,dy=p3.y-p0.y;
  const len=Math.hypot(dx,dy)||1;
  const px=-dy/len,py=dx/len;
  const stagger=(idx-(total-1)/2)*36;
  const t=150+idx*18;
  const c1x=p0.x+n0.x*t+px*stagger,c1y=p0.y+n0.y*t+py*stagger;
  const c2x=p3.x+n3.x*t-px*stagger,c2y=p3.y+n3.y*t-py*stagger;
  return'M '+p0.x+' '+p0.y+' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p3.x+' '+p3.y;
}
function bbElbowPathSimple(p0,p3,s0){
  const k=70;
  const n0=bbNormal(s0);
  const a={x:p0.x+n0.x*k,y:p0.y+n0.y*k};
  const horiz=Math.abs(p3.x-a.x)>=Math.abs(p3.y-a.y);
  if(horiz)return'M '+p0.x+' '+p0.y+' L '+a.x+' '+a.y+' L '+p3.x+' '+a.y+' L '+p3.x+' '+p3.y;
  return'M '+p0.x+' '+p0.y+' L '+a.x+' '+a.y+' L '+a.x+' '+p3.y+' L '+p3.x+' '+p3.y;
}

window.bbPortClick=function(e,cardId,side){
  if(e){e.stopPropagation();e.preventDefault();}
  const p=window._bbConnPending;
  if(!p){
    window._bbConnPending={cardId:cardId,side:side};
    document.querySelectorAll('.bb-card').forEach(function(c){c.classList.remove('bb-conn-target');});
    var card=document.getElementById('bbc-'+cardId);
    if(card)card.classList.add('bb-conn-target');
    showToast('Clique no ponto de destino (outro card).');
    return;
  }
  if(p.cardId===cardId&&p.side===side){
    window._bbConnPending=null;
    document.querySelectorAll('.bb-card').forEach(function(c){c.classList.remove('bb-conn-target');});
    showToast('Conexão cancelada.');
    return;
  }
  if(!window._bbArrows)window._bbArrows=[];
  var dup=window._bbArrows.some(function(a){
    return a.fromId===p.cardId&&a.fromSide===p.side&&a.toId===cardId&&a.toSide===side;
  });
  if(!dup){
    window._bbArrows.push({id:uid(),fromId:p.cardId,fromSide:p.side,toId:cardId,toSide:side});
    window.persistBbArrows();
    window.bbUpdateArrows();
    showToast('Linha criada.');
  }else{showToast('Essa conexão já existe.');}
  window._bbConnPending=null;
  document.querySelectorAll('.bb-card').forEach(function(c){c.classList.remove('bb-conn-target');});
};
if(!window._bbConnKeydown){
  window._bbConnKeydown=true;
  document.addEventListener('keydown',function(ev){
    if(ev.key!=='Escape'||!window._bbConnPending)return;
    window._bbConnPending=null;
    document.querySelectorAll('.bb-card').forEach(function(c){c.classList.remove('bb-conn-target');});
    showToast('Conexão cancelada.');
  });
}
window.bbUpdateArrows=function(){
  const svg=document.getElementById('bb-arrows-svg');
  const canvas=document.getElementById('bb-canvas');
  if(!svg||!canvas)return;
  const w=Math.max(400,canvas.clientWidth||800),h=Math.max(320,canvas.clientHeight||600);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width',w);
  svg.setAttribute('height',h);
  const styleSel=document.getElementById('bb-arrow-style');
  const st=styleSel?styleSel.value:'solid';
  var stroke='#4f98a3',dash='';
  var sw=2.5;
  if(st==='dashed')dash='10 7';
  if(st==='red')stroke='#dc2626';
  if(st==='green')stroke='#16a34a';
  if(st==='blue')stroke='#2563eb';
  var arrows=window._bbArrows||[];
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  arrows.forEach(function(a,idx){
    var p0=bbAnchor(a.fromId,a.fromSide);
    var p3=bbAnchor(a.toId,a.toSide);
    if(!p0||!p3)return;
    var n0=bbNormal(a.fromSide);
    var n3=bbNormal(a.toSide);
    var d;
    if(st==='elbow')d=bbElbowPathSimple(p0,p3,a.fromSide);
    else if(st==='flow')d=bbFlowPath(p0,p3,n0,n3,idx,arrows.length);
    else d=bbCubicPath(p0,p3,n0,n3,idx,arrows.length);
    function addPath(dstr,clickId,strokeW){
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',dstr);
      path.setAttribute('fill','none');
      path.setAttribute('stroke',stroke);
      path.setAttribute('stroke-width',strokeW||sw);
      if(dash)path.setAttribute('stroke-dasharray',dash);
      path.setAttribute('stroke-linecap','round');
      path.setAttribute('stroke-linejoin','round');
      if(clickId){
        path.setAttribute('data-aid',clickId);
        path.style.pointerEvents='stroke';
        path.style.cursor='pointer';
        path.addEventListener('click',function(ev){
          ev.stopPropagation();ev.preventDefault();
          window._bbArrows=(window._bbArrows||[]).filter(function(x){return x.id!==a.id;});
          window.persistBbArrows();
          window.bbUpdateArrows();
        });
      }else{
        path.style.pointerEvents='none';
      }
      svg.appendChild(path);
    }
    if(st==='double'){
      var dx=p3.x-p0.x,dy=p3.y-p0.y,len=Math.hypot(dx,dy)||1,ox=-dy/len*5,oy=dx/len*5;
      addPath(bbCubicPath({x:p0.x+ox,y:p0.y+oy},{x:p3.x+ox,y:p3.y+oy},n0,n3,idx,arrows.length),a.id,sw*0.95);
      addPath(bbCubicPath({x:p0.x-ox,y:p0.y-oy},{x:p3.x-ox,y:p3.y-oy},n0,n3,idx,arrows.length),null,sw*0.95);
    }else{
      addPath(d,a.id,sw);
    }
  });
};
window.bbAutoLayout=function(){
  var cards=S.beatCards||[];
  if(!cards.length){showToast('Nenhum cartão para organizar.');return;}
  var canvas=document.getElementById('bb-canvas');
  var cw=(canvas?canvas.clientWidth:900)-24;
  var arrows=window._bbArrows||[];
  var incoming=new Map(cards.map(function(c){return[c.id,0];}));
  arrows.forEach(function(a){incoming.set(a.toId,(incoming.get(a.toId)||0)+1);});
  var roots=cards.filter(function(c){return(incoming.get(c.id)||0)===0;});
  var ordered=[];
  var seen=new Set();
  function walk(id){
    if(seen.has(id))return;
    seen.add(id);
    var c=cards.find(function(x){return x.id===id;});
    if(c)ordered.push(c);
    arrows.filter(function(ar){return ar.fromId===id;}).forEach(function(ar){walk(ar.toId);});
  }
  (roots.length?roots:cards).forEach(function(c){walk(c.id);});
  cards.forEach(function(c){if(!seen.has(c.id))walk(c.id);});
  var order=ordered.length?ordered:cards.slice();
  var cols=Math.max(2,Math.min(6,Math.floor((cw||800)/228)));
  order.forEach(function(c,i){
    c.x=20+(i%cols)*228;
    c.y=56+Math.floor(i/cols)*198;
  });
  persistBeat();
  order.forEach(function(c){
    var el=document.getElementById('bbc-'+c.id);
    if(el){el.style.left=(c.x||0)+'px';el.style.top=(c.y||0)+'px';}
  });
  window.bbUpdateArrows();
  showToast('Cartões organizados em grade.');
};

window.duplicateBlock=function(id){
  if(!S.draft||!Array.isArray(S.draft.blocks))return;
  window.collectDOM&&window.collectDOM();
  const idx=S.draft.blocks.findIndex(b=>b.id===id);
  if(idx<0)return;
  const original=S.draft.blocks[idx];
  const clone=JSON.parse(JSON.stringify(original));
  clone.id=uid();
  clone.time='';
  S.draft.blocks.splice(idx+1,0,clone);
  const container=document.getElementById('blocks-container');
  const ref=document.getElementById('be-'+id);
  if(container&&ref&&typeof renderBlockCard==='function'){
    const newIdx=idx+1;
    const temp=document.createElement('div');
    temp.innerHTML=renderBlockCard(clone,newIdx,S.draft.blocks.length).trim();
    const newEl=temp.firstElementChild;
    if(newEl){
      ref.insertAdjacentElement('afterend',newEl);
      S.draft.blocks.forEach(function(b,i){
        const card=document.getElementById('be-'+b.id);
        if(card){
          const num=card.querySelector('.be-block-num');
          if(num)num.textContent='#'+(i+1);
        }
      });
      window.refreshEditorBlockFooters&&window.refreshEditorBlockFooters();
      window.hydrateEditorBlock&&window.hydrateEditorBlock(clone.id);
      window.calcTotalTime&&window.calcTotalTime();
      setTimeout(function(){
        const el=document.getElementById('be-'+clone.id);
        if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
        window.updatePreview&&window.updatePreview();
      },30);
      window.showToast('✅ Bloco duplicado!');
      return;
    }
  }
  window.renderEditor&&window.renderEditor();
  window.calcTotalTime&&window.calcTotalTime();
  setTimeout(function(){
    const el=document.getElementById('be-'+clone.id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    window.updatePreview&&window.updatePreview();
  },100);
  window.showToast('✅ Bloco duplicado!');
};

window._jspdfLoadPromise=null;
window.ensureJsPDF=function(cb){
  if(window.jspdf&&window.jspdf.jsPDF){cb();return;}
  if(!window._jspdfLoadPromise){
    window._jspdfLoadPromise=new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload=res;s.onerror=function(){rej(new Error('jspdf'));};
      document.head.appendChild(s);
    });
  }
  window._jspdfLoadPromise.then(function(){cb();}).catch(function(){window.showToast('Não foi possível carregar o gerador de PDF.');});
};
window.exportRoteiroTextPdf=function(r){
  var strip=function(h){var d=document.createElement('div');d.innerHTML=h||'';return(d.textContent||d.innerText||'').trim();};
  var JsPDF=window.jspdf.jsPDF;
  var doc=new JsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  var pageH=doc.internal.pageSize.getHeight();
  var pageW=doc.internal.pageSize.getWidth();
  var margin=15;
  var maxW=pageW-margin*2;
  var y=margin;
  var lineGap=5.2;
  function newPage(){doc.addPage();y=margin;}
  function needSpace(h){if(y+h>pageH-margin){newPage();}}
  function writeLines(txt,size,normal){
    if(!txt)return;
    doc.setFontSize(size||10);
    if(normal!==false)doc.setFont('helvetica','normal');
    var lines=doc.splitTextToSize(txt,maxW);
    for(var i=0;i<lines.length;i++){
      needSpace(lineGap);
      doc.text(lines[i],margin,y);
      y+=lineGap;
    }
  }
  doc.setFontSize(16);
  doc.setFont('helvetica','bold');
  writeLines(strip(r.title)||'Roteiro sem título',16,false);
  doc.setFont('helvetica','normal');
  y+=2;
  doc.setFontSize(10);
  if(r.presenter){writeLines('Apresentador(a): '+strip(r.presenter),10);}
  if(r.duration){writeLines('Duração: '+strip(r.duration),10);}
  y+=4;
  var blocks=r.blocks||[];
  if(!blocks.length){

};

  }else{

window.openTeleprompter=function(rId){
  if(S.draft)window.collectDOM&&window.collectDOM();
  const r=rId?S.roteiros.find(x=>x.id===rId):(S.draft?{...S.draft,blocks:S.draft.blocks.map(b=>{const ae=document.getElementById('audio-'+b.id);return{...b,audio:ae?ae.innerHTML:b.audio};})}:null);
  if(!r){showToast('Abra um roteiro para usar o teleprompter.');return;}
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim();};
  // Build editable blocks list
  let teleBlocks=r.blocks.filter(b=>strip(b.audio).length>0).map(b=>({id:b.id,num:r.blocks.indexOf(b)+1,fase:b.fase||'meio',text:strip(b.audio)}));
  let _playing=false,_anim=null,_y=0,_mirror=false,_mode='read';
  const themes={black:'#000',darkblue:'#060d1f',darkgreen:'#04120a',softblack:'#111'};
  const textColors={white:'rgba(255,255,255,.95)',yellow:'#fde68a',green:'#bbf7d0',cream:'#fefce8'};
  const wordCount=teleBlocks.reduce((a,b)=>a+b.text.split(/\s+/).filter(Boolean).length,0);

  function buildReadHTML(){
    return teleBlocks.map((b,i)=>`
      <div class="tele-block" id="tele-b-${i}">
        <div class="tele-block-num">BLOCO #${b.num} · ${b.fase.toUpperCase()}</div>
        <div class="tele-text" id="tele-t-${i}">${window.esc(b.text)}</div>
      </div>`).join('');
  }
  function buildEditHTML(){
    return`<div class="tele-edit-area" id="tele-edit-area">
      ${teleBlocks.map((b,i)=>`
        <div class="tele-edit-block">
          <div class="tele-edit-lbl">BLOCO #${b.num} · ${b.fase.toUpperCase()}</div>
          <textarea class="tele-edit-input" id="tele-edit-${i}" rows="3">${window.esc(b.text)}</textarea>
        </div>`).join('')}
    </div>`;
  }
  function applyTheme(){
    const th=ov.getAttribute('data-theme')||'black';
    ov.style.background=themes[th]||'#000';
    const tc=document.getElementById('tele-tc')?.value||'white';
    ov.querySelectorAll('.tele-text').forEach(el=>el.style.color=textColors[tc]||'#fff');
    ov.querySelectorAll('.tele-fade-top').forEach(el=>el.style.background=`linear-gradient(to bottom,${themes[th]||'#000'},transparent)`);
    ov.querySelectorAll('.tele-fade-bot').forEach(el=>el.style.background=`linear-gradient(to top,${themes[th]||'#000'},transparent)`);
  }
  function applyFontSize(){
    const sz=document.getElementById('tele-fs')?.value||'auto';
    ov.querySelectorAll('.tele-text,.tele-edit-input').forEach(el=>{
      el.style.fontSize=sz==='auto'?'clamp(20px,3vw,44px)':sz+'px';
    });
  }
  function applyContentTransform(y){
    const c=document.getElementById('tele-content');
    if(!c)return;
    const mx=_mirror?' scaleX(-1)':'';
    c.style.transform='translateY(-'+y+'px)'+mx;
  }

  const ov=document.createElement('div');ov.className='tele-overlay';ov.setAttribute('data-theme','black');
  ov.innerHTML=`
    <div class="tele-topbar">
      <span class="tele-title">▶ ${window.esc(r.title||'Roteiro')}${r.presenter?' — '+window.esc(r.presenter):''}</span>
      <!-- Speed -->
      <div class="tele-ctrl-grp">
        <span class="tele-lbl">Vel.</span>
        <input id="tele-speed" class="tele-range" type="range" min="1" max="50" value="10" step="1">
        <span id="tele-speed-val" class="tele-lbl">10</span>
      </div>
      <!-- Font size -->
      <div class="tele-ctrl-grp">
        <span class="tele-lbl">Fonte</span>
        <select id="tele-fs" class="tele-select">
          <option value="auto">Auto</option>
          <option value="20">20</option>
          <option value="26">26</option>
          <option value="32">32</option>
          <option value="40">40</option>
          <option value="48">48</option>
          <option value="56">56</option>
        </select>
      </div>
      <!-- Text color -->
      <div class="tele-ctrl-grp">
        <span class="tele-lbl">Cor</span>
        <select id="tele-tc" class="tele-select">
          <option value="white">Branco</option>
          <option value="yellow">Amarelo</option>
          <option value="green">Verde</option>
          <option value="cream">Creme</option>
        </select>
      </div>
      <!-- Background -->
      <div class="tele-ctrl-grp">
        <span class="tele-lbl">BG</span>
        <select id="tele-theme" class="tele-select">
          <option value="black">Preto</option>
          <option value="softblack">Cinza escuro</option>
          <option value="darkblue">Azul noite</option>
          <option value="darkgreen">Verde noite</option>
        </select>
      </div>
      <!-- Mirror -->
      <button type="button" class="tele-icon-btn" id="tele-mirror-btn" title="Espelhar texto">⟺</button>
      <!-- Edit / Read toggle -->
      <button type="button" class="tele-edit-btn" id="tele-mode-btn" onclick="teleToggleMode()">✏ Editar</button>
      <!-- Reset -->
      <button type="button" class="tele-icon-btn" id="tele-reset-btn" title="Voltar ao início">⏮</button>
      <!-- Play/Pause -->
      <button type="button" class="tele-play-btn" id="tele-play-btn" onclick="teleToggle()">▶ Iniciar</button>
      <button type="button" class="tele-close" onclick="teleStop();this.closest('.tele-overlay').remove()">✕</button>
    </div>
    <div class="tele-progress-bar"><div class="tele-progress-fill" id="tele-progress-fill"></div></div>
    <div class="tele-body" id="tele-body">
      <div class="tele-fade-top"></div>
      <div class="tele-fade-bot"></div>

        <div class="tele-content" id="tele-content">${buildReadHTML()}<div style="height:50vh"></div></div>

      <div class="tele-word-count">${wordCount} palavras</div>

  document.body.appendChild(ov);
  applyTheme();
  applyFontSize();
  applyContentTransform(0);

  const spEl=ov.querySelector('#tele-speed');
  const spVal=document.getElementById('tele-speed-val');
  if(spEl&&spVal){
    spVal.textContent=spEl.value;

  }
  ov.querySelector('#tele-fs')?.addEventListener('change',applyFontSize);
  ov.querySelector('#tele-tc')?.addEventListener('change',applyTheme);
  ov.querySelector('#tele-theme')?.addEventListener('change',function(){
    ov.setAttribute('data-theme',this.value);
    applyTheme();
  });
  ov.querySelector('#tele-mirror-btn')?.addEventListener('click',function(){
    _mirror=!_mirror;
    this.classList.toggle('active',_mirror);
    applyContentTransform(_y);
  });
  ov.querySelector('#tele-reset-btn')?.addEventListener('click',function(){
    teleStop();
    _y=0;
    applyContentTransform(0);
    const pf=document.getElementById('tele-progress-fill');
    if(pf)pf.style.width='0%';
  });

  window.teleToggleMode=function(){
    _mode=_mode==='read'?'edit':'read';
    const btn=document.getElementById('tele-mode-btn');
    const body=document.getElementById('tele-body');
    if(!body)return;
    if(_mode==='edit'){
      teleStop();
      if(btn)btn.textContent='✓ Concluído';
      body.innerHTML=buildEditHTML();
    } else {
      // save edits back
      const _editedBlocks=[];
      teleBlocks.forEach((b,i)=>{const el=document.getElementById('tele-edit-'+i);if(el){if(el.value.trim()!==b.text.trim())_editedBlocks.push({id:b.id,text:el.value});b.text=el.value;}});
      if(btn)btn.textContent='✏ Editar';
      if(_editedBlocks.length>0){
        const _sb=document.createElement('div');
        _sb.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c1c1a;color:#fff;padding:14px 20px;border-radius:12px;z-index:99999;box-shadow:0 8px 32px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px;font-family:monospace;font-size:12px;white-space:nowrap';
        _sb.innerHTML='<span>✏ '+_editedBlocks.length+' bloco(s) editado(s). Aplicar no roteiro?</span>'
          +'<button id="tele-sync-yes" style="padding:6px 14px;border-radius:6px;border:none;background:#4f98a3;color:#fff;cursor:pointer;font-family:monospace;font-weight:600">Aplicar</button>'
          +'<button id="tele-sync-no" style="padding:6px 10px;border-radius:6px;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);cursor:pointer">Manter original</button>';
        document.body.appendChild(_sb);
        document.getElementById('tele-sync-yes').onclick=function(){
          const toHtml=function(txt){return window.esc(txt||'').replace(/\n/g,'<br>');};
          _editedBlocks.forEach(function(e){
            if(S.draft){
              const b=S.draft.blocks.find(x=>x.id===e.id);
              if(b)b.audio=toHtml(e.text);
              const field=document.getElementById('audio-'+e.id);
              if(field)field.innerHTML=toHtml(e.text);
              if(typeof window.calcBlockTime==='function')window.calcBlockTime(e.id);
            }
            if(S.roteiros){
              S.roteiros.forEach(r=>{const b=r.blocks&&r.blocks.find(x=>x.id===e.id);if(b)b.audio=toHtml(e.text);});
            }
          });
          window.updatePreview&&window.updatePreview();
          window.saveAndStay&&window.saveAndStay();
          _sb.remove();showToast('✅ Alterações aplicadas ao roteiro!');
        };
        document.getElementById('tele-sync-no').onclick=function(){_sb.remove();showToast('Edição do teleprompter descartada.');};
      }
      body.innerHTML=`
        <div class="tele-fade-top"></div><div class="tele-fade-bot"></div>
        <div class="tele-scroll-area" id="tele-scroll">
          <div class="tele-content" id="tele-content">${buildReadHTML()}<div style="height:50vh"></div></div>
        </div>
        <div class="tele-word-count">${wordCount} palavras</div>`;
      applyTheme();applyFontSize();applyContentTransform(_y);
    }
  };
  window.teleToggle=function(){if(_playing)teleStop();else teleStart();};
  window.teleStart=function(){
    _playing=true;
    const btn=document.getElementById('tele-play-btn');if(btn)btn.textContent='⏸ Pausar';
    const content=document.getElementById('tele-content');const scroll=document.getElementById('tele-scroll');
    if(!content||!scroll)return;
    const maxY=content.offsetHeight-scroll.offsetHeight;
    let last=null;
    function step(ts){
      if(!_playing)return;
      if(!last)last=ts;
      const speed=parseFloat(document.getElementById('tele-speed')?.value||10);
      const dy=(ts-last)*speed*0.0038;last=ts;
      _y=Math.min(_y+dy,maxY);
      applyContentTransform(_y);
      const pct=maxY>0?(_y/maxY)*100:0;
      const pf=document.getElementById('tele-progress-fill');if(pf)pf.style.width=pct+'%';
      if(_y>=maxY){teleStop();return;}
      _anim=requestAnimationFrame(step);
    }
    _anim=requestAnimationFrame(step);
  };
  window.teleStop=function(){
    _playing=false;
    const btn=document.getElementById('tele-play-btn');if(btn)btn.textContent='▶ Iniciar';
    if(_anim)cancelAnimationFrame(_anim);
  };
  // keyboard shortcuts
  ov.addEventListener('keydown',function(e){
    if(e.key===' '){e.preventDefault();teleToggle();}
    if(e.key==='Escape'){teleStop();ov.remove();}
    if(e.key==='ArrowUp'){_y=Math.max(0,_y-80);applyContentTransform(_y);}
    if(e.key==='ArrowDown'){_y=_y+80;applyContentTransform(_y);}
  });
  ov.setAttribute('tabindex','0');ov.focus();
};

// ── SPRINT TIMER ─────────────────────────────────────────────────
window._sprint={running:false,interval:null,remaining:0,duration:25*60,startWords:0};

function sprintWordCount(){
  if(!S.draft)return 0;
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim();};
  let w=0;
  S.draft.blocks.forEach(b=>{
    const el=document.getElementById('audio-'+b.id);
    const txt=el?el.innerHTML:b.audio;
    w+=strip(txt).split(/\s+/).filter(Boolean).length;
  });
  return w;
}

function sprintUpdateUI(){
  const disp=document.getElementById('sprint-timer-display');
  const fill=document.getElementById('sprint-progress-fill');
  const wordsEl=document.getElementById('sprint-words');
  if(!disp)return;
  const r=window._sprint.remaining;
  const m=Math.floor(r/60);const s=r%60;
  disp.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  disp.className='sprint-timer-display'+(window._sprint.running?' running':'')+(r<=60&&r>0?' urgent':'');
  if(fill){const pct=(1-r/window._sprint.duration)*100;fill.style.width=pct+'%';}
  const wordsNow=sprintWordCount();
  const diff=Math.max(0,wordsNow-window._sprint.startWords);
  if(wordsEl)wordsEl.textContent=diff>0?`+${diff} palavras na sessão`:'';
}

window.sprintStart=function(){
  if(window._sprint.running){
    // pause
    clearInterval(window._sprint.interval);window._sprint.running=false;
    const btn=document.getElementById('sprint-start-btn');if(btn){btn.textContent='▶ Continuar';btn.classList.remove('active');}
    sprintUpdateUI();return;
  }
  if(window._sprint.remaining===0){
    const sel=document.getElementById('sprint-sel');
    window._sprint.duration=(parseInt(sel?.value)||25)*60;
    window._sprint.remaining=window._sprint.duration;
    window._sprint.startWords=sprintWordCount();
  }
  window._sprint.running=true;
  const btn=document.getElementById('sprint-start-btn');if(btn){btn.textContent='⏸ Pausar';btn.classList.add('active');}
  window._sprint.interval=setInterval(()=>{
    window._sprint.remaining--;
    sprintUpdateUI();
    if(window._sprint.remaining<=0){
      clearInterval(window._sprint.interval);window._sprint.running=false;
      const wordsWritten=Math.max(0,sprintWordCount()-window._sprint.startWords);
      const toast=document.createElement('div');toast.className='sprint-complete-toast';
      toast.textContent=`✅ Sprint concluído! +${wordsWritten} palavras escritas`;
      document.body.appendChild(toast);setTimeout(()=>toast.remove(),4000);
      const btn2=document.getElementById('sprint-start-btn');if(btn2){btn2.textContent='▶ Novo Sprint';btn2.classList.remove('active');}
      window._sprint.remaining=0;sprintUpdateUI();
    }
  },1000);
  sprintUpdateUI();
};

window.sprintReset=function(){
  clearInterval(window._sprint.interval);window._sprint.running=false;window._sprint.remaining=0;
  const btn=document.getElementById('sprint-start-btn');if(btn){btn.textContent='▶ Iniciar';btn.classList.remove('active');}
  sprintUpdateUI();
};

// ── STRUCTURE TIMELINE ────────────────────────────────────────────
function buildStructureTimeline(){
  if(!S.draft)return'';
  const blocks=S.draft.blocks;if(!blocks.length)return'';
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').slice(0,40);};
  const faseStyle={
    inicio:{bg:'color-mix(in srgb,var(--fi-bg) 62%,var(--fi-tx))',bd:'var(--fi-tx)',tx:'var(--fi-tx)'},
    meio:{bg:'color-mix(in srgb,var(--fm-bg) 62%,var(--fm-tx))',bd:'var(--fm-tx)',tx:'var(--fm-tx)'},
    fim:{bg:'color-mix(in srgb,var(--ff-bg) 62%,var(--ff-tx))',bd:'var(--ff-tx)',tx:'var(--ff-tx)'}
  };
  const items=blocks.map((b,i)=>{
    const st=faseStyle[b.fase||'meio']||faseStyle.meio;
    const tip=`#${i+1} ${(b.fase||'meio').toUpperCase()}${b.time?' · '+b.time:''}${strip(b.audio)?' — '+strip(b.audio):''}`;
    return`<div class="st-block" style="background:${st.bg};border-color:${st.bd};color:${st.tx}" title="${window.escAttr(tip)}"
      onclick="window.scrollEditorToBlock&&window.scrollEditorToBlock('${b.id}')"
      id="st-${b.id}"><div class="st-block-tip">${window.esc(tip)}</div></div>`;
  }).join('');
  const tot=blocks.length;
  return`<div class="structure-timeline no-print" id="structure-timeline">
    <span class="st-lbl">Estrutura</span>${items}<span class="st-total">${tot} blocos</span>
  </div>`;
}
window.updateStructureTimeline=function(){
  const el=document.getElementById('structure-timeline');
  if(el&&S.draft){
    const tmp=document.createElement('div');tmp.innerHTML=buildStructureTimeline();
    const newEl=tmp.firstElementChild;if(newEl)el.parentNode.replaceChild(newEl,el);
  }
};

// Each block can have alts: [{id, html}] and activeAlt index
window.initAltTabs=function(blockId){
  const b=S.draft?.blocks.find(x=>x.id===blockId);
  if(!b)return;
  if(!b.alts)b.alts=[{id:uid(),html:b.audio||''}];
  if(b.activeAlt===undefined)b.activeAlt=0;
};
window.renderAltTabs=function(blockId){
  const b=S.draft?.blocks.find(x=>x.id===blockId);if(!b)return;
  window.initAltTabs(blockId);
  const tabs=b.alts.map((a,i)=>`<button class="alt-tab-btn ${b.activeAlt===i?'active':''}"
    onclick="window.switchAlt('${blockId}',${i})">V${i+1}</button>`).join('');
  const wrap=document.getElementById('alt-tabs-'+blockId);
  if(wrap){
    const del=b.alts.length>1?`<button class="alt-del-btn" onclick="window.deleteAlt('${blockId}')">✕ V${b.activeAlt+1}</button>`:'';
    wrap.innerHTML=tabs+`<button class="alt-add-btn" onclick="window.addAlt('${blockId}')">+ versão</button>`+del;
  }
};
window.switchAlt=function(blockId,idx){
  const b=S.draft?.blocks.find(x=>x.id===blockId);if(!b)return;
  // save current
  const el=document.getElementById('audio-'+blockId);if(el&&b.alts[b.activeAlt])b.alts[b.activeAlt].html=el.innerHTML;
  b.activeAlt=idx;
  if(el)el.innerHTML=sanitizeHTML(b.alts[idx]?.html||'');
  window.renderAltTabs(blockId);
  window.updatePreview&&window.updatePreview();
};
window.addAlt=function(blockId){
  const b=S.draft?.blocks.find(x=>x.id===blockId);if(!b)return;
  const el=document.getElementById('audio-'+blockId);
  if(el&&b.alts[b.activeAlt])b.alts[b.activeAlt].html=el.innerHTML;
  b.alts.push({id:uid(),html:''});
  b.activeAlt=b.alts.length-1;
  if(el)el.innerHTML='';
  window.renderAltTabs(blockId);
  el?.focus();
};
window.deleteAlt=function(blockId){
  const b=S.draft?.blocks.find(x=>x.id===blockId);if(!b||b.alts.length<=1)return;
  b.alts.splice(b.activeAlt,1);
  b.activeAlt=Math.min(b.activeAlt,b.alts.length-1);
  const el=document.getElementById('audio-'+blockId);if(el)el.innerHTML=sanitizeHTML(b.alts[b.activeAlt]?.html||'');
  window.renderAltTabs(blockId);
};
window.hydrateEditorBlock=function(blockId){
  window.initAltTabs(blockId);
  const mount=document.getElementById('alt-mount-'+blockId);
  if(mount&&!document.getElementById('alt-tabs-'+blockId)){
    const altWrap=document.createElement('div');altWrap.id='alt-tabs-'+blockId;altWrap.className='alt-tabs';
    mount.appendChild(altWrap);
  }
  window.renderAltTabs(blockId);
};

window._revMode={active:false,version:1};
const REV_COLORS=[null,'#3b82f6','#ca8a04','#db2777','#16a34a'];
const REV_NAMES=[null,'V1 — Azul','V2 — Âmbar','V3 — Rosa','V4 — Verde'];
const REV_BG=[null,'#dbeafe','#fef9c3','#fce7f3','#dcfce7'];
function applyRevToggleVisual(){
  const btn=document.getElementById('rev-toggle-btn')||document.getElementById('rev-badge');
  const bar=document.getElementById('revision-mode-bar');
  if(bar)bar.style.display=window._revMode.active?'flex':'none';
  if(!btn)return;
  if(window._revMode.active){
    const v=window._revMode.version;
    btn.textContent='Revisão '+REV_NAMES[v];
    btn.style.borderColor=REV_COLORS[v];
    btn.style.color=REV_COLORS[v];
    btn.style.background=REV_BG[v];
    btn.classList.add('active');
    if(btn.id==='rev-badge')btn.classList.add('on');
    btn.setAttribute('aria-pressed','true');
  }else{
    btn.textContent='Revisão';
    btn.classList.remove('active');
    if(btn.id==='rev-badge'){
      btn.classList.remove('on');
      btn.style.cssText='border-color:var(--border);color:var(--text3);background:transparent;cursor:pointer';
    }else{
      btn.style.borderColor='';
      btn.style.color='';

window.toggleRevisionMode=function(){
  window._revMode.active=!window._revMode.active;
  applyRevToggleVisual();
};
window.setRevColor=function(v){
  window._revMode.version=v;
  applyRevToggleVisual();
  document.querySelectorAll('.rev-color-btn').forEach((b,i)=>b.classList.toggle('active',i+1===v));
};
// ── REVISION MODE ENGINE (beforeinput on .rich-editor) ───────────
const _revListened=new WeakSet();
function attachRevisionToField(el){
  if(!el||_revListened.has(el))return;
  _revListened.add(el);
  el.addEventListener('beforeinput',function(e){
    if(!window._revMode.active)return;
    const v=window._revMode.version;
    const bg=REV_BG[v];
    const insertTypes=['insertText','insertCompositionText'];
    if(e.inputType==='insertFromPaste'||insertTypes.includes(e.inputType)){
      if(!e.data&&e.inputType!=='insertFromPaste')return;
      e.preventDefault();
      const text=e.data||(e.dataTransfer?.getData('text/plain'))||'';
      if(!text)return;
      const span=document.createElement('span');
      span.setAttribute('data-rev',String(v));
      span.style.cssText=`background:${bg};border-radius:2px;padding:0 1px;`;
      span.textContent=text;
      const sel=window.getSelection();
      if(sel&&sel.rangeCount){
        const rng=sel.getRangeAt(0);
        rng.deleteContents();
        rng.insertNode(span);
        rng.setStartAfter(span);rng.collapse(true);
        sel.removeAllRanges();sel.addRange(rng);
      }
      // mark block as revised
      const blockCard=el.closest('[id^="be-"]');
      if(blockCard){
        let badge=blockCard.querySelector('.rev-block-badge');
        if(!badge){
          badge=document.createElement('span');badge.className='rev-block-badge';
          const hd=blockCard.querySelector('.be-hd-row,.be-header,.be-num');
          if(hd)hd.appendChild(badge);else blockCard.prepend(badge);
        }
        badge.textContent='R'+v;
        badge.style.cssText=`font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:3px;margin-left:6px;background:${bg};color:${REV_COLORS[v]};border:1px solid ${REV_COLORS[v]}55;font-weight:700`;
      }
    }
  },true);
  // Visual border on field when rev is active
  el.addEventListener('focus',()=>{if(window._revMode.active)el.style.outline=`2px solid ${REV_COLORS[window._revMode.version]}88`;});
  el.addEventListener('blur',()=>el.style.outline='');
}
// Auto-attach to all rich-editor fields when they appear
const _revObserver=new MutationObserver(()=>{
  document.querySelectorAll('.rich-editor').forEach(attachRevisionToField);
});
_revObserver.observe(document.body,{childList:true,subtree:true});

function revisionBarHTML(){
  return`<div class="revision-mode-bar no-print" id="revision-mode-bar" style="display:none">
    <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">Versão de revisão:</span>
    ${[1,2,3,4].map(v=>`<div class="rev-color-btn ${window._revMode.version===v?'active':''}" style="background:${REV_BG[v]};border-color:${REV_COLORS[v]}"
      onclick="window.setRevColor(${v})" title="${REV_NAMES[v]}"></div>`).join('')}
    ${REV_NAMES.slice(1).map((n,i)=>`<span style="font-family:var(--mono);font-size:9px;color:${REV_COLORS[i+1]};margin-right:4px">${n}</span>`).join('')}
    <span style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-left:auto">Texto novo ficará destacado</span>

window.openReport=function(rId){
  const r=rId?S.roteiros.find(x=>x.id===rId):(S.draft?{...S.draft,blocks:S.draft.blocks.map(b=>{const ae=document.getElementById('audio-'+b.id);return{...b,audio:ae?ae.innerHTML:b.audio};})}:null);
  if(!r){showToast('Salve o roteiro para gerar o relatório.');return;}
  window.collectDOM&&window.collectDOM();
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return(d.textContent||d.innerText||'').trim();};
  const blocks=r.blocks||[];
  const totalWords=blocks.reduce((a,b)=>a+strip(b.audio).split(/\s+/).filter(Boolean).length,0);
  const filledBlocks=blocks.filter(b=>strip(b.audio).length>2).length;
  const pct=blocks.length>0?Math.round((filledBlocks/blocks.length)*100):0;
  // words per speaker
  const speakerWords={};
  blocks.forEach(b=>{
    const sp=b.speaker||'(sem personagem)';
    const w=strip(b.audio).split(/\s+/).filter(Boolean).length;
    speakerWords[sp]=(speakerWords[sp]||0)+w;
  });
  const maxW=Math.max(...Object.values(speakerWords),1);
  const spRows=Object.entries(speakerWords).sort((a,b)=>b[1]-a[1]).map(([name,w])=>{
    const pctW=Math.round((w/maxW)*100);
    return`<div class="report-bar-row">
      <span class="report-bar-lbl">${window.esc(name)}</span>
      <div class="report-bar-track"><div class="report-bar-fill" style="width:${pctW}%;background:var(--primary,#01696f)"></div></div>
      <span class="report-bar-val">${w} pal.</span>
    </div>`;
  }).join('');
  // phase distribution
  const phases={inicio:0,meio:0,fim:0};blocks.forEach(b=>phases[b.fase||'meio']++);
  const phaseColors={inicio:'var(--fi-tx)',meio:'var(--fm-tx)',fim:'var(--ff-tx)'};
  const phaseRows=['inicio','meio','fim'].map(f=>{
    const pf=blocks.length>0?Math.round((phases[f]/blocks.length)*100):0;
    return`<div class="report-bar-row">
      <span class="report-bar-lbl" style="color:${phaseColors[f]};font-weight:500">${f.toUpperCase()}</span>
      <div class="report-bar-track"><div class="report-bar-fill" style="width:${pf}%;background:${phaseColors[f]}"></div></div>
      <span class="report-bar-val">${phases[f]} blocos (${pf}%)</span>
    </div>`;
  }).join('');
  // issues
  const issues=[];
  blocks.forEach((b,i)=>{if(!strip(b.audio))issues.push({num:i+1,id:b.id,msg:'Áudio vazio',type:'warning'});});
  blocks.forEach((b,i)=>{if(!strip(b.video))issues.push({num:i+1,id:b.id,msg:'Vídeo vazio',type:'info'});});
  if(phases.fim===0)issues.push({num:null,id:null,msg:'Nenhum bloco marcado como Fim',type:'warning'});
  if(phases.inicio===0)issues.push({num:null,id:null,msg:'Nenhum bloco marcado como Início',type:'warning'});
  const issuesHTML=issues.length===0
    ?'<p style="font-size:12px;color:var(--text3)">✅ Nenhum problema encontrado.</p>'
    :issues.map(is=>`<div class="report-issue-row" onclick="${is.id?`document.getElementById('be-${is.id}')?.scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('.report-overlay')?.remove()`:''}">
      <span class="report-issue-badge" style="background:${is.type==='warning'?'#fef9c3':'#f0f9ff'};color:${is.type==='warning'?'#92400e':'#0369a1'}">${is.type==='warning'?'⚠':'ℹ'}</span>
      <span style="font-size:12px">${window.esc(is.msg)}</span>
      ${is.num?`<span style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-left:auto">Bloco #${is.num}</span>`:''}
    </div>`).join('');
  const ov=document.createElement('div');ov.className='report-overlay';
  ov.innerHTML=`<div class="report-box">
    <div class="report-hd">
      <h3>📊 Relatório — ${window.esc(r.title||'Sem título')}</h3>
      <button style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text3)" onclick="this.closest('.report-overlay').remove()">✕</button>
    </div>
    <div class="report-body">
      <div class="report-section">
        <div class="report-section-title">Visão Geral</div>
        <div class="report-stat-grid">
          <div class="report-stat-card"><div class="report-stat-n">${blocks.length}</div><div class="report-stat-l">Blocos</div></div>
          <div class="report-stat-card"><div class="report-stat-n">${totalWords}</div><div class="report-stat-l">Palavras</div></div>
          <div class="report-stat-card"><div class="report-stat-n">${r.duration||'—'}</div><div class="report-stat-l">Duração</div></div>
          <div class="report-stat-card"><div class="report-stat-n">${pct}%</div><div class="report-stat-l">Preenchido</div></div>
        </div>
      </div>
      <div class="report-section">
        <div class="report-section-title">Distribuição de Fases</div>${phaseRows}
      </div>
      <div class="report-section">
        <div class="report-section-title">Palavras por Personagem</div>${spRows||'<p style="font-size:12px;color:var(--text3)">Nenhum personagem cadastrado nos blocos.</p>'}
      </div>
      <div class="report-section">
        <div class="report-section-title">Pontos de Atenção (${issues.length})</div>${issuesHTML}
      </div>
    </div>
    <div class="report-ft">
      <button class="btn btn-sm btn-ghost" onclick="this.closest('.report-overlay').remove()">Fechar</button>
      <button class="btn btn-sm btn-primary" onclick="window.exportPDF?.()">🖨 Imprimir relatório</button>
    </div>
  </div>`;
  document.body.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
};
